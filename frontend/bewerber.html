<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>Profil vervollständigen · TIVE 360°</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root{ --teal:#0d9488; --teal-d:#0f766e; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f1f5f9; --card:#fff; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px 60px}
  .top{display:flex;align-items:center;gap:10px;margin:6px 0 16px}
  .logo{width:34px;height:34px;border-radius:9px;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
  .brand{font-weight:800;font-size:15px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 18px;line-height:1.5}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--teal-d);margin:0 0 12px;font-weight:800}
  label.f{display:block;margin-bottom:12px}
  label.f span{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:var(--ink);font-family:inherit}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal)}
  textarea{min-height:88px;resize:vertical}
  .row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
  .chk{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:600;padding:6px 0}
  .chk input{width:20px;height:20px;flex:0 0 auto}
  .btn{display:block;width:100%;padding:15px;border:none;border-radius:12px;background:var(--teal);color:#fff;font-size:16px;font-weight:800;cursor:pointer}
  .btn:disabled{opacity:.5}
  .btn2{background:#fff;color:var(--teal-d);border:1.5px solid var(--teal)}
  .hint{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:4px}
  .rec{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .rec-btn{flex:0 0 auto;width:64px;height:64px;border-radius:50%;border:none;background:var(--teal);color:#fff;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(13,148,136,.35)}
  .rec-btn.recording{background:#dc2626;animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.4)}50%{box-shadow:0 0 0 12px rgba(220,38,38,0)}}
  .timer{font-family:ui-monospace,Menlo,monospace;font-size:20px;font-weight:800}
  .state{text-align:center;padding:56px 20px;color:var(--muted)}
  .state .big{font-size:44px;margin-bottom:10px}
  .state h1{color:var(--ink)}
  .err{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:10px;padding:11px 13px;font-size:13.5px;margin-bottom:12px}
  audio{width:100%;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="logo">T</div><div class="brand">TIVE 360°</div></div>
  <div id="app"><div class="state"><div class="big">⏳</div>Lädt…</div></div>
</div>
<script>
const SB_URL='https://msdiyjxckmpvuomnhvjp.supabase.co';
const SB_KEY='sb_publishable_exKYOG6Znhj_JlO0v6erQQ_q0HWWiyl';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const app=document.getElementById('app');
const token=new URLSearchParams(location.search).get('t')||'';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function stateBox(icon,title,text){ app.innerHTML='<div class="state"><div class="big">'+icon+'</div><h1>'+esc(title)+'</h1><p class="sub" style="margin-top:8px">'+esc(text)+'</p></div>'; }

// ── Audio-Recorder: MediaRecorder (Handy-Browser), sonst Datei-Aufnahme über das Betriebssystem ──
let mediaRecorder=null, chunks=[], audioBlob=null, audioMime='', recTimer=null, recSecs=0;
const MAXSEC=90;
function pickMime(){ const pref=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/mpeg','audio/ogg'];
  if(!window.MediaRecorder||!MediaRecorder.isTypeSupported) return ''; return pref.find(t=>MediaRecorder.isTypeSupported(t))||''; }
function fmtT(s){ return String(Math.floor(s/60))+':'+String(s%60).padStart(2,'0'); }

async function startRec(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    chunks=[]; audioBlob=null; const mt=pickMime();
    mediaRecorder=new MediaRecorder(stream, mt?{mimeType:mt}:undefined);
    mediaRecorder.ondataavailable=e=>{ if(e.data&&e.data.size>0) chunks.push(e.data); };
    mediaRecorder.onstop=()=>{ audioMime=(mediaRecorder.mimeType||mt||'audio/webm').split(';')[0];
      audioBlob=new Blob(chunks,{type:audioMime}); stream.getTracks().forEach(t=>t.stop()); renderAudio(); };
    mediaRecorder.start(); recSecs=0;
    recTimer=setInterval(()=>{ recSecs++; const t=document.getElementById('recTimer'); if(t)t.textContent=fmtT(recSecs); if(recSecs>=MAXSEC) stopRec(); },1000);
    renderAudio(true);
  }catch(e){ document.getElementById('recFallbackNote').style.display='block'; }
}
function stopRec(){ if(recTimer){clearInterval(recTimer);recTimer=null;} if(mediaRecorder&&mediaRecorder.state!=='inactive'){ try{mediaRecorder.stop();}catch(e){} } }
function resetAudio(){ audioBlob=null; renderAudio(); }
function onFilePick(inp){ const f=inp.files&&inp.files[0]; if(!f) return; audioBlob=f; audioMime=(f.type||'audio/mp4').split(';')[0]; renderAudio(); }

function renderAudio(recording){
  const el=document.getElementById('audioZone'); if(!el) return;
  if(recording){ el.innerHTML='<div class="rec"><button type="button" class="rec-btn recording" onclick="stopRec()">■</button><div><div class="timer" id="recTimer">0:00</div><div class="hint">Nimm auf … tippe zum Stoppen (max. '+MAXSEC+'s)</div></div></div>'; return; }
  if(audioBlob){ const url=URL.createObjectURL(audioBlob);
    el.innerHTML='<audio controls src="'+url+'"></audio><button type="button" class="btn btn2" style="margin-top:10px" onclick="resetAudio()">↺ Neu aufnehmen</button>'; return; }
  el.innerHTML='<div class="rec"><button type="button" class="rec-btn" onclick="startRec()">🎙</button><div class="hint">Tippe und lies den Satz unten laut vor.<br>Kein App-Download nötig.</div></div>'
    +'<div id="recFallbackNote" class="hint" style="display:none;margin-top:10px">Aufnahme im Browser nicht möglich? <label style="color:var(--teal-d);font-weight:700;text-decoration:underline">Sprachnachricht als Datei auswählen<input type="file" accept="audio/*" capture style="display:none" onchange="onFilePick(this)"></label></div>';
}

const LEVELS=['A1','A2','B1','B2','C1','C2','Muttersprache'];
const EDU=['Schulabschluss','Berufsausbildung','Bachelor','Master','Andere'];
function opts(list,val){ return '<option value="">– bitte wählen –</option>'+list.map(x=>'<option'+(String(val)===x?' selected':'')+'>'+x+'</option>').join(''); }

const ALLSEC={contact:1,birthday:1,language:1,audio:1,education:1,experience:1,availability:1,writing_sample:1};
let SEC=ALLSEC;
function renderForm(first, cv, sec){
  const c=cv||{}; SEC=sec||ALLSEC;
  const cards=[];
  if(SEC.contact||SEC.birthday){ cards.push('<div class="card"><h2>Kontakt</h2>'
    +(SEC.contact?(field('E-Mail','email','email',c.email)+field('Telefon','phone','tel',c.phone)):'')
    +(SEC.contact&&SEC.birthday?('<div class="row">'+field('Wohnort','city','text',c.city)+field('Geburtsdatum','birthday','date',c.birthday)+'</div>')
       :SEC.contact?field('Wohnort','city','text',c.city):field('Geburtsdatum','birthday','date',c.birthday))
    +'</div>'); }
  if(SEC.language||SEC.audio){ let s='<div class="card"><h2>Sprache</h2>';
    if(SEC.language){ s+=sel('Deutsch – Sprechen','language_level',LEVELS,c.language_level)
      +sel('Deutsch – Schreiben (Selbsteinschätzung)','writing_level',LEVELS,c.writing_level)
      +field('Weitere Sprachen','languages_str','text',c.languages_str,'z. B. Englisch B2, Albanisch Muttersprache'); }
    if(SEC.audio){ s+='<div style="margin-top:6px"><span style="display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:8px">🎙 Sprachaufnahme <b style="color:var(--teal-d)">(wichtigster Teil)</b></span>'
      +'<div id="audioZone"></div>'
      +'<div class="hint" style="margin-top:12px;background:#f0fdfa;border:1px solid #99f6e4;border-radius:10px;padding:11px 13px;color:var(--teal-d)"><b>Bitte laut vorlesen:</b><br>„Guten Tag, mein Name ist '+esc(first||'')+'. Ich interessiere mich für die Stelle im Kundenservice und freue mich auf das Gespräch mit Ihnen."</div></div>'; }
    s+='</div>'; cards.push(s); }
  if(SEC.education){ cards.push('<div class="card"><h2>Ausbildung</h2>'
    +field('Ausbildung / Beruf','education','text',c.education,'z. B. BWL, IT, Kaufmann/-frau')
    +sel('Abschluss','education_level',EDU,c.education_level)+'</div>'); }
  if(SEC.experience){ cards.push('<div class="card"><h2>Erfahrung</h2>'
    +field('Berufserfahrung (Jahre)','experience_years','number',c.experience_years,'z. B. 2')
    +area('Bisherige Stationen','work_history',c.work_history,'Wo hast du zuletzt gearbeitet? Kurz genügt.')+'</div>'); }
  if(SEC.availability){ cards.push('<div class="card"><h2>Verfügbarkeit</h2>'
    +'<div class="row">'+field('Frühester Start','available_from','date',c.available_from)+sel('Arbeitsmodell','homeoffice_pref',['Vor Ort','Homeoffice','Hybrid'],c.homeoffice_pref)+'</div>'
    +sel('Stunden pro Tag','work_hours',['4','5','6','7','8'],c.work_hours)
    +'<label class="chk"><input type="checkbox" id="f_weekend"'+(c.weekend?' checked':'')+'/> Ich kann am <b>Samstag</b> arbeiten</label>'
    +'<label class="chk"><input type="checkbox" id="f_sunday"'+(c.sunday?' checked':'')+'/> Ich kann am <b>Sonntag / Feiertag</b> arbeiten</label>'+'</div>'); }
  if(SEC.writing_sample){ cards.push('<div class="card"><h2>Schriftprobe</h2>'
    +area('Schreib uns ein paar Sätze','writing_sample',c.writing_sample,'Warum passt der Kundenservice zu dir? 3–4 Sätze auf Deutsch.')+'</div>'); }
  app.innerHTML=''
  +'<h1>Hallo '+esc(first||'')+' 👋</h1>'
  +'<p class="sub">Danke für deine Bewerbung! Ergänze bitte die letzten Angaben zu deinem Profil. Das dauert wenige Minuten und hilft uns, dich richtig einzuschätzen.</p>'
  +'<div id="formErr"></div>'
  +cards.join('')
  +'<button class="btn" id="submitBtn" onclick="submitForm()">Profil absenden</button>'
  +'<p class="hint" style="text-align:center;margin-top:14px">Deine Angaben gehen direkt an dein bestehendes Bewerbungsprofil.</p>';
  if(SEC.audio) renderAudio();
}
function field(label,id,type,val,ph){ return '<label class="f"><span>'+label+'</span><input id="f_'+id+'" type="'+type+'" value="'+esc(val)+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+'/></label>'; }
function area(label,id,val,ph){ return '<label class="f"><span>'+label+'</span><textarea id="f_'+id+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+'>'+esc(val)+'</textarea></label>'; }
function sel(label,id,list,val){ return '<label class="f"><span>'+label+'</span><select id="f_'+id+'">'+opts(list,val)+'</select></label>'; }
const gv=id=>{ const e=document.getElementById('f_'+id); return e?e.value.trim():undefined; };

function blobToDataUrl(b){ return new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>res(null); r.readAsDataURL(b); }); }

async function submitForm(){
  const btn=document.getElementById('submitBtn'); btn.disabled=true; btn.textContent='Sende …';
  const fields={ email:gv('email'), phone:gv('phone'), city:gv('city'), birthday:gv('birthday'),
    language_level:gv('language_level'), writing_level:gv('writing_level'), languages_str:gv('languages_str'),
    education:gv('education'), education_level:gv('education_level'),
    experience_years:gv('experience_years'), work_history:gv('work_history'),
    available_from:gv('available_from'), homeoffice_pref:gv('homeoffice_pref'), work_hours:gv('work_hours'),
    weekend:(document.getElementById('f_weekend')||{}).checked, sunday:(document.getElementById('f_sunday')||{}).checked,
    writing_sample:gv('writing_sample') };
  let audio=null;
  if(audioBlob){ const data=await blobToDataUrl(audioBlob); if(data) audio={data, mime:audioMime||'audio/webm'}; }
  let res; try{ res=await sb.functions.invoke('cv-enrich',{body:{action:'submit',token,fields,audio}}); }
  catch(e){ res={error:e}; }
  const data=res.data, reset=(m)=>{ document.getElementById('formErr').innerHTML='<div class="err">'+esc(m)+'</div>'; window.scrollTo(0,0); btn.disabled=false; btn.textContent='Profil absenden'; };
  if(res.error || !data){ return reset('Netzwerkfehler. Bitte prüfe deine Verbindung und versuch es erneut.'); }
  if(data.ok){ return stateBox('✅','Vielen Dank!','Dein Profil ist bei uns eingegangen. Wir melden uns bei dir.'); }
  if(data.code==='used'){ return showFail('used'); }
  reset((data&&data.error)||'Konnte nicht gespeichert werden.');
}

// Unterscheidbare Meldungen je nach Grund (statt pauschal „ungültig").
function showFail(code,msg){
  if(code==='expired') return stateBox('⌛','Link abgelaufen','Dieser Link ist nicht mehr gültig. Melde dich bei uns, dann schicken wir dir einen neuen.');
  if(code==='used')    return stateBox('✅','Schon erledigt','Du hast dein Profil bereits ergänzt. Vielen Dank! Melde dich bei uns, falls du etwas ändern möchtest.');
  if(code==='not_found'||code==='no_token'||code==='no_profile') return stateBox('🔗','Link ungültig','Bitte öffne den Link genau so, wie du ihn von uns bekommen hast. Am besten direkt aus der Nachricht antippen.');
  return stateBox('⚠️','Etwas ist schiefgelaufen', msg||'Bitte versuch es später noch einmal.');
}
(async function init(){
  if(!token){ return showFail('no_token'); }
  let res; try{ res=await sb.functions.invoke('cv-enrich',{body:{action:'load',token}}); }
  catch(e){ res={error:e}; }
  if(res.error){ return stateBox('⚠️','Konnte nicht laden','Der Server ist gerade nicht erreichbar. Bitte versuch es in ein paar Minuten noch einmal.'); }
  const data=res.data;
  if(!data){ return stateBox('⚠️','Konnte nicht laden','Bitte versuch es später noch einmal.'); }
  if(data.ok===false){ return showFail(data.code, data.error); }
  if(data.used){ return showFail('used'); }
  renderForm(data.first_name, data.cv, data.sections);
})();
</script>
</body>
</html>
