        <input type="date" className={'imp-date'+(ko?' crit':'')} value={ss.b||''} onChange={e=>patchDate(k,'due_date',e.target.value)} title="Ende"/>
        <ImpEffortChip it={k} C={C} onPick={n2=>onPatch(k,{effort_days:n2})} compact/>
        {n>0&&<span className="cm" title="Kommentare zu diesem Schritt stehen unten im Verlauf">💬 {n}</span>}
        {canDelete&&onDelete&&<button className="cm" title="Schritt löschen" onClick={()=>onDelete(k)}>✕</button>}
      </div>
    </div>; };
    return <div className="imp-card">
      <div className="imp-dhead">
        <div className="imp-crumbs">{narrow&&<button className="imp-btn link" style={{padding:'0 6px 0 0'}} onClick={()=>setMobileOpen(false)}>‹ Themen</button>}<span>THEMA {idxOf(it)}</span><span>·</span><span className={'imp-chip mono '+(it.origin==='client'?'imp-side-client':'imp-side-team')}>von {it.origin==='client'?labels.clientLong:labels.teamLong} genannt</span><span style={{marginLeft:'auto'}}><ImpStatusPill it={it} C={C} onPick={x=>setStatus(it,x)}/></span></div>
        <div className="imp-h3"><ImpTitle it={it} onSave={t=>onPatch(it,{title:t})} big/></div>
        <div className="imp-facts">
          <div className="imp-fact"><div className="k">Verantwortlich</div><div className="v"><ImpOwnerChip it={it} choices={choices} labels={labels} onPick={(nm,sd)=>onPatch(it,{owner_name:nm,owner_side:nm?sd:null})}/></div></div>
          <div className="imp-fact"><div className="k">Zeitraum</div><div className={'v'+(od?' crit':'')}>{leaf
            ? <React.Fragment><input type="date" className="imp-date" value={s.a||''} onChange={e=>patchDate(it,'start_date',e.target.value)} title="Start"/><span style={{color:'var(--muted,#64748b)'}}>bis</span><input type="date" className={'imp-date'+(od?' crit':'')} value={s.b||''} onChange={e=>patchDate(it,'due_date',e.target.value)} title="Ende"/></React.Fragment>
            : (s.a||s.b?<span>{s.a?impFmtD(s.a):'?'} bis {s.b?impFmtD(s.b):'?'}</span>:<span style={{color:'#ca8a04'}}>aus den Schritten</span>)}</div></div>
          <div className="imp-fact"><div className="k">Aufwand</div><div className="v"><ImpEffortChip it={it} C={C} onPick={n2=>onPatch(it,{effort_days:n2})}/></div></div>
          <div className="imp-fact"><div className="k">Fortschritt</div><div className="v"><span>{p} %</span><span style={{flex:1,minWidth:40}}><span className="imp-prog" style={{display:'block'}}><i style={{width:p+'%',background:od?'#dc2626':st==='erledigt'?'#16a34a':'#12b3b3'}}/></span></span></div></div>
          <div className="imp-fact"><div className="k">Priorität</div><div className="v"><select className="imp-sel" value={it.priority||'wichtig'} onChange={e=>onPatch(it,{priority:e.target.value})} style={{color:pr.c,fontWeight:700}}>{IMP_PRIO.map(x=><option key={x.k} value={x.k}>{x.l}</option>)}</select></div></div>
        </div>
      </div>
      <div className={'imp-dbody'+(narrow?' one':'')}>
        <div>
          <div className="imp-sec"><div className="imp-sech"><span className="t">Maßnahme</span><span className="n">was {labels.teamLong||'wir'} {canEditMeasures?'tun':'tut'}</span></div>
            {canEditMeasures
              ? <div className={'imp-measure'+(!hasM&&meas===null?' empty':'')} onClick={()=>{ if(meas===null&&!hasM) setMeas(''); }}>
                  {(hasM||meas!==null)?<textarea autoFocus={meas!==null&&!hasM} value={mv} onChange={e=>setMeas(e.target.value)} placeholder="Was tun wir konkret? Ein bis drei Sätze."/>:'Noch keine Maßnahme. Hier klicken und eintragen.'}
                  {meas!==null&&meas!==(it.measures||'')&&<div style={{display:'flex',gap:6,marginTop:8}}><button className="imp-btn primary" onClick={()=>{ onPatch(it,{measures:meas.trim()||null}); setMeas(null); }}>Speichern</button><button className="imp-btn" onClick={()=>setMeas(null)}>Verwerfen</button></div>}
                </div>
              : <div className={'imp-measure'+(hasM?'':' empty')}>{hasM?it.measures:'Noch keine Maßnahme hinterlegt.'}</div>}
          </div>
          <div className="imp-sec"><div className="imp-sech"><span className="t">Schritte</span><span className="n">{ks.length?ks.filter(k=>C.state(k)==='erledigt').length+' von '+ks.length+' erledigt · Gewicht '+C.weight(it)+' '+(C.weight(it)===1?'Tag':'Tage'):'noch keine'}</span><span className="sp"/><button className="imp-btn link" onClick={()=>setNewSub({parent:it.id,val:''})}>+ Schritt</button></div>
            <div className="imp-steps">{ks.map(stepRow)}
              {newSub&&newSub.parent===it.id&&<div style={{display:'flex',gap:6,padding:'4px 0'}}><input autoFocus className="imp-in" value={newSub.val} onChange={e=>setNewSub(x=>({...x,val:e.target.value}))} onKeyDown={async e=>{ if(e.key==='Escape') setNewSub(null); if(e.key==='Enter'&&newSub.val.trim()){ if(await onAdd(it.id,newSub.val.trim())) setNewSub(null); } }} placeholder="Neuer Schritt … (Enter speichert, Esc bricht ab)"/><button className="imp-btn primary" disabled={!newSub.val.trim()} onClick={async()=>{ if(await onAdd(it.id,newSub.val.trim())) setNewSub(null); }}>Anlegen</button><button className="imp-btn" onClick={()=>setNewSub(null)}>✕</button></div>}
              {!ks.length&&!newSub&&<div style={{fontSize:12.5,color:'var(--muted,#64748b)'}}>Ohne Schritte gilt das Thema als ein Punkt: Zustand oben, Termin und Aufwand in der Faktenleiste.</div>}
            </div>
          </div>
          <div className="imp-sec"><div className="imp-sech"><span className="t">Abhängigkeit</span></div>
            <div className={'imp-dep'+(C.depConflict(it)?' conflict':'')}><span className="arrow">⛓</span><span>wartet auf</span><select className="imp-sel" value={it.depends_on||''} onChange={e=>onPatch(it,{depends_on:e.target.value||null})}><option value="">nichts</option>{depOptions(it).map(o=><option key={o.id} value={o.id}>{(o.parent_id&&C.byId[o.parent_id]?'› ':'')+o.title}</option>)}</select>{pred&&C.depConflict(it)&&<span>⚠ startet vor dem Ende von „{pred.title}" ({impFmtD(C.span(pred).b)})</span>}</div>
            {dependents.length>0&&<div className="imp-dep" style={{marginTop:6}}><span className="arrow">→</span><span>{dependents.map(d=>'„'+d.title+'"').join(', ')} {dependents.length===1?'wartet':'warten'} auf dieses Thema</span></div>}
          </div>
          {canDelete&&onDelete&&<div className="imp-sec" style={{display:'flex',justifyContent:'flex-end'}}><button className="imp-btn danger" onClick={()=>onDelete(it)}>Thema löschen</button></div>}
        </div>
        <div>
          <div className="imp-sec"><div className="imp-sech"><span className="t">Verlauf</span><span className="n">{thread.length} {thread.length===1?'Kommentar':'Kommentare'}</span></div>
            <div className="imp-thread">{thread.length===0&&<div style={{fontSize:12.5,color:'var(--muted,#64748b)'}}>Noch keine Kommentare. Fragen, Zusagen und Rückmeldungen beider Seiten landen hier.</div>}
              {thread.map(c=><div key={c.id} className={'imp-msg'+(c.side==='client'?' client':'')}>{av(labels.commentAuthor(c),c.side)}<div className="b"><b>{labels.commentAuthor(c)}</b><span className="when">{impFmtD(c.created_at)}</span>{c._step&&<span className="ctx">zu „{c._step}"</span>}<p>{c.body}</p></div></div>)}
            </div>
            <div className="imp-compose"><input value={cmt} onChange={e=>setCmt(e.target.value)} onKeyDown={async e=>{ if(e.key==='Enter'&&cmt.trim()){ if(await onComment(it.id,cmt.trim())) setCmt(''); } }} placeholder={'Kommentar an '+(canEditMeasures?(labels.clientLong||'den Kunden'):(labels.teamLong||'das Team'))+' …'}/><button className="imp-btn primary" disabled={!cmt.trim()} onClick={async()=>{ if(await onComment(it.id,cmt.trim())) setCmt(''); }}>Senden</button></div>
          </div>
          <div className="imp-sec"><div className="imp-sech"><span className="t">Stand</span></div>
            <div style={{fontSize:12,color:'var(--muted,#64748b)',display:'flex',flexDirection:'column',gap:4}}>
              {it.updated_at&&<div><span style={{fontFamily:'var(--mono,monospace)',fontSize:10.5,marginRight:8}}>{impFmtD(it.updated_at)}</span>zuletzt geändert</div>}
              {it.created_at&&<div><span style={{fontFamily:'var(--mono,monospace)',fontSize:10.5,marginRight:8}}>{impFmtD(it.created_at)}</span>angelegt{it.created_by_name?' von '+it.created_by_name:''}</div>}
            </div>
          </div>
        </div>
      </div>
    </div>; })();
  // ── Zeitachse: Kalenderwochen, ein Balken je Thema aus echten Terminen. Ohne Termin: Liste darunter. ──
  const timelineEl=(()=>{ const dated=C.tops.map(t=>({t,s:C.span(t)})).filter(x=>x.s.a||x.s.b); const undated=C.tops.filter(t=>!C.span(t).a&&!C.span(t).b&&C.state(t)!=='erledigt');
    if(!dated.length) return <div className="imp-card"><div className="imp-empty"><div className="h">Noch keine Termine</div>Die Zeitachse erscheint, sobald ein Thema oder ein Schritt Start und Ende hat.</div></div>;
    const ms=dated.flatMap(x=>[x.s.a,x.s.b].filter(Boolean).map(d=>+new Date(d+'T00:00:00'))); const nowMs=+new Date(C.today+'T00:00:00');
    let t0=Math.min(nowMs,...ms), t1=Math.max(nowMs,...ms); const d0=new Date(t0); d0.setDate(d0.getDate()-((d0.getDay()+6)%7)); t0=+d0; if(t1-t0<6*7*864e5) t1=t0+6*7*864e5; const weeks=Math.min(26,Math.ceil((t1-t0)/(7*864e5))); t1=t0+weeks*7*864e5;
    const X=d=>Math.max(0,Math.min(100,((+new Date(String(d).slice(0,10)+'T00:00:00'))-t0)/(t1-t0)*100)); const cols='minmax(160px,240px) repeat('+weeks+',1fr)';
    const wk=Array.from({length:weeks},(_,i)=>{ const d=new Date(t0+i*7*864e5); return {l:'KW '+impIsoWeek(d), now:nowMs>=+d&&nowMs<+d+7*864e5}; });
    return <div className="imp-card imp-fp">
      <div className="imp-fpgrid" style={{gridTemplateColumns:cols}}><div/>{wk.map((w,i)=><div key={i} className={'imp-fpwk'+(w.now?' now':'')}>{w.l}</div>)}</div>
      {dated.map(({t,s})=>{ const st=C.state(t); const od=C.overdue(t); const cls=od?' crit':st==='erledigt'?' done':''; const p=C.pct(t); return <div key={t.id} className="imp-fprow" style={{gridTemplateColumns:'minmax(160px,240px) 1fr'}}>
        <div className="imp-fplbl" onClick={()=>{ setMode('akte'); pick(t.id); }} title={t.title}>{idxOf(t)} {t.title}</div>
        <div className="imp-fplane"><div className="imp-fptoday" style={{left:X(C.today)+'%'}}/>
          {s.a&&s.b?<div className={'imp-fpbar'+cls} style={{left:X(s.a)+'%',width:Math.min(100-X(s.a),Math.max(1.2,X(s.b)+((864e5)/(t1-t0))*100-X(s.a)))+'%'}} title={impFmtD(s.a)+' bis '+impFmtD(s.b)+' · '+p+' %'}><i style={{width:p+'%'}}/><span>{p} % · {t.owner_name||'wer?'}</span></div>
           :<div className={'imp-fpmark'+(od?' crit':'')} style={{left:X(s.b||s.a)+'%'}} title={(s.b?'Ende '+impFmtD(s.b)+', kein Start':'Start '+impFmtD(s.a)+', kein Ende')}/>}
        </div></div>; })}
      {undated.length>0&&<div style={{marginTop:14,fontSize:12.5,color:'var(--muted,#64748b)'}}><span className="imp-eyebrow light">Ohne Termin · {undated.length}</span><div style={{marginTop:6,display:'flex',flexWrap:'wrap',gap:6}}>{undated.map(t=><button key={t.id} className="imp-chip" style={{border:'1px dashed var(--border,#e5e7eb)',background:'transparent',color:'var(--text,#0f172a)',cursor:'pointer',fontWeight:600}} onClick={()=>{ setMode('akte'); pick(t.id); }}>{idxOf(t)} {t.title}</button>)}</div></div>}
    </div>; })();
  return <React.Fragment>
    <style>{IMP_CSS}</style>
    {stageEl}
    {watchEl}
    {mode==='zeit' ? timelineEl
      : narrow ? (mobileOpen&&selIt ? detailEl : listEl)
      : <div className="imp-akte">{listEl}{detailEl}</div>}
  </React.Fragment>;
}
// ── Ende geteilter Kern ──
// Optimierungen (Kundenansicht): gemeinsamer Plan, Kunde arbeitet aktiv mit (anlegen, Zustand, Termine, Verantwortliche,
// Aufwand, Vorgänger, Kommentare). AUSNAHME: unsere Maßnahmen (measures) pflegt nur TIVE (RLS-Trigger schützt sie); kein Löschen.
function ClientPlanView({client}){
  const [items,setItems]=useState(null); const [comments,setComments]=useState({}); const [emps,setEmps]=useState([]);
  const [narrow,setNarrow]=useState(()=>window.innerWidth<820);
  useEffect(()=>{ const h=()=>setNarrow(window.innerWidth<820); window.addEventListener('resize',h); return ()=>window.removeEventListener('resize',h); },[]);
  const load=async()=>{ try{ const {data}=await sb.from('improvement_items').select('*').eq('project_id',client.project_id).order('sort_order',{ascending:true}); const its=data||[]; setItems(its); const ids=its.map(i=>i.id); if(ids.length){ const {data:cs}=await sb.from('improvement_comments').select('*').in('item_id',ids).order('created_at',{ascending:true}); const m={}; (cs||[]).forEach(c=>{ (m[c.item_id]=m[c.item_id]||[]).push(c); }); setComments(m); } else setComments({}); }catch(e){ setItems([]); } };
  useEffect(()=>{ load(); (async()=>{ setEmps(await loadEmployeesForClient(client.project_id)); })(); },[]);
  const OVH=['Teamleiter','Projektleiter','Trainer','QM','Supervisor'];
  const teamNames=[...new Set((emps||[]).filter(e=>e&&OVH.includes(e.position)).map(e=>((e.first_name||'')+' '+(e.last_name||'')).trim()).filter(Boolean))];
  const clientName=client.name||'Kunde';
  const labels={client:'Sie',team:'TIVE',clientLong:clientName,teamLong:'TIVE 360°',commentAuthor:c=>c.side==='client'?'Sie':(c.author_name||'TIVE 360°')};
  async function onPatch(it,patch){ setItems(prev=>(prev||[]).map(i=>i.id===it.id?{...i,...patch}:i));
    const {error}=await sb.from('improvement_items').update({...patch,updated_at:new Date().toISOString()}).eq('id',it.id);
    if(error){ window.alert('Nicht gespeichert: '+(error.message||'')); load(); return false; } return true; }
  async function onAdd(parentId,title){ const all=items||[]; const sibs=all.filter(i=>(i.parent_id||null)===(parentId||null)); const ord=Math.max(0,...sibs.map(s=>s.sort_order||0))+1;
    const {error}=await sb.from('improvement_items').insert({project_id:client.project_id,parent_id:parentId||null,title,origin:'client',priority:'wichtig',status:'offen',progress:0,effort_days:1,sort_order:ord,created_by_name:clientName});
    if(error){ window.alert('Nicht angelegt: '+(error.message||'')); return false; } await load(); return true; }
  async function onComment(itemId,body){ const {error}=await sb.from('improvement_comments').insert({item_id:itemId,project_id:client.project_id,side:'client',author_name:clientName,body}); if(error){ window.alert('Kommentar fehlgeschlagen: '+(error.message||'')); return false; } load(); return true; }
  const stage={name:client.project||clientName,eyebrow:'Gemeinsam mit TIVE 360° geführt'};
  return <div>
    {items===null? <div style={{color:'#94a3b8'}}>Lädt…</div>
     : <ImpPlanGrid items={items} comments={comments} narrow={narrow} labels={labels} ownerChoices={{team:teamNames,client:[clientName]}} canEditMeasures={false} canDelete={false} onPatch={onPatch} onAdd={onAdd} onDelete={null} onComment={onComment} stage={stage}/>}
  </div>;
}

// Faden-Schlüssel für den Gelesen-Status: '<project>|team' oder '<project>|emp|<empId>'.
function cmThreadKey(projectId, recipEmpId){ return projectId+'|'+(recipEmpId?('emp|'+recipEmpId):'team'); }

// S6/S6b: Kanal Kunde ↔ Team. recipient_employee_id=null → Teamleitung; gesetzt → Direktfaden an einen MA.
// Der MA liest/antwortet in seinem Portal; Teamleitung/HR sehen jeden Faden mit.
function MessagesView({client, onMsgRead}){
  const [messages,setMessages]=useState(null);
  const [emps,setEmps]=useState([]);
  const [reads,setReads]=useState({});
  const [recip,setRecip]=useState('team');   // 'team' = Teamleitung; sonst employee.id
  const [newMsg,setNewMsg]=useState('');
  const [busy,setBusy]=useState(false);
  const listRef=useRef(null);
  const load=async()=>{ try{ const {data}=await sb.from('client_team_messages').select('*').eq('project_id',client.project_id).order('sent_at',{ascending:true}); setMessages(data||[]); }catch(e){ setMessages([]); } };
  const loadReads=async()=>{ try{ const {data}=await sb.from('client_msg_reads').select('thread_key,last_read_at'); const m={}; (data||[]).forEach(r=>{m[r.thread_key]=r.last_read_at;}); setReads(m); }catch(e){} };
  useEffect(()=>{ load(); loadReads(); const t=setInterval(()=>{load();loadReads();},20000); return ()=>clearInterval(t); },[]);
  useEffect(()=>{ (async()=>{ const e=await loadEmployeesForClient(client.project_id); setEmps((e||[]).slice().sort((a,b)=>String(a.first_name+a.last_name).localeCompare(String(b.first_name+b.last_name),'de'))); })(); },[]);
  const empName=id=>{ const e=emps.find(x=>x.id===id); return e?((e.first_name||'')+' '+(e.last_name||'')).trim():'Mitarbeiter'; };
  const recipId=recip==='team'?null:recip;
  const thread=(messages||[]).filter(m=> recipId? m.recipient_employee_id===recipId : !m.recipient_employee_id );
  const unreadFor=id=>{ const tk=cmThreadKey(client.project_id,id); const lr=reads[tk]; return (messages||[]).filter(m=> (id? m.recipient_employee_id===id : !m.recipient_employee_id) && m.from_side!=='client' && (!lr||new Date(m.sent_at)>new Date(lr)) ).length; };
  const recipLabel=recip==='team'?'die Teamleitung':empName(recipId);
  async function markRead(id){ const tk=cmThreadKey(client.project_id,id); const {error}=await sb.from('client_msg_reads').upsert({thread_key:tk,last_read_at:new Date().toISOString()},{onConflict:'user_id,thread_key'}); if(!error){ loadReads(); onMsgRead&&onMsgRead(); } }
  // Beim Öffnen/Wechseln ans Ende scrollen; sichtbaren Faden als gelesen markieren.
  useEffect(()=>{ const el=listRef.current; if(el) setTimeout(()=>{ el.scrollTop=el.scrollHeight; },30); if(messages && unreadFor(recipId)>0) markRead(recipId); }, [recip, messages]);
  async function send(){
    const txt=newMsg.trim(); if(!txt||busy) return; setBusy(true);
    const {error}=await sb.from('client_team_messages').insert({project_id:client.project_id, from_side:'client', author_name:client.name||'', body:txt, recipient_employee_id:recipId});
    setBusy(false);
    if(error){ window.alert('Nicht gesendet: '+(error.message||'')); return; }
    setNewMsg(''); await load(); markRead(recipId);
  }
  const chip=(key,label,unr,active)=><button key={key} onClick={()=>setRecip(key)} style={{position:'relative',padding:'6px 12px',borderRadius:20,border:'1px solid '+(active?'#1d4ed8':'#cbd5e1'),background:active?'#1d4ed8':'#fff',color:active?'#fff':'#334155',fontSize:12.5,fontWeight:active?700:500,cursor:'pointer',whiteSpace:'nowrap'}}>{label}{unr>0&&<span style={{marginLeft:6,minWidth:16,height:16,borderRadius:8,background:active?'#fff':'#dc2626',color:active?'#1d4ed8':'#fff',fontSize:10,fontWeight:800,display:'inline-flex',alignItems:'center',justifyContent:'center',padding:'0 4px',verticalAlign:'middle'}}>{unr}</span>}</button>;
  return(
    <div>
      <div className="card">
        <div className="card-header"><span className="card-title">💬 Nachrichten</span></div>
        <div className="card-body">
          <div style={{fontSize:12.5,color:'#64748b',marginBottom:10}}>Schreiben Sie der Teamleitung oder einem einzelnen Mitarbeiter. Bei Direktnachrichten antwortet der Mitarbeiter selbst; die Teamleitung liest jeden Verlauf mit.</div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:14,paddingBottom:12,borderBottom:'1px solid #eef2f7'}}>
            {chip('team','Teamleitung',unreadFor(null),recip==='team')}
            {emps.map(e=>chip(e.id,((e.first_name||'')+' '+(e.last_name||'')).trim()||'MA',unreadFor(e.id),recip===e.id))}
          </div>
          <div ref={listRef} className="msg-list" style={{marginBottom:12,maxHeight:420,overflowY:'auto',padding:'4px 0'}}>
            {messages===null ? <div style={{color:'#94a3b8',fontSize:13}}>Lädt…</div>
             : thread.length===0 ? <div style={{color:'#94a3b8',fontSize:13}}>Noch keine Nachrichten mit {recipLabel}. Schreiben Sie unten die erste.</div>
             : thread.map(m=>(
              <div key={m.id} className={`msg ${m.from_side==='client'?'msg-from-client':'msg-from-jsr'}`}>
                <div style={{fontSize:13,lineHeight:1.6,whiteSpace:'pre-wrap'}}>{m.body}</div>
                <div className="msg-meta">{m.from_side==='client'?(m.author_name||client.name):m.from_side==='employee'?(m.author_name||empName(m.recipient_employee_id)):(m.author_name||'Teamleitung')} · {new Date(m.sent_at).toLocaleDateString('de-DE')}</div>
              </div>
            ))}
          </div>
          <textarea className="form-input" style={{width:'100%',resize:'none',height:80,boxSizing:'border-box'}} placeholder={'Nachricht an '+recipLabel+'...'} value={newMsg} onChange={e=>setNewMsg(e.target.value)}/>
          <div style={{marginTop:8}}><button className="btn btn-primary" disabled={busy} onClick={send}>Senden →</button></div>
        </div>
      </div>
    </div>
  );
}

// ── Calendar ──────────────────────────────────────────────
function CalendarView({client}){
  const [events, setEvents]=useState(()=>{
    try{return JSON.parse(localStorage.getItem('jsr_cal_'+client.id)||'[]');}
    catch{return [];}
  });
  const [step, setStep]=useState(0);       // 0=idle 1=start picked
  const [selStart, setSelStart]=useState(null);
  const [selEnd, setSelEnd]=useState(null);
  const [hover, setHover]=useState(null);
  const [showForm, setShowForm]=useState(false);
  const [form, setForm]=useState({title:'',type:'audit',note:'',dateFrom:'',dateTo:''});
  const setF=(k,v)=>setForm(f=>({...f,[k]:v}));

  useEffect(()=>{
    localStorage.setItem('jsr_cal_'+client.id, JSON.stringify(events));
  },[events, client.id]);

  const EVENT_TYPES={
    audit:  {label:'Vor-Ort Audit',    icon:'🔍',color:'#0F5661'},
    visit:  {label:'Vor-Ort Besuch',   icon:'🏢',color:'#2E9E8F'},
    call:   {label:'Telefonkonferenz', icon:'📞',color:'#3B6EA5'},
    meeting:{label:'Besprechung',      icon:'👥',color:'#6C8AA6'},
  };

  function ds(year,month,day){
    return year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
  }
  function fmtDate(s){
    if(!s) return '';
    return new Date(s+'T12:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'});
  }
  function fmtDateLong(s){
    if(!s) return '';
    return new Date(s+'T12:00:00').toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
  }
  function daysBetween(a,b){
    return Math.round((new Date(b)-new Date(a))/86400000)+1;
  }

  const todayStr=ds(new Date().getFullYear(),new Date().getMonth(),new Date().getDate());

  function getEventsForDate(dateStr){
    return events.filter(e=>{
      const a=e.dateFrom||e.date||'';
      const b=e.dateTo||e.date||a;
      return dateStr>=a && dateStr<=b;
    });
  }

  // Current highlight range
  const rangeA = selStart && hover
    ? (selStart<=hover ? selStart : hover)
    : selStart;
  const rangeB = selStart && hover
    ? (selStart<=hover ? hover : selStart)
    : selStart;

  function handleDayClick(dateStr, isPast){
    if(isPast) return;
    if(step===0){
      // First click: set start
      setSelStart(dateStr);
      setHover(dateStr);
      setStep(1);
    } else {
      // Second click: set end and open form
      const a = selStart<=dateStr ? selStart : dateStr;
      const b = selStart<=dateStr ? dateStr : selStart;
      setSelEnd(b);
      setForm({title:'',type:'audit',note:'',dateFrom:a,dateTo:b});
      setShowForm(true);
      setStep(0);
    }
  }

  function reset(){
    setStep(0); setSelStart(null); setSelEnd(null);
    setHover(null); setShowForm(false);
  }

  function saveEvent(){
    if(!form.title.trim()){ alert('Bitte Titel eingeben.'); return; }
    if(!form.dateFrom){     alert('Bitte Von-Datum wählen.'); return; }
    const to = form.dateTo||form.dateFrom;
    setEvents(prev=>[...prev,{
      id:'ev'+Date.now(), type:form.type,
      title:form.title.trim(), note:form.note,
      dateFrom:form.dateFrom, dateTo:to
    }]);
    reset();
    alert('📅 Termin gespeichert. TIVE 360° wurde benachrichtigt.');
  }

  const today=new Date();
  const DOW=['Mo','Di','Mi','Do','Fr','Sa','So'];
  const months12=Array.from({length:12},(_,i)=>{
    const d=new Date(today.getFullYear(),today.getMonth()+i,1);
    return {year:d.getFullYear(),month:d.getMonth()};
  });

  return(
    <div style={{display:'flex',flexDirection:'column',gap:16}}>

      {/* Modal */}
      {showForm&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.45)',
          display:'flex',alignItems:'center',justifyContent:'center',zIndex:200}}>
          <div style={{background:'#fff',borderRadius:14,width:480,padding:28,
            boxShadow:'0 24px 64px rgba(0,0,0,.22)'}}>
            <div style={{fontSize:17,fontWeight:700,marginBottom:4}}>📅 Termin anlegen</div>
            <div style={{fontSize:12,color:'#6b7280',marginBottom:18}}>
              {form.dateFrom===form.dateTo
                ? fmtDateLong(form.dateFrom)
                : fmtDate(form.dateFrom)+' – '+fmtDateLong(form.dateTo)
                  +' ('+daysBetween(form.dateFrom,form.dateTo)+' Tage)'
              }
            </div>

            <div style={{marginBottom:12}}>
              <div style={{fontSize:11,fontWeight:600,marginBottom:4,color:'#374151'}}>Termintyp</div>
              <select style={{width:'100%',padding:'8px 10px',border:'1px solid #d1d5db',
                borderRadius:8,fontSize:13,background:'white'}}
                value={form.type} onChange={e=>setF('type',e.target.value)}>
                {Object.entries(EVENT_TYPES).map(([k,v])=>(
                  <option key={k} value={k}>{v.icon} {v.label}</option>
                ))}
              </select>
            </div>

            <div style={{marginBottom:12}}>
              <div style={{fontSize:11,fontWeight:600,marginBottom:4,color:'#374151'}}>Titel *</div>
              <input autoFocus style={{width:'100%',padding:'8px 10px',border:'1px solid #d1d5db',
                borderRadius:8,fontSize:13,boxSizing:'border-box'}}
                value={form.title} onChange={e=>setF('title',e.target.value)}
                placeholder="z.B. Q2 Audit · Management Visit"
                onKeyDown={e=>e.key==='Enter'&&saveEvent()}/>
            </div>

            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:12}}>
              <div>
                <div style={{fontSize:11,fontWeight:600,marginBottom:4,color:'#374151'}}>Von *</div>
                <input type="date" style={{width:'100%',padding:'8px 10px',
                  border:'1px solid #d1d5db',borderRadius:8,fontSize:13,boxSizing:'border-box'}}
                  value={form.dateFrom} onChange={e=>setF('dateFrom',e.target.value)}/>
              </div>
              <div>
                <div style={{fontSize:11,fontWeight:600,marginBottom:4,color:'#374151'}}>Bis</div>
                <input type="date" style={{width:'100%',padding:'8px 10px',
                  border:'1px solid #d1d5db',borderRadius:8,fontSize:13,boxSizing:'border-box'}}
                  value={form.dateTo} onChange={e=>setF('dateTo',e.target.value)}/>
              </div>
            </div>

            <div style={{marginBottom:18}}>
              <div style={{fontSize:11,fontWeight:600,marginBottom:4,color:'#374151'}}>Notiz / Agenda</div>
              <textarea style={{width:'100%',padding:'8px 10px',border:'1px solid #d1d5db',
                borderRadius:8,fontSize:13,resize:'vertical',boxSizing:'border-box'}}
                rows={2} value={form.note} onChange={e=>setF('note',e.target.value)}/>
            </div>

            <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
              <button onClick={reset}
                style={{padding:'8px 18px',border:'1px solid #d1d5db',borderRadius:8,
                  background:'white',cursor:'pointer',fontSize:13,fontWeight:500}}>
                Abbrechen
              </button>
              <button onClick={saveEvent}
                style={{padding:'8px 20px',borderRadius:8,border:'none',
                  background:'#0F5661',color:'white',fontWeight:700,cursor:'pointer',fontSize:13}}>
                ✓ Speichern & TIVE 360° benachrichtigen
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Header */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:8}}>
        <div>
          <div style={{fontSize:15,fontWeight:700}}>📅 Terminkalender</div>
          <div style={{fontSize:12,color:'#6b7280',marginTop:2}}>
            {step===0
              ? '1. Klick = Startdatum wählen · 2. Klick = Enddatum → Termin anlegen'
              : '✅ Startdatum: '+fmtDate(selStart)+', jetzt Enddatum klicken'}
          </div>
        </div>
        <div style={{display:'flex',gap:8}}>
          {step===1&&(
            <button onClick={reset}
              style={{padding:'6px 14px',border:'1px solid #d1d5db',borderRadius:8,
                background:'white',cursor:'pointer',fontSize:12}}>
              Auswahl aufheben
            </button>
          )}
          <button onClick={()=>{
            setForm({title:'',type:'audit',note:'',dateFrom:todayStr,dateTo:todayStr});
            setShowForm(true);
          }} style={{padding:'6px 16px',borderRadius:8,border:'none',
            background:'#0F5661',color:'white',fontWeight:600,cursor:'pointer',fontSize:12}}>
            + Termin manuell
          </button>
        </div>
      </div>

      {/* Status bar during selection */}
      {step===1&&selStart&&(
        <div style={{padding:'10px 14px',borderRadius:8,fontSize:12,
          background:'rgba(15,86,97,.07)',border:'1px solid rgba(15,86,97,.2)',
          display:'flex',alignItems:'center',gap:10}}>
          <span>📌</span>
          <span style={{fontWeight:600}}>
            {rangeA&&rangeB&&rangeA!==rangeB
              ? fmtDate(rangeA)+' – '+fmtDate(rangeB)+' ('+daysBetween(rangeA,rangeB)+' Tage)'
              : 'Start: '+fmtDate(selStart)+', Enddatum klicken'}
          </span>
          {rangeA&&rangeB&&rangeA!==rangeB&&(
            <button onClick={()=>{
              setForm({title:'',type:'audit',note:'',dateFrom:rangeA,dateTo:rangeB});
              setShowForm(true); setStep(0);
            }} style={{marginLeft:'auto',padding:'4px 12px',borderRadius:6,border:'none',
              background:'#0F5661',color:'white',fontWeight:600,cursor:'pointer',fontSize:11}}>
              Termin anlegen →
            </button>
          )}
        </div>
      )}

      {/* 12 months */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
        {months12.map(({year,month})=>{
          const monthDate=new Date(year,month,1);
          const label=monthDate.toLocaleDateString('de-DE',{month:'long',year:'numeric'});
          const daysInMonth=new Date(year,month+1,0).getDate();
          const startDow=(new Date(year,month,1).getDay()+6)%7;
          const isCurrentMonth=year===today.getFullYear()&&month===today.getMonth();
          const mStart=ds(year,month,1);
          const mEnd=ds(year,month,daysInMonth);
          const evCount=events.filter(e=>{
            const a=e.dateFrom||e.date||''; const b=e.dateTo||e.date||a;
            return a<=mEnd&&b>=mStart;
          }).length;

          return(
            <div key={year+'-'+month} style={{
              background:'white',
              border:isCurrentMonth?'2px solid #0F5661':'1px solid #e5e7eb',
              borderRadius:10,overflow:'hidden',
              boxShadow:isCurrentMonth?'0 0 0 3px rgba(15,86,97,.08)':'none'}}>

              <div style={{padding:'7px 12px',
                background:isCurrentMonth?'#0F5661':'#f9fafb',
                display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <span style={{fontWeight:700,fontSize:12,
                  color:isCurrentMonth?'white':'#111827'}}>{label}</span>
                {evCount>0&&(
                  <span style={{fontSize:10,fontWeight:700,
                    background:isCurrentMonth?'rgba(255,255,255,.25)':'#0F5661',
                    color:'white',padding:'1px 7px',borderRadius:20}}>
                    {evCount}
                  </span>
                )}
              </div>

              <div style={{padding:'5px 5px 7px'}}>
                <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',marginBottom:2}}>
                  {DOW.map(d=>(
                    <div key={d} style={{textAlign:'center',fontSize:9,fontWeight:700,
                      color:'#9ca3af',padding:'1px 0'}}>{d}</div>
                  ))}
                </div>
                <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:1}}>
                  {Array.from({length:startDow},(_,i)=><div key={'e'+i}/>)}
                  {Array.from({length:daysInMonth},(_,i)=>{
                    const day=i+1;
                    const dateStr=ds(year,month,day);
                    const dayEvs=getEventsForDate(dateStr);
                    const dow=new Date(year,month,day).getDay();
                    const isWeekend=dow===0||dow===6;
                    const isToday=dateStr===todayStr;
                    const isPast=dateStr<todayStr;
                    const inRange=rangeA&&rangeB&&dateStr>=rangeA&&dateStr<=rangeB;
                    const isRangeStart=dateStr===rangeA;
                    const isRangeEnd=dateStr===rangeB;
                    const hasEv=dayEvs.length>0;

                    return(
                      <div key={dateStr}
                        onClick={()=>handleDayClick(dateStr,isPast)}
                        onMouseEnter={()=>{if(step===1&&!isPast) setHover(dateStr);}}
                        style={{
                          minHeight:28,
                          borderRadius:inRange
                            ?(isRangeStart&&isRangeEnd?5:isRangeStart?'5px 0 0 5px':isRangeEnd?'0 5px 5px 0':0)
                            :4,
                          padding:'3px 1px',
                          textAlign:'center',
                          border:isToday?'1.5px solid #0F5661':'1px solid transparent',
                          background:inRange
                            ?(isRangeStart||isRangeEnd?'#0F5661':'rgba(15,86,97,.15)')
                            :hasEv?'rgba(15,86,97,.06)':'transparent',
                          cursor:isPast?'default':'pointer',
                          opacity:isPast&&!hasEv?0.3:1,
                          userSelect:'none',WebkitUserSelect:'none',
                          transition:'background .08s'}}>
                        <div style={{
                          fontSize:10,lineHeight:1.4,
                          fontWeight:isToday||(inRange&&(isRangeStart||isRangeEnd))?700:400,
                          color:inRange&&(isRangeStart||isRangeEnd)?'white'
                            :isToday?'#0F5661'
                            :isWeekend?'#9ca3af':'#111827'}}>
                          {day}
                        </div>
                        {hasEv&&(
                          <div style={{width:4,height:4,borderRadius:'50%',margin:'1px auto 0',
                            background:EVENT_TYPES[dayEvs[0].type]?.color||'#0F5661'}}/>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {/* Event list */}
      {events.length>0&&(
        <div style={{background:'white',border:'1px solid #e5e7eb',borderRadius:10,overflow:'hidden'}}>
          <div style={{padding:'10px 14px',borderBottom:'1px solid #e5e7eb',fontWeight:700,fontSize:13}}>
            📋 Termine ({events.length})
          </div>
          <table style={{width:'100%',borderCollapse:'collapse'}}>
            <thead>
              <tr style={{background:'#f9fafb'}}>
                {['Zeitraum','Typ','Titel','Notiz',''].map(h=>(
                  <th key={h} style={{padding:'7px 14px',textAlign:'left',
                    fontSize:11,fontWeight:600,color:'#6b7280'}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {[...events].sort((a,b)=>
                new Date(a.dateFrom||a.date)-new Date(b.dateFrom||b.date)
              ).map(ev=>{
                const et=EVENT_TYPES[ev.type];
                const from=ev.dateFrom||ev.date||'';
                const to=ev.dateTo||ev.date||from;
                const isPast=to<todayStr;
                const days=from&&to?daysBetween(from,to):1;
                return(
                  <tr key={ev.id} style={{borderTop:'1px solid #f3f4f6',opacity:isPast?.5:1}}>
                    <td style={{padding:'8px 14px',fontFamily:'monospace',
                      fontSize:11,fontWeight:600,whiteSpace:'nowrap'}}>
                      {fmtDate(from)}
                      {from!==to&&' – '+fmtDate(to)}
                      {days>1&&<span style={{marginLeft:4,fontSize:10,color:'#9ca3af'}}>({days}d)</span>}
                    </td>
                    <td style={{padding:'8px 14px',fontSize:12}}>{et?.icon} {et?.label}</td>
                    <td style={{padding:'8px 14px',fontWeight:500,fontSize:13}}>{ev.title}</td>
                    <td style={{padding:'8px 14px',fontSize:12,color:'#6b7280'}}>{ev.note}</td>
                    <td style={{padding:'8px 14px'}}>
                      <button onClick={()=>setEvents(evs=>evs.filter(e=>e.id!==ev.id))}
                        style={{border:'none',background:'none',color:'#ef4444',
                          cursor:'pointer',fontSize:16,padding:'2px 6px',lineHeight:1}}>×
                      </button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

    </div>
  );
}


function ShowcasesView({client}){
  // Blocker 1: Showcases aus Supabase via RPC (serverseitig auf eigenes Projekt gefiltert,
  // Kandidaten bereits whitelisted aufgelöst). Kein localStorage, kein resolve() mehr.
  const [shows, setShows] = useState([]);
  useEffect(()=>{
    (async ()=>{
      const {data,error}=await sb.rpc('list_my_showcases');
      if(error){ console.error('[showcases] list_my_showcases', error); setShows([]); return; }
      setShows(data||[]);
    })();
  },[]);
  const langPills = str => (str||'').split(',').map(x=>x.trim()).filter(Boolean);

  return (
    <div>
      <div style={{marginBottom:20}}>
        <div style={{fontSize:18,fontWeight:700,color:'var(--text)',display:'inline-flex',alignItems:'center',gap:8}}>
          <span style={{display:'inline-flex',color:'var(--blue)'}} dangerouslySetInnerHTML={{__html:heroicon('users',20)}} />
          Kandidaten-Vorschläge
        </div>
        <div style={{fontSize:13,color:'var(--muted)',marginTop:4}}>Vorgeschlagene Profile für Schulungsgruppen und neue Projekte</div>
      </div>

      {shows.length===0 && (
        <div style={{padding:'48px 24px',textAlign:'center',color:'var(--muted)',background:'#fff',borderRadius:'var(--r-lg)',border:'1px solid var(--border)',lineHeight:1.6}}>
          Aktuell keine Kandidaten-Vorschläge verfügbar.<br/>Ihr TIVE 360° Ansprechpartner meldet sich, sobald neue Profile bereitstehen.
        </div>
      )}

      {shows.map(sc=>{
        const list = sc.candidates||[];
        const n = list.length;
        return (
          <div key={sc.id} className="card" style={{marginBottom:20}}>
            <div className="card-header">
              <span className="card-title">{sc.title}</span>
              <span className="badge badge-blue">{n} Kandidat{n!==1?'en':''}</span>
            </div>
            <div className="card-body">
              {sc.created_at && <div style={{fontSize:11,color:'var(--muted)',marginBottom:sc.note?4:12}}>Erstellt {(sc.created_at||'').slice(0,10)}</div>}
              {sc.note && <div style={{fontSize:13,color:'var(--text)',marginBottom:14,lineHeight:1.5}}>{sc.note}</div>}
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(210px,1fr))',gap:12}}>
                {list.map((cv,ci)=>{
                  // Namen-Fallback (anonyme Präsentation, §11): ohne Namen → „Kandidat #N".
                  const hasName = cv.first_name||cv.last_name;
                  const displayName = hasName ? [cv.first_name,cv.last_name].filter(Boolean).join(' ') : 'Kandidat #'+(ci+1);
                  const initials = hasName ? ((cv.first_name||'?')[0]+(cv.last_name||'?')[0]).toUpperCase() : '#'+(ci+1);
                  const sub = [cv.age&&cv.age+' Jahre', cv.city].filter(Boolean).join(' · ');
                  const pills = langPills(cv.languages_str);
                  return (
                    <div key={cv.id} style={{border:'1px solid #E5E7EB',borderRadius:12,overflow:'hidden',background:'#fff'}}>
                      <div style={{display:'flex',gap:10,alignItems:'center',padding:'12px'}}>
                        <div style={{width:44,height:44,borderRadius:'50%',overflow:'hidden',flexShrink:0,background:cv.photo_color||'#667eea',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,fontWeight:700,color:'#fff'}}>
                          {cv.photo_url?<img src={cv.photo_url} style={{width:'100%',height:'100%',objectFit:'cover'}}/>:initials}
                        </div>
                        <div style={{minWidth:0}}>
                          <div style={{fontWeight:600,fontSize:13,lineHeight:1.2}}>{displayName}</div>
                          {sub && <div style={{fontSize:11,color:'var(--muted)',marginTop:2}}>{sub}</div>}
                        </div>
                      </div>
                      {(pills.length>0 || cv.language_level) && (
                        <div style={{display:'flex',flexWrap:'wrap',gap:5,padding:'0 12px 12px'}}>
                          {cv.language_level && <span style={{fontSize:10,fontWeight:700,padding:'2px 8px',borderRadius:6,background:'#E4EEF0',color:'#0F5661',border:'1px solid rgba(15,86,97,.20)'}}>{cv.language_level}</span>}
                          {pills.map((p,i)=><span key={i} style={{fontSize:10,fontWeight:500,padding:'2px 8px',borderRadius:6,background:'#F5F6F8',color:'var(--muted)',border:'1px solid var(--border)'}}>{p}</span>)}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
              {sc.token && (
                <div style={{marginTop:14}}>
                  <a href={`showcase.html?token=${sc.token}`} target="_blank" rel="noopener noreferrer"
                     style={{display:'inline-flex',alignItems:'center',gap:6,padding:'8px 14px',borderRadius:9,border:'1px solid #0F5661',color:'#0F5661',fontSize:13,fontWeight:700,textDecoration:'none'}}>
                    In Detailansicht öffnen →
                  </a>
                </div>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function App(){
  migrateProjectData();
  const [client, setClient]=useState(null);
  const [clientLogoUrl, setClientLogoUrl]=useState(null);
  const [view, setView]=useState('overview');
  const [authMsg, setAuthMsg]=useState(null);
  const [portalDenied, setPortalDenied]=useState(false);
  const [clientDenied, setClientDenied]=useState(null);
  const [myPortals, setMyPortals]=useState([]);
  const [employees, setEmployees]=useState([]);
  const [msgUnread, setMsgUnread]=useState(0);
  const [msgReadTick, setMsgReadTick]=useState(0);
  const [posCats, setPosCats]=useState(defaultPosCats);   // Funktions-Farben portalweit (HR-Listen, Fallback Defaults)
  useEffect(()=>{ let alive=true; loadPositionCatsForClient().then(c=>{ if(alive && c) setPosCats(c); }); return ()=>{alive=false;}; }, []);
  const gatingRef=useRef(false);

  // Nach erfolgreichem Auth: Rolle + Portalzugriff (client) pruefen, dann einloggen
  async function gate(session){
    if(gatingRef.current || !session || !session.user) return;
    gatingRef.current=true;
    try{
      const {data:au, error}=await sb.from('app_users')
        .select('role_keys, full_name, staff_number, active, client_id').eq('user_id', session.user.id).single();
      if(error||!au){ gatingRef.current=false; setPortalDenied(false); setAuthMsg('Kein Benutzerprofil gefunden. Wende dich an deinen Ansprechpartner.'); return; }
      if(!au.active){ gatingRef.current=false; setPortalDenied(false); setAuthMsg('Dieser Zugang ist deaktiviert.'); return; }
      if(!au.role_keys||!au.role_keys.length){ gatingRef.current=false; setPortalDenied(false); setAuthMsg('Noch keine Rolle zugewiesen.'); return; }
      const {data:rdefs, error:e2}=await sb.from('roles_definitions').select('role_key, portals').in('role_key', au.role_keys);
      if(e2){ gatingRef.current=false; setPortalDenied(false); setAuthMsg(e2.message); return; }
      const portals=[...new Set((rdefs||[]).flatMap(r=>r.portals||[]))];
      setMyPortals(portals);
      if(!portals.includes('client')){ gatingRef.current=false; setAuthMsg(null); setPortalDenied(true); return; }
      recordKnownAppUser({email:session.user.email, name:au.full_name, roles:au.role_keys, staff_number:au.staff_number, client_id:au.client_id});
      if(!au.client_id){ gatingRef.current=false; setClientDenied(session.user.email); return; }
      const c=await buildClient(au, session.user);
      if(!c){ gatingRef.current=false; setPortalDenied(false); setAuthMsg('Kunde nicht gefunden (client_id="'+au.client_id+'"). Wende dich an deinen Ansprechpartner.'); return; }
      setClient(c); setView('overview');
    }catch(e){ gatingRef.current=false; setPortalDenied(false); setAuthMsg('Verbindungsfehler beim Laden des Profils.'); }
  }

  useEffect(()=>{
    // Session-Restore (INITIAL_SESSION) + Magic-Link-Rueckkehr (SIGNED_IN)
    const {data:sub}=sb.auth.onAuthStateChange((event, session)=>{
      if(session && !gatingRef.current){ setTimeout(()=>gate(session), 0); }
    });
    return ()=>{ try{ sub.subscription.unsubscribe(); }catch(e){} };
  }, []);

  useEffect(()=>{ let alive=true; if(client && client.logo_url){ getSignedLogoUrl(client.logo_url).then(u=>{ if(alive) setClientLogoUrl(u); }); } else { setClientLogoUrl(null); } return ()=>{ alive=false; }; }, [client]);

  // 25a/25e: Employees des eigenen Projekts + Realtime
  useEffect(()=>{
    if(!client || !client.project_id){ setEmployees([]); return; }
    let alive=true;
    (async()=>{
      const emps = await loadEmployeesForClient(client.project_id);
      if(alive) setEmployees(emps);
    })();
    // Kein Realtime im Kundenportal (Sicherheit): das Basistabellen-Abo lieferte volle
    // Mitarbeiterzeilen inkl. Gehalt/Bank. Team wird beim Öffnen/Reload geladen — Sekunden-
    // Aktualisierung braucht ein Kundenportal nicht.
    return ()=>{ alive=false; };
  }, [client]);

  // Ungelesene Kundennachrichten für den Menü-Badge: nicht selbst verfasst UND neuer als last_read des Fadens.
  useEffect(()=>{
    if(!client || !client.project_id){ setMsgUnread(0); return; }
    let alive=true;
    const calc=async()=>{
      try{
        const [mRes,rRes]=await Promise.all([
          sb.from('client_team_messages').select('project_id,recipient_employee_id,from_side,sent_at').eq('project_id',client.project_id),
          sb.from('client_msg_reads').select('thread_key,last_read_at')
        ]);
        const reads={}; (rRes.data||[]).forEach(r=>{ reads[r.thread_key]=r.last_read_at; });
        let n=0; (mRes.data||[]).forEach(m=>{ if(m.from_side==='client') return; const tk=cmThreadKey(m.project_id,m.recipient_employee_id); const lr=reads[tk]; if(!lr || new Date(m.sent_at)>new Date(lr)) n++; });
        if(alive) setMsgUnread(n);
      }catch(e){}
    };
    calc(); const t=setInterval(calc,20000); return ()=>{ alive=false; clearInterval(t); };
  }, [client, msgReadTick]);

  if(!client) return <LoginPage authMsg={authMsg} portalDenied={portalDenied} myPortals={myPortals}/>;

    {key:'calendar',  label:'Termine & Kalender',   icon:'⊣', tab:'calendar'},
    {key:'documents', label:'Dokumente',            icon:'📁', tab:'documents'},
    {key:'invoices',  label:'Rechnungen & Vertrag', icon:'◧', tab:'invoices'},

// Call-Qualität: Scores des EIGENEN Projekts je Skill (nur freigegebene Spalten über die Definer-View
// client_call_scores — kein interner Kommentar, keine Kriterien-Details). Grafisch, ampelbasiert.
function isoC(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDC(d){ if(!d)return''; var p=String(d).slice(0,10).split('-'); return p.length===3?p[2]+'.'+p[1]+'.'+p[0]:String(d); }
function cqUnitC(cfg){ return (cfg&&cfg.threshold_unit)==='points'?'points':'percent'; }
function cqNumC(n){ return Number(n||0).toLocaleString('de-DE',{maximumFractionDigits:1}); }
// Einheitsbewusst: bei Punkt-Bogen gegen Punkte, sonst gegen Prozent (verhindert falsche Ampel).
function cqAmpelC(pct,points,cfg){ var unit=cqUnitC(cfg); var val=unit==='points'?points:pct;
  var g=(cfg&&cfg.green_min!=null)?+cfg.green_min:(unit==='points'?11:90), y=(cfg&&cfg.yellow_min!=null)?+cfg.yellow_min:(unit==='points'?7:75);
  if(val==null) return {key:'none',color:'#94a3b8',label:'—'};
  if(val>=g) return {key:'green',color:'#059669',label:'stark'};
  if(val>=y) return {key:'amber',color:'#d97706',label:'solide'};
  return {key:'red',color:'#dc2626',label:'unter Ziel'};
}
function cqCfgC(cfgs,pid,sk){ var f=function(p,s){return (cfgs||[]).find(function(c){return (c.project_id||null)===(p||null)&&(c.skill||null)===(s||null);});}; return f(pid,sk)||f(pid,null)||f(null,null)||{green_min:90,yellow_min:75}; }
// Compliance: fachliche Rohpunkte (Verstoß nullt den offiziellen Score, nicht die fachliche Leistung).
function cqIsBreachC(r){ return !!(r&&r.compliance_failed); }
function cqRawPointsC(r){ return (r&&r.raw_points!=null)?Number(r.raw_points):((r&&r.total_points!=null)?Number(r.total_points):null); }
function cqRawPctC(r){ var mp=(r&&r.max_points!=null)?Number(r.max_points):null; var rp=cqRawPointsC(r); return (mp&&rp!=null)?Math.round(rp/mp*1000)/10:((r&&r.total_pct!=null)?Number(r.total_pct):null); }
function cqRawMetricC(r,cfg){ return cqUnitC(cfg)==='points'?cqRawPointsC(r):cqRawPctC(r); }
// ── Externe Bewertung (Kunde bewertet über den Kunden-Bogen) — Scoring-Helfer + Erfassungs-Modal (S3) ──
function cqTypeMaxC(t,max){ return t==='yesno'?1:(t==='grade'?5:(Number(max)||1)); }
function cqFractionC(type,points,max){ if(points==null||points==='')return null; const p=Number(points); if(isNaN(p))return null;
  if(type==='grade')return Math.max(0,Math.min(1,(5-p)/4)); if(type==='yesno')return p>=1?1:0; const m=Number(max)||1; return Math.max(0,Math.min(1,m?p/m:0)); }
function cqTotalPctC(scores){ let ws=0,fs=0; (scores||[]).forEach(s=>{ const f=s.na?1:cqFractionC(s.type_snapshot,s.points,s.max_points_snapshot); if(f==null)return; const w=Number(s.weight_snapshot)||0; ws+=w; fs+=w*f; }); return ws>0?Math.round(fs/ws*1000)/10:null; }
function cqPointsC(scores){ let got=0,max=0; (scores||[]).forEach(s=>{ const f=s.na?1:cqFractionC(s.type_snapshot,s.points,s.max_points_snapshot); if(f==null)return; const w=Number(s.weight_snapshot)||1,mp=Number(s.max_points_snapshot)||0; got+=w*f*mp; max+=w*mp; }); return {got:Math.round(got*100)/100,max:Math.round(max*100)/100}; }
function cwOfC(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const dn=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-dn); const ys=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return {kw:Math.ceil((((t-ys)/86400000)+1)/7),year:t.getUTCFullYear()}; }
function cqBtnS(on){ return {padding:'6px 12px',borderRadius:8,border:'1px solid '+(on?'#0f172a':'#cbd5e1'),background:on?'#0f172a':'#fff',color:on?'#fff':'#0f172a',cursor:'pointer',fontSize:13,fontWeight:on?800:500}; }

function CqRateModal({client, emp, bogen, cfg, onClose, onSaved}){
  const [values,setValues]=useState({}); const [note,setNote]=useState(''); const [callRef,setCallRef]=useState('');
  const [date,setDate]=useState(isoC(new Date())); const [busy,setBusy]=useState(false);
  const setV=(cid,patch)=>setValues(v=>({...v,[cid]:{...(v[cid]||{}),...patch}}));
  const unit=cqUnitC(cfg);
  const preview=(bogen||[]).map(c=>{ const v=values[c.id]||{}; return {type_snapshot:c.type, points:v.na?null:(v.points==null?null:v.points), max_points_snapshot:cqTypeMaxC(c.type,c.max_points), weight_snapshot:c.weight, na:!!v.na}; });
  const rawPct=cqTotalPctC(preview); const rawPts=cqPointsC(preview);
  const breach=!!(bogen||[]).find(c=>{ const v=values[c.id]||{}; return c.compliance_critical && !v.na && v.points===0; });
  const pct=breach?0:rawPct; const pts=breach?{got:0,max:rawPts.max}:rawPts; const started=rawPct!=null;
  const amp = !started?{key:'none',color:'#94a3b8',label:'noch nicht bewertet'} : breach?{key:'red',color:'#dc2626',label:'Compliance-Verstoß'} : cqAmpelC(pct,pts.got,cfg);
  const resultNum = unit==='points'?(cqNumC(pts.got)+' Pkt'):(started?(pct+' %'):'—');
  async function save(){
    if(!started||busy)return; setBusy(true);
    const scoreRows=bogen.map(c=>{ const v=values[c.id]||{}; return { criterion_id:c.id, order_index:c.order_index||0, category_snapshot:c.category||null, prompt_snapshot:c.prompt, type_snapshot:c.type, max_points_snapshot:cqTypeMaxC(c.type,c.max_points), weight_snapshot:Number(c.weight)||1, points:v.na?null:(v.points==null?null:Number(v.points)), na:!!v.na, comment:(v.comment&&v.comment.trim())||null, level_hints_snapshot:(c.type==='tristate'&&c.level_hints)?c.level_hints:null, compliance_critical_snapshot:!!c.compliance_critical }; });
    const [Y,M,D]=date.split('-').map(Number); const cw=cwOfC(new Date(Y,M-1,D));
    let uid=null; try{ const u=await sb.auth.getUser(); uid=u&&u.data&&u.data.user?u.data.user.id:null; }catch(e){}
    const sk=((emp.project_skill||emp.skill||'')+'').toLowerCase()||null;
    const {data:s,error}=await sb.from('call_samples').insert({ employee_id:emp.id, sampled_date:date, kw:cw.kw, year:cw.year, project_id:client.project_id, skill:sk, rater_kind:'extern', criteria_scope:'extern', call_ref:callRef.trim()||null, note:note.trim()||null, total_pct:pct, total_points:pts.got, max_points:pts.max, raw_points:rawPts.got, compliance_failed:breach, status:'done', conducted_by:uid, conducted_by_name:client.name||'Kunde', conducted_at:new Date().toISOString() }).select().single();
    if(error){ setBusy(false); window.alert('Nicht gespeichert: '+(error.message||'')); return; }
    const {error:e2}=await sb.from('call_scores').insert(scoreRows.map(r=>({...r, sample_id:s.id})));
    setBusy(false);
    if(e2){ window.alert('Bewertungen nicht gespeichert: '+(e2.message||'')); return; }
    onSaved&&onSaved();
  }
  return <div style={{position:'fixed',inset:0,background:'rgba(15,23,42,.55)',display:'flex',alignItems:'flex-start',justifyContent:'center',padding:'32px 16px',overflow:'auto',zIndex:1000}} onClick={onClose}>
    <div onClick={e=>e.stopPropagation()} style={{background:'#fff',borderRadius:16,maxWidth:680,width:'100%',padding:'22px 24px',boxShadow:'0 20px 60px rgba(0,0,0,.3)'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
        <div style={{fontSize:18,fontWeight:800,color:'#0f172a'}}>Call bewerten · {emp.first_name} {emp.last_name}</div>
        <button onClick={onClose} style={{border:'none',background:'none',fontSize:20,cursor:'pointer',color:'#94a3b8'}}>✕</button>
      </div>
      <div style={{fontSize:12,color:'#64748b',marginBottom:12}}>Ihre eigene Bewertung. Sie ist getrennt von unserer internen Bewertung.</div>
      {(bogen||[]).map((c,i)=>{ const v=values[c.id]||{}; const comp=!!c.compliance_critical; const isTri=c.type==='tristate'&&!comp; const isYesno=c.type==='yesno'||comp; const mx=cqTypeMaxC(c.type,c.max_points);
        return <div key={c.id} style={{padding:'11px 0',borderTop:i?'1px solid #eef2f7':'none'}}>
          <div style={{fontSize:14,fontWeight:600,color:'#0f172a'}}>{c.category?<span style={{fontSize:11,color:'#94a3b8',marginRight:6}}>{c.category}</span>:''}{c.prompt}{comp&&<span style={{fontSize:10,fontWeight:800,color:'#dc2626',marginLeft:6}}>⛔ Compliance</span>}</div>
          {c.hint&&<div style={{fontSize:11.5,color:'#94a3b8',marginTop:2}}>{c.hint}</div>}
          <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:8,alignItems:'center'}}>
            {isTri ? [['Ja',mx],['Teilweise',mx*0.5],['Nein',0]].map(([l,pv])=>{ const on=!v.na&&v.points===pv; return <button key={l} onClick={()=>setV(c.id,{points:pv,na:false})} style={cqBtnS(on)}>{l}</button>; })
             : isYesno ? [['Ja',mx],['Nein',0]].map(([l,pv])=>{ const on=!v.na&&v.points===pv; return <button key={l} onClick={()=>setV(c.id,{points:pv,na:false})} style={cqBtnS(on)}>{l}</button>; })
             : <input type="number" min="0" max={mx} step="0.5" value={v.na?'':(v.points==null?'':v.points)} onChange={e=>setV(c.id,{points:e.target.value===''?null:Number(e.target.value),na:false})} style={{width:96,padding:'6px 8px',border:'1px solid #cbd5e1',borderRadius:8}} placeholder={'0–'+mx}/>}
            {c.allow_na&&!comp&&<button onClick={()=>setV(c.id,{na:!v.na})} style={cqBtnS(!!v.na)}>n/a</button>}
          </div>
        </div>; })}
      <div style={{display:'flex',gap:10,marginTop:14,flexWrap:'wrap'}}>
        <input type="date" value={date} onChange={e=>setDate(e.target.value)} style={{padding:'7px 9px',border:'1px solid #cbd5e1',borderRadius:8}}/>
        <input value={callRef} onChange={e=>setCallRef(e.target.value)} placeholder="Call-Referenz (optional)" style={{padding:'7px 9px',border:'1px solid #cbd5e1',borderRadius:8,flex:'1 1 180px'}}/>
      </div>
      <textarea value={note} onChange={e=>setNote(e.target.value)} rows={2} placeholder="Notiz (optional)" style={{width:'100%',marginTop:10,padding:'8px 10px',border:'1px solid #cbd5e1',borderRadius:8,boxSizing:'border-box'}}/>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:14,flexWrap:'wrap',gap:10}}>
        <div style={{fontSize:20,fontWeight:800,color:amp.color}}>{resultNum} <span style={{fontSize:12,fontWeight:600}}>{amp.label}</span></div>
        <div style={{display:'flex',gap:8}}>
          <button onClick={onClose} style={{padding:'9px 16px',borderRadius:9,border:'1px solid #cbd5e1',background:'#fff',cursor:'pointer',fontWeight:700}}>Abbrechen</button>
          <button onClick={save} disabled={!started||busy} style={{padding:'9px 18px',borderRadius:9,border:'none',background:started?'#0f172a':'#cbd5e1',color:'#fff',cursor:started?'pointer':'default',fontWeight:800}}>{busy?'Speichert…':'Bewertung speichern'}</button>
        </div>
      </div>
    </div>
  </div>;
}

function QualityView({client}){
  const [rows,setRows]=useState(null); const [cfgs,setCfgs]=useState([]); const [period,setPeriod]=useState('4w');
  const [team,setTeam]=useState([]); const [bogen,setBogen]=useState([]); const [xcfg,setXcfg]=useState(null);
  const [selEmp,setSelEmp]=useState(''); const [rateEmp,setRateEmp]=useState(null);
  const reload=async()=>{ try{ const {data}=await sb.from('client_call_scores').select('*').order('sampled_date',{ascending:false}); setRows(data||[]); }catch(e){} };
  useEffect(()=>{ let alive=true; (async()=>{
    try{ const rc=await sb.from('call_score_config').select('*');
      const {data}=await sb.from('client_call_scores').select('*').order('sampled_date',{ascending:false});
      const tm=await loadEmployeesForClient(client&&client.project_id);
      const bg=await sb.from('call_criteria').select('*').eq('project_id',(client&&client.project_id)||'__none__').eq('rater_kind','extern').is('skill',null).eq('active',true).order('order_index',{ascending:true});
      if(alive){ setCfgs(rc.data||[]); setRows(data||[]); setTeam(tm||[]);
        setBogen(bg.data||[]);
        setXcfg((rc.data||[]).find(c=>(c.project_id||null)===((client&&client.project_id)||null)&&(c.skill||null)===null&&c.rater_kind==='extern')||{green_min:90,yellow_min:75,threshold_unit:'percent'}); }
    }catch(e){ if(alive) setRows([]); }
  })(); return ()=>{alive=false;}; },[]);
  const canRate=(bogen||[]).length>0;
  const from=(()=>{ const now=new Date(); if(period==='4w')return isoC(new Date(now.getTime()-27*864e5)); if(period==='3m')return isoC(new Date(now.getFullYear(),now.getMonth()-3,now.getDate())); return null; })();
  if(rows===null) return <div style={{padding:30,textAlign:'center',color:'#94a3b8'}}>Lädt…</div>;
  const fr=rows.filter(r=> !from || String(r.sampled_date)>=from);
  const bySkill={}; fr.forEach(r=>{ const k=(r.skill||'—').toLowerCase(); (bySkill[k]=bySkill[k]||[]).push(r); });
  const skills=Object.keys(bySkill).sort();
  const PB=[['4w','Letzte 4 Wochen'],['3m','Letzte 3 Monate'],['all','Alle']];
  return <div style={{maxWidth:900}}>
    {/* Externe Bewertung erfassen (S3) */}
    <div style={{background:'#fff',border:'1px solid #e5e7eb',borderRadius:14,padding:'16px 18px',marginBottom:16,boxShadow:'0 4px 14px rgba(15,23,42,.04)'}}>
      <div style={{fontSize:15,fontWeight:800,color:'#0f172a',marginBottom:4}}>Mitarbeiter bewerten</div>
      {!canRate ? <div style={{fontSize:13,lineHeight:1.55,color:'#92400e',background:'#fffbeb',border:'1px solid #fde68a',borderRadius:10,padding:'12px 14px'}}><b>Ihr Bewertungsbogen ist noch nicht hinterlegt.</b> Sie bewerten Ihre Mitarbeiter über einen eigenen Bogen mit Ihren Kriterien. Sobald wir ihn mit Ihnen abgestimmt und angelegt haben, erscheint hier die Mitarbeiter-Auswahl zum Bewerten. Bitte sprechen Sie dazu Ihren TIVE&nbsp;360°-Ansprechpartner an.</div>
       : <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center'}}>
          <select value={selEmp} onChange={e=>setSelEmp(e.target.value)} style={{padding:'8px 10px',border:'1px solid #cbd5e1',borderRadius:8,minWidth:220}}>
            <option value="">Mitarbeiter wählen…</option>
            {team.slice().sort((a,b)=>String((a.last_name||'')+(a.first_name||'')).localeCompare(String((b.last_name||'')+(b.first_name||'')),'de')).map(e=><option key={e.id} value={e.id}>{e.last_name} {e.first_name}</option>)}
          </select>
          <button disabled={!selEmp} onClick={()=>{ const e=team.find(x=>x.id===selEmp); if(e)setRateEmp(e); }} style={{padding:'8px 16px',borderRadius:8,border:'none',background:selEmp?'#0f172a':'#cbd5e1',color:'#fff',fontWeight:800,cursor:selEmp?'pointer':'default'}}>Bewerten</button>
          <span style={{fontSize:12,color:'#94a3b8'}}>Ihre Bewertungen erscheinen unten.</span>
        </div>}
    </div>
    {rateEmp && <CqRateModal client={client} emp={rateEmp} bogen={bogen} cfg={xcfg} onClose={()=>setRateEmp(null)} onSaved={()=>{ setRateEmp(null); setSelEmp(''); reload(); }}/>}
    <div style={{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap'}}>
      {PB.map(([k,l])=><button key={k} onClick={()=>setPeriod(k)} style={{padding:'7px 13px',borderRadius:9,fontSize:13,fontWeight:700,cursor:'pointer',border:'1px solid '+(period===k?'#0f172a':'#cbd5e1'),background:period===k?'#0f172a':'#fff',color:period===k?'#fff':'#0f172a'}}>{l}</button>)}
    </div>
    {skills.length===0 ? <EmptyHint icon="📞" text="Für den gewählten Zeitraum liegen keine Call-Bewertungen vor." /> :
      skills.map(sk=>{ const cfg=cqCfgC(cfgs,bySkill[sk][0].project_id,sk); const unit=cqUnitC(cfg); const metric=r=>cqRawMetricC(r,cfg);   // Ø fachlich (raw)
        const list=bySkill[sk].slice().sort((a,b)=>(metric(b)||0)-(metric(a)||0));
        const maxP=(list.find(r=>r.max_points!=null)||{}).max_points;
        const vals=list.map(metric).filter(x=>x!=null); const avg=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10)/10:null;
        const nb=list.filter(cqIsBreachC).length;
        const d={green:0,amber:0,red:0}; list.forEach(r=>{ const a=cqAmpelC(cqRawPctC(r),cqRawPointsC(r),cfg); if(a.key!=='none')d[a.key]++; });   // fachliche Verteilung
        const t=(d.green+d.amber+d.red)||1; const avgA=cqAmpelC(unit==='points'?null:avg, unit==='points'?avg:null, cfg);
        return <div key={sk} style={{background:'#fff',border:'1px solid #e5e7eb',borderRadius:16,padding:'20px 22px',marginBottom:16,boxShadow:'0 6px 20px rgba(15,23,42,.05)'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',flexWrap:'wrap',gap:10}}>
            <div style={{fontSize:18,fontWeight:800,color:'#0f172a'}}>{sk.charAt(0).toUpperCase()+sk.slice(1)}</div>
            <div style={{textAlign:'right'}}><div style={{fontSize:26,fontWeight:800,color:avgA.color}}>{avg==null?'—':(unit==='points'?cqNumC(avg)+(maxP!=null?' / '+cqNumC(maxP):'')+' Pkt':avg+' %')}</div><div style={{fontSize:11,color:'#94a3b8'}}>Ø fachlich · Ziel ≥ {cqNumC(cfg.green_min)} {unit==='points'?'Pkt':'%'}</div></div>
          </div>
          <div style={{display:'flex',height:10,borderRadius:5,overflow:'hidden',background:'#eef2f4',margin:'12px 0 6px'}}>
            {d.green>0&&<div style={{width:(d.green/t*100)+'%',background:'#059669'}}/>}
            {d.amber>0&&<div style={{width:(d.amber/t*100)+'%',background:'#d97706'}}/>}
            {d.red>0&&<div style={{width:(d.red/t*100)+'%',background:'#dc2626'}}/>}
          </div>
          <div style={{fontSize:12,color:'#64748b',marginBottom:14}}>{list.length} Bewertung{list.length>1?'en':''} · {d.green} stark · {d.amber} solide · {d.red} unter Ziel{nb>0&&<span style={{color:'#b91c1c',fontWeight:700}}> · ⛔ {nb} Compliance-Verstoß{nb>1?'e':''}</span>}</div>
          <div style={{display:'flex',flexDirection:'column',gap:6}}>
            {list.map(r=>{ const a=cqAmpelC(r.total_pct,r.total_points,cfg); const br=cqIsBreachC(r); const rawTxt=unit==='points'?(cqNumC(cqRawPointsC(r))+(maxP!=null?' / '+cqNumC(maxP):'')+' Pkt'):(cqRawPctC(r)+' %'); return <div key={r.id} style={{display:'flex',alignItems:'center',gap:12,padding:'8px 12px',border:'1px solid '+(br?'#fecaca':'#eef2f7'),borderRadius:8,background:br?'#fef2f2':'#fff'}}>
              <span style={{width:9,height:9,borderRadius:'50%',background:a.color,flexShrink:0}}/>
              <div style={{flex:1,minWidth:0,fontSize:14,fontWeight:600,color:'#0f172a',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{br&&<span style={{color:'#b91c1c',fontWeight:800,marginRight:5}} title="Compliance-Verstoß">⛔</span>}{r.employee_name}{br&&<span style={{fontSize:11,fontWeight:600,color:'#b91c1c',marginLeft:6}}>Compliance-Verstoß · fachlich {rawTxt}</span>}</div>
              <span style={{fontSize:11,color:'#94a3b8'}}>{fmtDC(r.sampled_date)}</span>
              <span style={{fontSize:14,fontWeight:800,color:a.color,fontFamily:'monospace',width:64,textAlign:'right'}}>{unit==='points'?(r.total_points==null?'—':cqNumC(r.total_points)+' Pkt'):(r.total_pct==null?'—':Math.round(r.total_pct)+'%')}</span>
            </div>; })}
          </div>
        </div>;
      })}
  </div>;
}

// Berichte-Archiv: veröffentlichte Präsentationen des EIGENEN Projekts (RLS: published + get_my_client_project_id()).
// Aktuellster prominent, ältere nach Zeitraum. Link + PDF öffnen die öffentliche Seite (praesentation.html?p=token).
function ReportsView({client}){
  const [rows,setRows]=useState(null);
  useEffect(()=>{ let alive=true; (async()=>{
    try{ const {data,error}=await sb.from('presentations').select('id,title,period_type,period_year,period_no,public_token,created_at').eq('published',true).order('period_year',{ascending:false}).order('period_no',{ascending:false});
      if(!alive) return; setRows(error?[]:((data||[]).filter(r=>r&&r.public_token)));
    }catch(e){ if(alive) setRows([]); }
  })(); return ()=>{alive=false;}; },[]);
  const url=(tok,pr)=>'https://client.tive360.de/praesentation.html?p='+tok+(pr?'&print=1':'');
  const fmtP=r=>r.period_type==='month'?('Monat '+String(r.period_no).padStart(2,'0')+'/'+r.period_year):('KW '+r.period_no+'/'+r.period_year);
  const openBtn=(tok,pr,label,pri)=><a href={url(tok,pr)} target="_blank" rel="noreferrer" style={{textDecoration:'none',display:'inline-flex',alignItems:'center',gap:6,padding:'8px 14px',borderRadius:9,fontSize:13,fontWeight:700,border:'1px solid '+(pri?'#0f172a':'#cbd5e1'),background:pri?'#0f172a':'#fff',color:pri?'#fff':'#0f172a'}}>{label}</a>;
  if(rows===null) return <div style={{padding:30,textAlign:'center',color:'#94a3b8'}}>Lädt…</div>;
  if(!rows.length) return <EmptyHint icon="📈" text="Noch keine veröffentlichten Berichte für Ihr Projekt." />;
  const latest=rows[0], older=rows.slice(1);
  return <div style={{maxWidth:820}}>
    <div style={{background:'#fff',border:'1px solid #e5e7eb',borderRadius:16,padding:'22px 24px',boxShadow:'0 6px 20px rgba(15,23,42,.06)',marginBottom:20}}>
      <div style={{fontSize:11,fontWeight:800,letterSpacing:'.1em',textTransform:'uppercase',color:'#94a3b8'}}>Aktueller Bericht</div>
      <div style={{fontSize:22,fontWeight:800,margin:'4px 0 2px',color:'#0f172a'}}>{fmtP(latest)}</div>
      <div style={{fontSize:13,color:'#64748b',marginBottom:16}}>{latest.title}</div>
      <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>{openBtn(latest.public_token,false,'Bericht öffnen ↗',true)}{openBtn(latest.public_token,true,'Als PDF',false)}</div>
    </div>
    {older.length>0 && <div>
      <div style={{fontSize:13,fontWeight:800,color:'#334155',margin:'0 0 8px 2px'}}>Frühere Berichte</div>
      <div style={{background:'#fff',border:'1px solid #e5e7eb',borderRadius:14,overflow:'hidden'}}>
        {older.map((r,i)=><div key={r.id} style={{display:'flex',alignItems:'center',gap:12,padding:'11px 16px',borderTop:i?'1px solid #eef2f7':'none',flexWrap:'wrap'}}>
          <div style={{flex:1,minWidth:160}}><div style={{fontWeight:700,fontSize:14}}>{fmtP(r)}</div><div style={{fontSize:12,color:'#94a3b8'}}>{r.title}</div></div>
          {openBtn(r.public_token,false,'Öffnen',false)}{openBtn(r.public_token,true,'PDF',false)}
        </div>)}
      </div>
    </div>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
