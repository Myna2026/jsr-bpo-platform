<!DOCTYPE html><html lang="de"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<title>Bericht</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared/presentation-slides.js"></script>
<style>
  :root{ --bg:#f1f5f9; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); font-family:'Inter',system-ui,sans-serif; color:#0f172a; }
  .wrap{ max-width:1120px; margin:0 auto; padding:28px 20px 96px; }
  .deck{ display:flex; flex-direction:column; }
  .msg{ max-width:520px; margin:12vh auto; text-align:center; color:#64748b; font-size:16px; background:#fff; border:1px solid #e5e7eb; border-radius:14px; padding:40px 28px; }
  .toolbar{ position:fixed; bottom:0; left:0; right:0; display:flex; justify-content:center; gap:12px; padding:12px; background:rgba(255,255,255,.9); backdrop-filter:blur(6px); border-top:1px solid #e5e7eb; }
  .btn{ border:1px solid #cbd5e1; background:#fff; color:#0f172a; font-weight:700; font-size:13px; padding:9px 18px; border-radius:10px; cursor:pointer; font-family:inherit; }
  .btn.pri{ background:#0f172a; color:#fff; border-color:#0f172a; }
  @media print{
    body{ background:#fff; }
    .wrap{ max-width:none; margin:0; padding:0; }
    .toolbar{ display:none; }
    .pres-slide{ page-break-after:always; break-after:page; box-shadow:none !important; border:none !important; border-radius:0 !important; margin:0 !important; width:100%; }
    .pres-slide:last-child{ page-break-after:auto; }
  }
</style>
</head><body>
<div class="wrap"><div id="root"><div class="msg">Lädt…</div></div></div>
<div class="toolbar"><button class="btn pri" onclick="window.print()">🖨 Als PDF speichern / Drucken</button></div>
<script>
  var SB_URL='https://msdiyjxckmpvuomnhvjp.supabase.co';
  var SB_KEY='sb_publishable_exKYOG6Znhj_JlO0v6erQQ_q0HWWiyl';
  var sb=window.supabase.createClient(SB_URL, SB_KEY);
  var token=new URLSearchParams(location.search).get('p');
  function show(msg){ var r=document.getElementById('root'); if(r) r.innerHTML='<div class="msg">'+msg+'</div>'; }
  function setPage(orient){ var s=document.getElementById('pagestyle')||document.createElement('style'); s.id='pagestyle';
    s.textContent='@media print{ @page{ size: A4 '+((orient==='portrait')?'portrait':'landscape')+'; margin: 8mm; } }'; document.head.appendChild(s); }
  function membersOfFactory(d){ return function(tk){ var t=(d.teams||{})[tk]||{}; var ids={};
    (t.members||[]).forEach(function(id){ids[id]=1;});
    Object.keys((t.calls&&t.calls.vorwoche)||{}).forEach(function(id){ids[id]=1;});
    Object.keys((t.calls&&t.calls.monat)||{}).forEach(function(id){ids[id]=1;});
    return Object.keys(ids).map(function(id){ return {id:id, name:(d._names&&d._names[id])||id}; }); }; }
  function render(res){
    if(!window.PRES){ show('Anzeige-Komponente nicht geladen.'); return; }
    var d=res.data||{}; var th=d._theme||{};
    var ctx={ deck:d, accent:th.accent||'#2563eb', font:th.font||"'Inter',sans-serif",
      projName:th.projName||res.title||'Bericht', period:{no:res.period_no, year:res.period_year},
      skills:d._skills||[], dummy:false, ourLogo:th.ourLogo||'', customerLogo:th.customerLogo||'',
      membersOf:membersOfFactory(d) };
    setPage(res.orientation);
    document.title=(th.projName||'Bericht')+' · KW '+res.period_no+'/'+res.period_year;
    var slides=window.PRES.deckSlides(ctx);
    var root=ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement('div',{className:'deck'}, slides.map(function(el,i){ return React.createElement(React.Fragment,{key:i}, el); })));
  }
  (async function(){
    if(!token){ show('Kein Bericht angegeben.'); return; }
    try{ var r=await sb.rpc('get_public_presentation',{p_token:token});
      if(r.error || !r.data){ show('Dieser Bericht ist nicht (mehr) verfügbar.'); return; }
      render(r.data);
    }catch(e){ show('Bericht konnte nicht geladen werden.'); }
  })();
</script>
</body></html>
