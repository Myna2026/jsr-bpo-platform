<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" type="image/svg+xml" href="/assets/tive360-mark.svg"><title>Anmelden — TIVE 360°</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root{
    --petrol:#0F5661; --petrol-dark:#0B454E; --petrol-tint:#E4EEF0;
    --blue:#1e40af; --ink:#0f172a; --muted:#5b6b6e; --border:#e2e8f0; --red:#dc2626;
    --r:16px; --shadow-lg:0 24px 60px rgba(15,86,97,.16);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;background:linear-gradient(160deg,var(--petrol-tint) 0%,#f5f7f8 45%,#eef4f5 100%);-webkit-font-smoothing:antialiased;}
  a{color:var(--petrol);text-decoration:none;}
  .card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow-lg);width:100%;max-width:420px;padding:40px 36px;border:1px solid rgba(15,86,97,.06);}
  .logo{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:22px;letter-spacing:-.02em;color:var(--petrol);margin-bottom:6px;}
  .logo .mark{width:38px;height:38px;}
  .logo .deg{color:var(--blue);}
  h1{text-align:center;font-size:24px;font-weight:800;margin:14px 0 4px;}
  .subtitle{text-align:center;color:var(--muted);font-size:14px;margin-bottom:26px;}
  .field{margin-bottom:16px;}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;}
  input[type=email],input[type=password]{width:100%;padding:13px 15px;border:1.5px solid var(--border);border-radius:11px;font-size:15px;font-family:inherit;transition:.15s;background:#fff;}
  input:focus{outline:none;border-color:var(--petrol);box-shadow:0 0 0 3px rgba(15,86,97,.12);}
  .btn{width:100%;padding:14px;border:none;border-radius:11px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:.18s;
    background:var(--petrol);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn:hover{background:var(--petrol-dark);}
  .btn:disabled{opacity:.6;cursor:not-allowed;}
  .row-links{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:13px;}
  .row-links a{font-weight:600;cursor:pointer;}
  .toggle{background:none;border:none;color:var(--petrol);font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;padding:0;}
  .msg{margin-top:16px;padding:11px 14px;border-radius:10px;font-size:13.5px;font-weight:500;display:none;}
  .msg.err{background:#fef2f2;color:var(--red);border:1px solid #fecaca;display:block;}
  .msg.ok{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0;display:block;}
  .spinner{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .hint{text-align:center;font-size:12px;color:var(--muted);margin-top:18px;line-height:1.5;}

  /* Portal-Auswahl-Modal */
  .overlay{position:fixed;inset:0;background:rgba(11,69,78,.45);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:24px;z-index:100;}
  .overlay.show{display:flex;}
  .modal{background:#fff;border-radius:20px;box-shadow:var(--shadow-lg);max-width:520px;width:100%;padding:36px 34px;text-align:center;}
  .modal h2{font-size:22px;font-weight:800;margin-bottom:6px;}
  .modal .msub{color:var(--muted);font-size:14px;margin-bottom:26px;}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .choice{border:1.5px solid var(--border);border-radius:16px;padding:26px 18px;cursor:pointer;transition:.18s;text-align:center;background:#fff;}
  .choice:hover{border-color:var(--petrol);transform:translateY(-4px);box-shadow:0 16px 34px rgba(15,86,97,.14);}
  .choice .ci{width:60px;height:60px;border-radius:16px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--petrol),var(--blue));color:#fff;}
  .choice .ci svg{width:30px;height:30px;}
  .choice h3{font-size:17px;font-weight:800;margin-bottom:4px;}
  .choice p{font-size:13px;color:var(--muted);}
  @media(max-width:520px){.choices{grid-template-columns:1fr;}}
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="url(#lg)"/><path d="M24 30 H76 V44 H58 V74 H42 V44 H24 Z" fill="#fff"/><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F5661"/><stop offset="1" stop-color="#1e40af"/></linearGradient></defs></svg>
    <span>TIVE <span class="deg">360°</span></span>
  </div>
  <h1>Anmelden</h1>
  <div class="subtitle" id="subtitle">Melde dich mit deinem TIVE-360°-Konto an.</div>

  <form id="loginForm" autocomplete="on">
    <div class="field">
      <label for="email">E-Mail</label>
      <input type="email" id="email" placeholder="name@firma.de" required autocomplete="username"/>
    </div>
    <div class="field" id="pwField">
      <label for="password">Passwort</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <button type="submit" class="btn" id="submitBtn"><span id="btnLabel">Anmelden</span></button>
  </form>

  <div class="row-links">
    <a id="forgot">Passwort vergessen?</a>
    <button type="button" class="toggle" id="magicToggle">Magic-Link stattdessen</button>
  </div>

  <div class="msg" id="msg"></div>
  <div class="hint">Kein Zugang? Wende dich an dein HR- oder Management-Team.</div>
</div>

<!-- Portal-Auswahl-Modal (bei Doppelrolle) -->
<div class="overlay" id="portalOverlay">
  <div class="modal">
    <h2>Willkommen zurück</h2>
    <div class="msub">Du hast Zugriff auf mehrere Bereiche. Wohin möchtest du?</div>
    <div class="choices">
      <a class="choice" href="https://hr.tive360.de">
        <div class="ci"><svg viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M2.25 5.25a3 3 0 0 1 3-3h13.5a3 3 0 0 1 3 3V15a3 3 0 0 1-3 3h-3v.257c0 .597.237 1.17.659 1.591l.621.622a.75.75 0 0 1-.53 1.28h-9a.75.75 0 0 1-.53-1.28l.621-.622a2.25 2.25 0 0 0 .659-1.59V18h-3a3 3 0 0 1-3-3V5.25Zm1.5 0v7.5a1.5 1.5 0 0 0 1.5 1.5h13.5a1.5 1.5 0 0 0 1.5-1.5v-7.5a1.5 1.5 0 0 0-1.5-1.5H5.25a1.5 1.5 0 0 0-1.5 1.5Z" clip-rule="evenodd"/></svg></div>
        <h3>HR-System</h3>
        <p>Verwaltung, KPIs &amp; Cockpits</p>
      </a>
      <a class="choice" href="https://mitarbeiter.tive360.de">
        <div class="ci"><svg viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M7.5 6a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM3.751 20.105a8.25 8.25 0 0 1 16.498 0 .75.75 0 0 1-.437.695A18.683 18.683 0 0 1 12 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 0 1-.437-.695Z" clip-rule="evenodd"/></svg></div>
        <h3>Mein Bereich</h3>
        <p>Profil, Schichten &amp; Urlaub</p>
      </a>
    </div>
  </div>
</div>

<script>
  const SB_URL = 'https://msdiyjxckmpvuomnhvjp.supabase.co';
  const SB_KEY = 'sb_publishable_exKYOG6Znhj_JlO0v6erQQ_q0HWWiyl';
  const sb = window.supabase.createClient(SB_URL, SB_KEY);

  const HR_ROLES = ['management','hr','finance'];
  const STAFF_ROLES = ['agent','mitarbeiter','teamlead','projektleiter','qm','trainer'];
  const URL_HR = 'https://hr.tive360.de';
  const URL_STAFF = 'https://mitarbeiter.tive360.de';
  const URL_CLIENT = 'https://client.tive360.de';

  let magicMode = false;
  let routing = false;

  const $ = (id) => document.getElementById(id);
  const msgEl = $('msg');
  function showMsg(text, type){ msgEl.textContent = text; msgEl.className = 'msg ' + type; }
  function clearMsg(){ msgEl.className = 'msg'; msgEl.textContent = ''; }
  function setBusy(on, label){ $('submitBtn').disabled = on; $('btnLabel').innerHTML = on ? '<span class="spinner"></span>' : (label || (magicMode ? 'Magic-Link senden' : 'Anmelden')); }

  // ── Auto-Routing anhand app_users ──
  async function routeUser(session){
    if(routing) return; routing = true;
    try{
      const { data:au, error } = await sb.from('app_users')
        .select('role_keys, client_id, active').eq('user_id', session.user.id).single();
      if(error || !au){ showMsg('Kein Benutzerprofil gefunden. Wende dich an dein Team.', 'err'); routing=false; setBusy(false); return; }
      if(!au.active){ showMsg('Dieser Zugang ist deaktiviert.', 'err'); routing=false; setBusy(false); return; }
      const roles = au.role_keys || [];

      if(au.client_id){
        window.location.href = URL_CLIENT; return;
      }
      const hasHr = roles.some(r => HR_ROLES.includes(r));
      const hasStaff = roles.some(r => STAFF_ROLES.includes(r));
      if(hasHr){
        if(hasStaff){ showPortalChoice(); return; }   // beide Rechte → Auswahl
        window.location.href = URL_HR; return;
      }
      if(hasStaff){ window.location.href = URL_STAFF; return; }
      showMsg('Zugriff nicht berechtigt.', 'err'); routing=false; setBusy(false);
    }catch(e){
      showMsg('Verbindungsfehler beim Laden des Profils.', 'err'); routing=false; setBusy(false);
    }
  }

  function showPortalChoice(){ $('portalOverlay').classList.add('show'); }

  // ── Formular ──
  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearMsg();
    const email = $('email').value.trim();
    if(!email){ showMsg('Bitte E-Mail eingeben.', 'err'); return; }

    if(magicMode){
      setBusy(true);
      const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: window.location.href.split('#')[0] } });
      setBusy(false);
      if(error){ showMsg(error.message, 'err'); return; }
      showMsg('Magic-Link gesendet. Bitte prüfe dein E-Mail-Postfach.', 'ok');
      return;
    }

    const pw = $('password').value;
    if(!pw){ showMsg('Bitte Passwort eingeben.', 'err'); return; }
    setBusy(true);
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
    if(error){ setBusy(false); showMsg(error.message, 'err'); return; }
    if(data && data.session){ await routeUser(data.session); }
  });

  // ── Passwort vergessen → Magic-Link ──
  $('forgot').addEventListener('click', async () => {
    clearMsg();
    const email = $('email').value.trim();
    if(!email){ showMsg('Bitte zuerst deine E-Mail oben eingeben.', 'err'); return; }
    const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: window.location.href.split('#')[0] } });
    if(error){ showMsg(error.message, 'err'); return; }
    showMsg('Anmelde-Link gesendet. Öffne die E-Mail, um dich ohne Passwort anzumelden.', 'ok');
  });

  // ── Magic-Link-Toggle ──
  $('magicToggle').addEventListener('click', () => {
    magicMode = !magicMode;
    $('pwField').style.display = magicMode ? 'none' : 'block';
    $('btnLabel').textContent = magicMode ? 'Magic-Link senden' : 'Anmelden';
    $('magicToggle').textContent = magicMode ? 'Mit Passwort anmelden' : 'Magic-Link stattdessen';
    $('subtitle').textContent = magicMode ? 'Wir senden dir einen Anmelde-Link per E-Mail.' : 'Melde dich mit deinem TIVE-360°-Konto an.';
    clearMsg();
  });

  // ── Session-Restore + Magic-Link-Rückkehr ──
  sb.auth.onAuthStateChange((event, session) => {
    if(session && !routing){ routeUser(session); }
  });
</script>
</body>
</html>
