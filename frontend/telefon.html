<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>Telefonaktion · TIVE 360°</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root{ --teal:#0891b2; --teal-d:#0e7490; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f1f5f9; --card:#fff;
         --green:#15803d; --green-bg:#f0fdf4; --amber:#b45309; --amber-bg:#fffbeb; --red:#b91c1c; --red-bg:#fef2f2; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:16px 14px 60px}
  .top{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
  .logo{width:34px;height:34px;border-radius:9px;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
  .brand{font-weight:800;font-size:15px}
  h1{font-size:21px;margin:0 0 2px}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 16px;line-height:1.5}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .nm{font-weight:800;font-size:17px}
  .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px;margin-top:3px}
  .lvl{font-weight:800}
  .call{display:block;text-align:center;text-decoration:none;background:var(--teal);color:#fff;font-weight:800;font-size:18px;padding:13px;border-radius:12px;margin:12px 0}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  .b{flex:1;min-width:100px;padding:14px 8px;border-radius:12px;border:1px solid var(--line);font-size:14px;font-weight:800;cursor:pointer;background:#fff}
  .b.na{background:var(--amber-bg);color:var(--amber);border-color:#fde68a}
  .b.rj{background:var(--red-bg);color:var(--red);border-color:#fecaca}
  .b.ap{background:var(--green-bg);color:var(--green);border-color:#bbf7d0}
  .b:disabled{opacity:.5}
  .sub2{font-size:12.5px;color:var(--muted);margin:10px 0 6px}
  .reasons{display:flex;gap:8px;flex-wrap:wrap}
  .reasons .b{flex:1 1 100%;background:var(--red-bg);color:var(--red);border-color:#fecaca}
  .dt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .dt input{padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px}
  .badge{display:inline-block;font-size:13px;font-weight:800;padding:5px 12px;border-radius:20px}
  .link{background:none;border:none;color:var(--muted);font-size:12.5px;text-decoration:underline;cursor:pointer;padding:0;margin-left:8px}
  .whoami{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px}
  .whoami .who{font-weight:800}
  .pick{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .pick .pn{font-weight:800;font-size:16px}
  .pick .pc{font-size:13px;color:var(--muted)}
  .state{text-align:center;padding:52px 20px;color:var(--muted)}
  .state .big{font-size:44px;margin-bottom:10px}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
  .toast.err{background:#b91c1c}
  .prog{background:#e2e8f0;border-radius:8px;height:9px;overflow:hidden;margin:2px 0 14px}
  .prog>span{display:block;height:100%;background:var(--teal)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="logo">T</div><div class="brand">TIVE 360°</div></div>
  <div id="app"><div class="state"><div class="big">⏳</div>Lädt…</div></div>
</div>
<div id="toast" class="toast"></div>
<script>
const SB_URL='https://msdiyjxckmpvuomnhvjp.supabase.co';
const SB_KEY='sb_publishable_exKYOG6Znhj_JlO0v6erQQ_q0HWWiyl';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const app=document.getElementById('app');
const toastEl=document.getElementById('toast');
const token=new URLSearchParams(location.search).get('t')||'';
const LS_KEY='tive_phone_me_'+token;   // gemerkte Namenswahl je Link
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tel=p=>'tel:'+String(p||'').replace(/[^+0-9]/g,'');
const fmtDe=s=>{ if(!s) return '—'; const p=String(s).slice(0,10).split('-'); return p.length===3?(p[2]+'.'+p[1]+'.'):s; };
const REASONS=[['kein_interesse','Kein Interesse'],['zu_weit','Zu weit weg'],['hat_anderes','Hat schon was anderes']];
function tomorrow(){ const d=new Date(); d.setDate(d.getDate()+1); return d.toISOString().slice(0,10); }
function expText(e){ const s=String(e||'').toLowerCase().trim(); if(!s) return 'Erfahrung ?';
  if(/^(nein|no|kein|nicht)/.test(s)) return 'keine Erfahrung';
  if(/(ja|yes|jo|jahr|erfahr|agent|service|call|verkauf|[0-9])/.test(s)) return 'CC-Erfahrung ✓';
  return 'Erfahrung ?'; }
let toastT=null;
function toast(msg,err){ toastEl.textContent=msg; toastEl.className='toast show'+(err?' err':''); clearTimeout(toastT); toastT=setTimeout(()=>{toastEl.className='toast';},2200); }
function stateBox(icon,title,text){ app.innerHTML='<div class="state"><div class="big">'+icon+'</div><h1>'+esc(title)+'</h1><div class="sub">'+esc(text)+'</div></div>'; }

let PARTS=[]; let ME=null; let LEADS=[]; let ui={}; let busy=null;
let OVW=[]; let ALL=[]; let showTbl=false; let sK='assignee_name'; let sD=1; let fA=''; let fS='';
const SL={open:'offen',no_answer:'Nicht erreicht',rejected:'Abgesagt',appointment:'Termin'};
const RL={kein_interesse:'Kein Interesse',zu_weit:'Zu weit weg',hat_anderes:'Hat schon was anderes'};

async function boot(){
  if(!token){ return stateBox('🔗','Link ungültig','Bitte öffne den Link genau so, wie du ihn bekommen hast.'); }
  const {data,error}=await sb.rpc('phone_link_participants',{p_token:token});
  if(error){ return stateBox('⚠️','Konnte nicht laden','Bitte später erneut versuchen.'); }
  if(!data||!data.length){ return stateBox('🔗','Link ungültig oder leer','Für diesen Link ist keine Aktion hinterlegt.'); }
  PARTS=data;
  const ov=await sb.rpc('phone_link_overview',{p_token:token}); OVW=ov.data||[];
  const saved=localStorage.getItem(LS_KEY);
  if(saved && PARTS.some(p=>p.assignee_user_id===saved)){ ME=saved; return loadLeads(); }
  renderPicker();
}
function totalsHtml(){
  if(!OVW.length) return '';
  const t=OVW.reduce((a,o)=>({tot:a.tot+o.total,open:a.open+o.open,app:a.app+o.appointment}),{tot:0,open:0,app:0});
  const done=t.tot-t.open; const pct=t.tot?Math.round(100*done/t.tot):0;
  return '<div class="card" style="padding:14px 16px">'
    +'<div style="display:flex;gap:8px;text-align:center">'
    +'<div style="flex:1"><div style="font-size:26px;font-weight:800;color:var(--green)">'+t.app+'</div><div style="font-size:12px;color:var(--muted)">Termine</div></div>'
    +'<div style="flex:1"><div style="font-size:26px;font-weight:800">'+done+'</div><div style="font-size:12px;color:var(--muted)">erledigt</div></div>'
    +'<div style="flex:1"><div style="font-size:26px;font-weight:800;color:var(--amber)">'+t.open+'</div><div style="font-size:12px;color:var(--muted)">offen</div></div></div>'
    +'<div class="prog" style="margin-top:12px"><span style="width:'+pct+'%"></span></div>'
    +'<div class="sub2" style="margin:2px 0 0">'+done+' von '+t.tot+' bearbeitet ('+pct+'%)</div></div>';
}
function renderPicker(){
  let h='<h1>📞 Telefonaktion</h1><div class="sub">So läuft die Runde gerade:</div>';
  h+=totalsHtml();
  h+=overviewHtml();
  h+='<div class="sub" style="margin-top:14px">Wer bist du? Tipp auf deinen Namen — die Auswahl wird gemerkt.</div>';
  PARTS.forEach(p=>{ h+='<button class="pick" data-uid="'+esc(p.assignee_user_id)+'">'
    +'<span class="pn">'+esc(p.assignee_name)+'</span>'
    +'<span class="pc">'+p.open+' offen · '+p.total+'</span></button>'; });
  app.innerHTML=h;
  app.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{ ME=b.getAttribute('data-uid'); localStorage.setItem(LS_KEY,ME); loadLeads(); });
}
async function loadLeads(){
  app.innerHTML='<div class="state"><div class="big">⏳</div>Lädt…</div>';
  const [le,ov,al]=await Promise.all([
    sb.rpc('phone_link_leads',{p_token:token,p_assignee:ME}),
    sb.rpc('phone_link_overview',{p_token:token}),
    sb.rpc('phone_link_all',{p_token:token}) ]);
  if(le.error){ return stateBox('⚠️','Konnte nicht laden','Bitte erneut versuchen.'); }
  LEADS=le.data||[]; OVW=ov.data||[]; ALL=al.data||[]; render();
}
function overviewHtml(){
  if(!OVW.length) return '';
  let h='<div class="card" style="padding:12px 14px"><div class="sub2" style="margin:0 0 8px">📊 Übersicht · alle Teilnehmer</div>';
  OVW.forEach(o=>{ const done=o.total-o.open; const mine=o.assignee_user_id===ME;
    h+='<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:13px'+(mine?';font-weight:800':'')+'">'
      +'<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(o.assignee_name)+(mine?' (du)':'')+'</span>'
      +'<span style="color:var(--green);font-weight:800">'+o.appointment+' Termine</span>'
      +'<span style="color:var(--muted)">'+done+'/'+o.total+'</span>'
      +'<span style="color:'+(o.open>0?'var(--amber)':'var(--muted)')+'">'+o.open+' offen</span></div>'; });
  h+='</div>';
  return h;
}
function tableHtml(){
  let h='<button class="pick" id="tblToggle" style="margin-top:6px"><span class="pn" style="font-size:15px">📋 Alle Anrufe · Auswertung</span><span class="pc">'+(showTbl?'ausblenden':'anzeigen')+'</span></button>';
  if(!showTbl) return h;
  const fd=s=>{ if(!s) return ''; const p=String(s).slice(0,10).split('-'); return p[2]+'.'+p[1]+'.'; };
  const fdt=s=>{ if(!s) return '—'; const d=new Date(s); return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}); };
  const action=r=> r.status==='appointment'?('Termin '+fd(r.appointment_date)+(r.appointment_time?(' '+String(r.appointment_time).slice(0,5)):''))
    : r.status==='rejected'?(RL[r.reject_reason]||'Absage') : r.status==='no_answer'?('WV '+fd(r.followup_date)) : '—';
  const assignees=[...new Set(ALL.map(r=>r.assignee_name))].sort((a,b)=>String(a).localeCompare(String(b),'de'));
  let rows=ALL.filter(r=>(!fA||r.assignee_name===fA)&&(!fS||r.status===fS));
  const kf=r=> sK==='ergebnis'?action(r) : sK==='updated_at'?String(r.updated_at||'') : String(r[sK]||'').toLowerCase();
  rows=[...rows].sort((a,b)=>{ const x=kf(a),y=kf(b); return (x<y?-1:x>y?1:0)*sD; });
  const th=(k,l)=>'<th data-sk="'+k+'" style="padding:6px 6px;cursor:pointer;white-space:nowrap;text-align:left;color:var(--muted)">'+l+(sK===k?(sD>0?' ▲':' ▼'):'')+'</th>';
  h+='<div class="card" style="padding:10px 12px">';
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">'
    +'<select id="fA" style="flex:1;padding:8px;border:1px solid var(--line);border-radius:9px;font-size:14"><option value="">Alle Bearbeiter</option>'+assignees.map(a=>'<option value="'+esc(a)+'"'+(a===fA?' selected':'')+'>'+esc(a)+'</option>').join('')+'</select>'
    +'<select id="fS" style="flex:1;padding:8px;border:1px solid var(--line);border-radius:9px;font-size:14"><option value="">Alle Status</option>'+Object.entries(SL).map(([k,v])=>'<option value="'+k+'"'+(k===fS?' selected':'')+'>'+v+'</option>').join('')+'</select></div>';
  h+='<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12.5px"><thead><tr>'
    +th('cv_name','Bewerber')+th('assignee_name','Bearbeiter')+th('status','Status')+th('ergebnis','Was passiert')+th('updated_at','Wann')+th('note','Kommentar')+'</tr></thead><tbody>';
  rows.forEach(r=>{ h+='<tr style="border-top:1px solid var(--line)">'
    +'<td style="padding:5px 6px;font-weight:700">'+esc(r.cv_name)+'</td>'
    +'<td style="padding:5px 6px">'+esc(r.assignee_name)+'</td>'
    +'<td style="padding:5px 6px">'+(SL[r.status]||r.status)+'</td>'
    +'<td style="padding:5px 6px;white-space:nowrap">'+esc(action(r))+'</td>'
    +'<td style="padding:5px 6px;white-space:nowrap;color:var(--muted)">'+(r.status==='open'?'—':fdt(r.updated_at))+'</td>'
    +'<td style="padding:5px 6px;color:var(--muted)">'+esc(r.note||'')+'</td></tr>'; });
  h+='</tbody></table></div><div class="sub2" style="margin-top:6px">'+rows.length+' Zeilen</div></div>';
  return h;
}
function bindTable(){
  const t=document.getElementById('tblToggle'); if(t) t.onclick=()=>{ showTbl=!showTbl; render(); };
  const fa=document.getElementById('fA'); if(fa) fa.onchange=e=>{ fA=e.target.value; render(); };
  const fs=document.getElementById('fS'); if(fs) fs.onchange=e=>{ fS=e.target.value; render(); };
  document.querySelectorAll('th[data-sk]').forEach(th=>th.onclick=()=>{ const k=th.getAttribute('data-sk'); if(sK===k) sD=-sD; else { sK=k; sD=1; } render(); });
}
function meName(){ const p=PARTS.find(x=>x.assignee_user_id===ME); return p?p.assignee_name:''; }
function plusDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function statusBadge(l){
  if(l.status==='appointment') return '<span class="badge" style="background:var(--green-bg);color:var(--green)">✅ Termin '+fmtDe(l.appointment_date)+(l.appointment_time?(' '+String(l.appointment_time).slice(0,5)+' Uhr'):'')+'</span>';
  if(l.status==='rejected'){ const r=(REASONS.find(x=>x[0]===l.reject_reason)||[])[1]||'Absage'; return '<span class="badge" style="background:var(--red-bg);color:var(--red)">✗ '+esc(r)+'</span>'; }
  if(l.status==='no_answer') return '<span class="badge" style="background:var(--amber-bg);color:var(--amber)">📵 Wiedervorlage '+fmtDe(l.followup_date)+'</span>';
  return '';
}
function noteField(l){ return '<input type="text" data-note maxlength="200" placeholder="Notiz (optional): z. B. ruft morgen zurück" value="'+esc(l.note||'')+'" style="width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;margin-top:9px"/>'; }
function render(){
  const open=LEADS.filter(l=>l.status==='open').length; const done=LEADS.length-open; const pct=LEADS.length?Math.round(100*done/LEADS.length):0;
  let h='<div class="whoami"><span class="who">👋 '+esc(meName())+'</span><button class="link" id="switch">Nicht du? Wechseln</button></div>';
  h+=overviewHtml();
  h+='<div class="sub" style="margin-top:12px">Deine Anrufe · Ziel: zum Gespräch ins Büro einladen. Nach jedem Anruf ein Knopf.</div>';
  h+='<div class="prog"><span style="width:'+pct+'%"></span></div>';
  h+='<div class="sub" style="margin-top:-8px">'+open+' offen · '+done+' erledigt von '+LEADS.length+'</div>';
  if(!LEADS.length){ h+='<div class="state">Dir sind keine Bewerber zugeteilt.</div>'; }
  const order=[...LEADS.filter(l=>l.status==='open'),...LEADS.filter(l=>l.status!=='open')];
  order.forEach(l=>{ h+=card(l); });
  h+=tableHtml();
  app.innerHTML=h;
  const sw=document.getElementById('switch'); if(sw) sw.onclick=()=>{ localStorage.removeItem(LS_KEY); ME=null; renderPicker(); };
  order.forEach(l=>bind(l));
  bindTable();
}
function card(l){
  const id=l.lead_id; const done=l.status!=='open';
  let h='<div class="card" data-id="'+id+'" style="opacity:'+(done?'.8':'1')+'">';
  h+='<div class="nm">'+esc(l.first_name)+' '+esc(l.last_name)+'</div>';
  h+='<div class="meta"><span class="lvl" style="color:'+(l.language_level==='C1'?'var(--green)':'var(--teal)')+'">'+esc(l.language_level||'—')+'</span>'
     +'<span style="color:var(--muted)">'+esc(expText(l.cc_experience))+'</span>'
     +'<span style="color:var(--muted)">beworben '+fmtDe(l.cv_date)+'</span></div>';
  h+='<a class="call" href="'+tel(l.phone)+'">📞 '+esc(l.phone||'—')+'</a>';
  if(done){ h+='<div>'+statusBadge(l)+'<button class="link" data-act="open">ändern</button></div>';
     if(l.note) h+='<div class="sub2" style="margin-top:6px">📝 '+esc(l.note)+'</div>'; }
  else if(ui[id]==='na'){ h+='<div class="sub2">Wiedervorlage am:</div><div class="dt">'
     +'<input type="date" data-date value="'+plusDays(2)+'"/>'
     +'<button class="b na" data-act="na-ok" style="flex:0 0 auto">Bestätigen</button>'
     +'<button class="b" data-act="back" style="flex:0 0 auto">Zurück</button></div>'+noteField(l); }
  else if(ui[id]==='reject'){ h+=noteField(l)+'<div class="sub2">Grund der Absage:</div><div class="reasons">'
     +REASONS.map(([k,lb])=>'<button class="b rj" data-act="rj" data-reason="'+k+'">'+lb+'</button>').join('')
     +'<button class="b" data-act="back">Zurück</button></div>'; }
  else if(ui[id]==='termin'){ h+='<div class="dt"><span style="font-weight:800;color:var(--green)">Termin</span>'
     +'<input type="date" data-date value="'+tomorrow()+'"/>'
     +'<input type="time" data-time value="10:00" style="flex:0 0 auto"/></div>'
     +noteField(l)+'<div class="dt" style="margin-top:9px">'
     +'<button class="b ap" data-act="ap-ok">Bestätigen</button>'
     +'<button class="b" data-act="back" style="flex:0 0 auto">Zurück</button></div>'; }
  else { h+='<div class="btns">'
     +'<button class="b na" data-act="na-open">📵 Nicht erreicht</button>'
     +'<button class="b rj" data-act="rj-open">✗ Abgesagt</button>'
     +'<button class="b ap" data-act="ap-open">✅ Termin</button></div>'; }
  h+='</div>';
  return h;
}
function bind(l){
  const el=app.querySelector('.card[data-id="'+l.lead_id+'"]'); if(!el) return;
  const noteVal=()=>{ const n=el.querySelector('[data-note]'); return n?n.value.trim():null; };
  el.querySelectorAll('[data-act]').forEach(b=>{ b.onclick=async()=>{
    const act=b.getAttribute('data-act');
    if(act==='na-open'){ ui[l.lead_id]='na'; return render(); }
    if(act==='rj-open'){ ui[l.lead_id]='reject'; return render(); }
    if(act==='ap-open'){ ui[l.lead_id]='termin'; return render(); }
    if(act==='back'){ ui[l.lead_id]=null; return render(); }
    if(act==='open') return log(l,'open');
    if(act==='na-ok'){ const d=el.querySelector('[data-date]').value||plusDays(2); return log(l,'no_answer',null,d,null,noteVal()); }
    if(act==='rj') return log(l,'rejected',b.getAttribute('data-reason'),null,null,noteVal());
    if(act==='ap-ok'){ const d=el.querySelector('[data-date]').value||tomorrow(); const t=(el.querySelector('[data-time]')||{}).value||null; return log(l,'appointment',null,d,t,noteVal()); }
  }; });
}
async function log(l,result,reason,date,time,note){
  if(busy) return; busy=l.lead_id;
  const {error}=await sb.rpc('phone_link_log',{p_token:token,p_assignee:ME,p_lead_id:l.lead_id,p_result:result,p_reason:reason||null,p_date:date||null,p_time:time||null,p_note:note||null});
  busy=null;
  if(error){ toast('Nicht gespeichert: '+(error.message||''),true); return; }
  ui[l.lead_id]=null;
  toast(result==='appointment'?'Termin gespeichert ✅':result==='rejected'?'Als Absage vermerkt':result==='no_answer'?'Wiedervorlage gesetzt':'Zurückgesetzt');
  await loadLeads();
}
boot();
</script>
</body>
</html>
