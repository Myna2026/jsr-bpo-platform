<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TIVE 360° Stempeluhr</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body,#root{height:100%;width:100%;overflow:hidden;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#080c14;color:white;user-select:none;-webkit-user-select:none;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;
const SB_URL='https://msdiyjxckmpvuomnhvjp.supabase.co';
const SB_KEY='sb_publishable_exKYOG6Znhj_JlO0v6erQQ_q0HWWiyl';
const sb=window.supabase.createClient(SB_URL,SB_KEY);

function Kiosk(){
  const [pin,setPin]=useState('');
  const [phase,setPhase]=useState('pin'); // pin | confirm | success | error | action
  const [employee,setEmployee]=useState(null);
  const [session,setSession]=useState(null);
  const [msg,setMsg]=useState('');
  const [time,setTime]=useState(new Date());
  const resetTimer=useRef(null);

  useEffect(()=>{
    const t=setInterval(()=>setTime(new Date()),1000);
    return()=>clearInterval(t);
  },[]);

  function resetToPin(){
    setPin('');
    setPhase('pin');
    setEmployee(null);
    setSession(null);
  }

  function scheduleReset(ms=4000){
    if(resetTimer.current) clearTimeout(resetTimer.current);
    resetTimer.current=setTimeout(resetToPin,ms);
  }

  function handlePin(digit){
    if(pin.length>=4) return;
    const newPin=pin+digit;
    setPin(newPin);
    if(newPin.length===4){
      // Look up employee by PIN
      setTimeout(()=>lookupPin(newPin),100);
    }
  }

  function handleDel(){
    setPin(p=>p.slice(0,-1));
  }

  async function lookupPin(p){
    try{
      const {data,error}=await sb.rpc('lookup_pin',{p_code:p});
      const r=data||{};
      if(error||r.error){
        if(r.error==='locked'){
          const secs=r.retry_after_seconds||60;
          setMsg('Terminal kurz gesperrt — bitte in '+secs+' Sekunden erneut versuchen');
        } else {
          setMsg('PIN nicht erkannt — bitte erneut versuchen');   // neutral: verraet nicht, ob der PIN existiert
        }
        setPhase('error');scheduleReset(3000);return;
      }
      setEmployee({name:r.emp_name,staff_number:r.staff_number,status:r.status});
      setSession(r.session||null);
      setMsg('');
      setPhase('confirm');
    }catch(e){setMsg('Verbindungsfehler — bitte erneut versuchen');setPhase('error');scheduleReset(3000);}
  }

  async function stamp(action){
    try{
      const {data,error}=await sb.rpc('stamp_by_pin',{p_code:pin,p_action:action});
      const r=data||{};
      if(error||!r.ok){
        if(r.error==='locked'){
          const secs=r.retry_after_seconds||60;
          setMsg('Terminal kurz gesperrt — bitte in '+secs+' Sekunden erneut versuchen');
        } else {
          setMsg('Aktion nicht möglich — bitte erneut versuchen');
        }
        setPhase('error');scheduleReset(3000);return;
      }
      setSession(r.session_state||null);
      setPhase('success');
      scheduleReset(3000);
    }catch(e){setMsg('Verbindungsfehler — bitte erneut versuchen');setPhase('error');scheduleReset(3000);}
  }

  const timeStr=time.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const dateStr=time.toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});

  // ── PIN SCREEN ──────────────────────────────────────────────────────
  if(phase==='pin'||phase==='error'){
    return(
      <div style={{height:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'#080c14',gap:0}}>
        {/* Header */}
        <div style={{textAlign:'center',marginBottom:32}}>
          <div style={{fontSize:13,fontWeight:800,color:'#5EA3AF',letterSpacing:'.2em',textTransform:'uppercase',marginBottom:8}}>TIVE 360° · Stempeluhr</div>
          <div style={{fontSize:42,fontWeight:800,fontFamily:'monospace',color:'white',letterSpacing:4}}>{timeStr}</div>
          <div style={{fontSize:14,color:'#475569',marginTop:4}}>{dateStr}</div>
        </div>

        {/* PIN display */}
        <div style={{marginBottom:24}}>
          <div style={{fontSize:12,color:'#475569',textAlign:'center',letterSpacing:'.15em',textTransform:'uppercase',marginBottom:12}}>
            {phase==='error'?(msg||'PIN nicht erkannt — bitte erneut versuchen'):'PIN eingeben'}
          </div>
          <div style={{display:'flex',gap:16,justifyContent:'center'}}>
            {[0,1,2,3].map(i=>(
              <div key={i} style={{
                width:20,height:20,borderRadius:'50%',
                background:i<pin.length?(phase==='error'?'#ef4444':'#0F5661'):'transparent',
                border:'2px solid '+(i<pin.length?(phase==='error'?'#ef4444':'#0F5661'):'#334155'),
                transition:'all .15s'
              }}/>
            ))}
          </div>
        </div>

        {/* Numpad */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,width:280}}>
          {[1,2,3,4,5,6,7,8,9,'←',0,''].map((k,i)=>(
            k===''?<div key={i}/>:
            <button key={i}
              onClick={()=>k==='←'?handleDel():handlePin(String(k))}
              style={{
                height:72,borderRadius:16,border:'none',cursor:'pointer',
                fontSize:k==='←'?24:28,fontWeight:700,
                background:k==='←'?'#1e293b':'#1a2035',
                color:k==='←'?'#94a3b8':'white',
                transition:'all .1s',
                boxShadow:'0 4px 12px rgba(0,0,0,.3)'
              }}>
              {k}
            </button>
          ))}
        </div>
      </div>
    );
  }

  // ── CONFIRM SCREEN ──────────────────────────────────────────────────
  if(phase==='confirm'&&employee){
    const isIn=!!(session&&!session.clock_out);
    const isDone=!!(session&&session.clock_out);
    const inPause=isIn?session.pause_active:null;
    const inSmoke=isIn?session.smoke_active:null;
    const initials=(employee.name||'?').trim().split(/\s+/).map(w=>w[0]||'').slice(0,2).join('').toUpperCase()||'?';

    const actions=[];
    if(!isIn&&!isDone) actions.push({label:'⬇ Einstempeln',action:'in',bg:'#065f46',color:'white'});
    if(isIn){
      actions.push({label:'⬆ Ausstempeln',action:'out',bg:'#7f1d1d',color:'white'});
      if(!inPause&&!inSmoke){
        actions.push({label:'☕ Pause',action:'pause_start',bg:'#0F5661',color:'white'});
        actions.push({label:'🚬 Raucher',action:'smoke_start',bg:'#3b2a1a',color:'white'});
      }
      if(inPause) actions.push({label:'☕ Pause beenden',action:'pause_end',bg:'#0F5661',color:'white'});
      if(inSmoke) actions.push({label:'🚬 Raucher beenden',action:'smoke_end',bg:'#3b2a1a',color:'white'});
    }

    return(
      <div style={{height:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'#080c14',padding:32}}>
        {/* Avatar */}
        <div style={{width:96,height:96,borderRadius:'50%',
          background:'#1d4ed8',
          display:'flex',alignItems:'center',justifyContent:'center',
          fontSize:32,fontWeight:800,color:'white',marginBottom:20,
          boxShadow:'0 0 0 4px rgba(15,86,97,.3)'}}>
          {initials}
        </div>
        <div style={{fontSize:28,fontWeight:800,marginBottom:4}}>{employee.name}</div>
        <div style={{fontSize:14,color:'#64748b',marginBottom:8}}>Personalnr. {employee.staff_number||'—'}</div>
        <div style={{fontSize:13,color:isIn?'#34d399':isDone?'#94a3b8':'#fbbf24',marginBottom:28,fontWeight:600}}>
          {isDone?'✓ Heute bereits ausgestempelt ('+session.clock_in+' – '+session.clock_out+')':
           isIn?(inPause?'☕ In Pause seit '+inPause:inSmoke?'🚬 Raucherpause seit '+inSmoke:'✓ Eingestempelt seit '+session.clock_in):
           '○ Noch nicht eingestempelt heute'}
        </div>

        {/* Action buttons */}
        <div style={{display:'flex',flexDirection:'column',gap:12,width:'100%',maxWidth:320}}>
          {actions.map(a=>(
            <button key={a.action} onClick={()=>stamp(a.action)}
              style={{height:64,borderRadius:16,border:'none',cursor:'pointer',
                fontSize:20,fontWeight:700,background:a.bg,color:a.color,
                boxShadow:'0 4px 16px rgba(0,0,0,.3)'}}>
              {a.label}
            </button>
          ))}
          <button onClick={resetToPin}
            style={{height:48,borderRadius:12,border:'1px solid #1e293b',cursor:'pointer',
              fontSize:14,background:'transparent',color:'#475569'}}>
            Abbrechen
          </button>
        </div>
      </div>
    );
  }

  // ── SUCCESS SCREEN ──────────────────────────────────────────────────
  if(phase==='success'){
    return(
      <div style={{height:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'#022c22',gap:16}}>
        <div style={{fontSize:80}}>✅</div>
        <div style={{fontSize:28,fontWeight:800,color:'#34d399'}}>Gestempelt!</div>
        <div style={{fontSize:14,color:'#6ee7b7'}}>{employee?.name}</div>
        <div style={{fontSize:14,color:'#064e3b',marginTop:8}}>{timeStr}</div>
      </div>
    );
  }

  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Kiosk/>);
</script>
</body>
</html>
