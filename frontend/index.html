<html lang="de">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIVE 360°</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F6F8;--card:#fff;--border:#E4E7EB;--border2:#CBD1D8;
  --text:#1F2937;--muted:#6B7280;--dim:#9CA3AF;
  --blue:#0F5661;--blue-bg:#E4EEF0;
  --green:#16a34a;--green-bg:#f0fdf4;
  --amber:#d97706;--amber-bg:#fffbeb;
  --red:#dc2626;--red-bg:#fef2f2;
  --purple:#7c3aed;--purple-bg:#f5f3ff;
  --teal:#0d9488;--teal-bg:#f0fdfa;
  --font-mono:'JetBrains Mono',monospace;--font-body:'Inter',system-ui,sans-serif;
  --r:10px;--r-lg:14px;--r-xl:18px;
  --shadow:0 1px 3px rgba(15,86,97,.08),0 1px 2px rgba(15,86,97,.04);
  --shadow-md:0 4px 12px rgba(15,86,97,.08);
  --shadow-lg:0 8px 30px rgba(0,0,0,.12);
}
html{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh}

/* Login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#08282E 0%,#0B3A42 50%,#0F5661 100%);padding:20px;position:relative;overflow:hidden}
.login-wrap::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 70% 30%,rgba(15,86,97,.2) 0%,transparent 60%)}
.login-box{background:#fff;border-radius:20px;padding:40px;width:100%;max-width:420px;box-shadow:0 24px 80px rgba(0,0,0,.25);position:relative;z-index:1}
.login-logo-wrap{text-align:center;margin-bottom:32px}
.login-logo-badge{display:inline-block;padding:8px 16px;background:linear-gradient(135deg,#0F5661,#0B454E);border-radius:10px;color:#fff;font-size:18px;font-weight:800;letter-spacing:.08em;font-family:var(--font-mono);margin-bottom:12px}
.login-title{font-size:24px;font-weight:700;color:var(--text)}
.login-sub{font-size:13px;color:var(--muted);margin-top:4px}
.login-section{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.login-team-btn{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);border:1.5px solid var(--border);background:#fff;cursor:pointer;font-family:var(--font-body);transition:all .15s;width:100%;text-align:left;margin-bottom:8px}
.login-team-btn:hover{border-color:var(--blue);background:var(--blue-bg);transform:translateX(2px)}
.login-team-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.login-team-name{font-size:13px;font-weight:600;color:var(--text)}
.login-team-role{font-size:11px;color:var(--muted);margin-top:1px}

/* App Shell */
.app-shell{min-height:100vh;display:flex;flex-direction:column}

/* Header */
.header{background:linear-gradient(135deg,#08282E,#0F5661);padding:0;flex-shrink:0;box-shadow:0 2px 20px rgba(0,0,0,.2)}
.header-inner{max-width:1400px;margin:0 auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between;height:60px}
.header-logo{display:flex;align-items:center;gap:12px}
.header-badge{background:linear-gradient(135deg,#0F5661,#7c3aed);border-radius:8px;padding:5px 11px;font-size:13px;font-weight:800;color:#fff;letter-spacing:.08em;font-family:var(--font-mono)}
.header-name{font-size:16px;font-weight:700;color:#fff}
.header-tagline{font-size:11px;color:rgba(255,255,255,.5);margin-top:1px}
.header-right{display:flex;align-items:center;gap:12px}
.header-user{display:flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(255,255,255,.1);border-radius:var(--r);cursor:pointer;transition:background .15s}
.header-user:hover{background:rgba(255,255,255,.15)}
.header-user-name{font-size:12px;color:#fff;font-weight:500}
.header-date{font-size:11px;color:rgba(255,255,255,.5)}

/* Hero */
.hero{background:linear-gradient(135deg,#08282E 0%,#0B3A42 60%,#0F5661 100%);padding:48px 28px 56px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-80px;bottom:-80px;width:400px;height:400px;background:radial-gradient(circle,rgba(15,86,97,.2),transparent 70%);pointer-events:none}
.hero-inner{max-width:1400px;margin:0 auto;position:relative;z-index:1}
.hero-greeting{font-size:13px;color:rgba(255,255,255,.6);font-weight:500;margin-bottom:8px;letter-spacing:.04em}
.hero-title{font-size:32px;font-weight:800;color:#fff;margin-bottom:6px;line-height:1.2}
.hero-sub{font-size:14px;color:rgba(255,255,255,.6);margin-bottom:32px}
.hero-stats{display:flex;gap:20px;flex-wrap:wrap}
.hero-stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:var(--r-lg);padding:14px 20px;backdrop-filter:blur(10px)}
.hero-stat-val{font-size:26px;font-weight:800;color:#fff;font-family:var(--font-mono)}
.hero-stat-label{font-size:11px;color:rgba(255,255,255,.55);margin-top:3px}

/* Content */
.content{flex:1;padding:28px;max-width:1400px;margin:0 auto;width:100%}

/* Section */
.section-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}

/* App Tiles */
.tiles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-bottom:32px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:all .2s;position:relative}
.tile:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.tile-active{border-color:transparent}
.tile-soon{opacity:.6;cursor:default}
.tile-soon:hover{transform:none;box-shadow:var(--shadow)}
.tile-header{padding:20px 20px 0}
.tile-icon-wrap{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:14px}
.tile-name{font-size:16px;font-weight:700;color:var(--text);margin-bottom:4px}
.tile-desc{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:14px}
.tile-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:#fafafa}
.tile-badge{font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.05em}
.tile-arrow{color:var(--muted);font-size:16px;transition:transform .15s}
.tile:hover .tile-arrow{transform:translateX(3px);color:var(--blue)}
.tile-features{display:flex;flex-wrap:wrap;gap:5px;padding:0 20px 16px}
.tile-feat{font-size:10px;padding:2px 7px;border-radius:20px;background:var(--bg);border:1px solid var(--border);color:var(--muted)}

/* Quicklinks */
.quicklinks{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}
.ql{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--r);background:var(--card);border:1px solid var(--border);cursor:pointer;font-size:12px;font-weight:500;color:var(--muted);transition:all .15s;box-shadow:var(--shadow)}
.ql:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}

/* Activity */
.activity-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.activity-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.activity-text{font-size:13px;color:var(--text);line-height:1.4}
.activity-time{font-size:11px;color:var(--muted);margin-top:2px}

/* Mobile */
@media(max-width:768px){
  .hero{padding:28px 16px 36px}
  .hero-title{font-size:24px}
  .hero-stats{gap:10px}
  .hero-stat{padding:10px 14px}
  .hero-stat-val{font-size:20px}
  .content{padding:16px}
  .tiles-grid{grid-template-columns:1fr}
  .header-inner{padding:0 16px}
  .header-name,.header-tagline{display:none}
  .hero-inner{padding:0}
}
</style>
</head>

        </div>
        <div className="login-section">Team auswählen</div>
        {TEAMS.map(t=>(
          <button key={t.id} className="login-team-btn" onClick={()=>{sessionStorage.setItem('jsr_team',JSON.stringify(t));window.location.href='hr.html';}}>

function Dashboard({team, onLogout}){
  const now = new Date();
  const hour = now.getHours();
  const greeting = hour < 12 ? 'Guten Morgen' : hour < 18 ? 'Guten Tag' : 'Guten Abend';

  // Read some stats from HR localStorage
  const employees = (() => { try{return JSON.parse(localStorage.getItem('jsr_emp_v3')||'[]');}catch{return [];} })();
  const active = employees.filter(e=>e.status==='active').length;
  const training = employees.filter(e=>e.status==='training').length;
  const pipeline = employees.filter(e=>['cv_received','in_system','presented','selected'].includes(e.status)).length;

  const activity = [
    {text:'HR System gestartet — alle Funktionen verfügbar', time:'Gerade eben', color:'var(--green)'},
    {text:`${active} Mitarbeiter aktiv · ${training} in Schulung`, time:'Aktuell', color:'var(--blue)'},
    {text:`${pipeline} Profile in der Recruiting Pipeline`, time:'Aktuell', color:'var(--purple)'},
    {text:'Lead Research: 246 Unternehmen im System', time:'Aktuell', color:'var(--amber)'},
  ];

  return(
    <div className="app-shell">
      {/* Header */}
      <div className="header">
        <div className="header-inner">
          <div className="header-logo">
            <div className="header-badge"><img src="assets/tive360-mark.svg" alt="TIVE 360°" style={{width:18,height:18,filter:'brightness(0) invert(1)'}}/></div>
            <div>
              <div className="header-name">TIVE 360°</div>
              <div className="header-tagline">Management Platform</div>
            </div>
          </div>
          <div className="header-right">
            <div className="header-date">{now.toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}</div>
            <div className="header-user" onClick={onLogout}>
              <span style={{fontSize:18,display:'inline-flex',alignItems:'center'}} dangerouslySetInnerHTML={{__html:team.icon}} />
              <div>
                <div className="header-user-name">{team.name}</div>
                <div style={{fontSize:10,color:'rgba(255,255,255,.4)'}}>Abmelden</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      {/* Hero */}
      <div className="hero">
        <div className="hero-inner">
          <div className="hero-greeting">{greeting}, {team.name}</div>
          <div className="hero-title">Willkommen im TIVE 360° Portal</div>
          <div className="hero-sub">Ihr zentrales Dashboard für Leads, Team, Kunden und Reporting</div>
          <div className="hero-stats">
            {[
              {val:active, label:'Aktive Mitarbeiter'},
              {val:training, label:'In Schulung'},
              {val:pipeline, label:'In Pipeline'},
              {val:246, label:'Lead Unternehmen'},
            ].map((s,i)=>(
              <div key={i} className="hero-stat">
                <div className="hero-stat-val">{s.val}</div>
                <div className="hero-stat-label">{s.label}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div className="content">
        {/* Quicklinks */}
        <div className="quicklinks">
          {QUICKLINKS.map(q=>(
            <div key={q.label} className="ql" onClick={()=>window.location.href=q.url}>
              <span style={{fontSize:15,display:'inline-flex',alignItems:'center'}} dangerouslySetInnerHTML={{__html:q.icon}} />{q.label}
            </div>
          ))}
        </div>

        {/* Apps */}
        <div className="section-title">Anwendungen</div>
        <div className="tiles-grid">
          {APPS.map(app=>{
            const isActive = !!app.url;
            return(
              <div key={app.id}
                className={`tile ${isActive?'tile-active':'tile-soon'}`}
                onClick={()=>isActive&&(/^https?:\/\//.test(app.url)?window.open(app.url,'_blank','noopener'):window.location.href=app.url)}
                style={isActive?{borderColor:app.color+'33'}:{}}>
                <div className="tile-header">
                  <div className="tile-icon-wrap" style={{background:app.iconBg,color:app.color}} dangerouslySetInnerHTML={{__html:app.icon}} />
                  <div className="tile-name">{app.name}</div>
                  <div className="tile-desc">{app.desc}</div>
                </div>
                <div className="tile-features">
                  {app.features.map(f=><span key={f} className="tile-feat">{f}</span>)}
                </div>
                <div className="tile-footer" style={isActive?{background:app.color+'08'}:{}}>
                  <span className="tile-badge" style={{background:app.badgeBg,color:app.badgeColor}}>{app.badge}</span>
                  {isActive
                    ? <span className="tile-arrow">→</span>
                    : <span style={{fontSize:11,color:'var(--dim)'}}>In Entwicklung</span>
                  }
                </div>
              </div>
            );
          })}
        </div>

        {/* Activity & Info */}
        <div className="grid-2" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
          <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:'var(--r-lg)',padding:20,boxShadow:'var(--shadow)'}}>
            <div style={{fontSize:13,fontWeight:600,marginBottom:14,display:'flex',alignItems:'center',gap:6}}><span style={{fontSize:16,display:'inline-flex',alignItems:'center'}} dangerouslySetInnerHTML={{__html:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="1em" height="1em" style="display:block"><path fill-rule="evenodd" d="M14.615 1.595a.75.75 0 0 1 .359.852L12.982 9.75h7.268a.75.75 0 0 1 .548 1.262l-10.5 11.25a.75.75 0 0 1-1.272-.71l1.992-7.302H3.75a.75.75 0 0 1-.548-1.262l10.5-11.25a.75.75 0 0 1 .913-.143Z" clip-rule="evenodd"/></svg>'}} />System-Status</div>
            {activity.map((a,i)=>(
              <div key={i} className="activity-item">
                <div className="activity-dot" style={{background:a.color}}/>
                <div>
                  <div className="activity-text">{a.text}</div>
                  <div className="activity-time">{a.time}</div>
                </div>
              </div>
            ))}
          </div>
          <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:'var(--r-lg)',padding:20,boxShadow:'var(--shadow)'}}>
            <div style={{fontSize:13,fontWeight:600,marginBottom:14,display:'flex',alignItems:'center',gap:6}}><span style={{fontSize:16,display:'inline-flex',alignItems:'center'}} dangerouslySetInnerHTML={{__html:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="1em" height="1em" style="display:block"><path fill-rule="evenodd" d="M7.502 6h7.128A3.375 3.375 0 0 1 18 9.375v9.375a3 3 0 0 0 3-3V6.108c0-1.505-1.125-2.811-2.664-2.94a48.972 48.972 0 0 0-.673-.05A3 3 0 0 0 15 1.5h-1.5a3 3 0 0 0-2.663 1.618c-.225.015-.45.032-.673.05C8.662 3.295 7.554 4.542 7.502 6ZM13.5 3A1.5 1.5 0 0 0 12 4.5h4.5A1.5 1.5 0 0 0 15 3h-1.5Z" clip-rule="evenodd"/> <path fill-rule="evenodd" d="M3 9.375C3 8.339 3.84 7.5 4.875 7.5h9.75c1.036 0 1.875.84 1.875 1.875v11.25c0 1.035-.84 1.875-1.875 1.875h-9.75A1.875 1.875 0 0 1 3 20.625V9.375ZM6 12a.75.75 0 0 1 .75-.75h.008a.75.75 0 0 1 .75.75v.008a.75.75 0 0 1-.75.75H6.75a.75.75 0 0 1-.75-.75V12Zm2.25 0a.75.75 0 0 1 .75-.75h3.75a.75.75 0 0 1 0 1.5H9a.75.75 0 0 1-.75-.75ZM6 15a.75.75 0 0 1 .75-.75h.008a.75.75 0 0 1 .75.75v.008a.75.75 0 0 1-.75.75H6.75a.75.75 0 0 1-.75-.75V15Zm2.25 0a.75.75 0 0 1 .75-.75h3.75a.75.75 0 0 1 0 1.5H9a.75.75 0 0 1-.75-.75ZM6 18a.75.75 0 0 1 .75-.75h.008a.75.75 0 0 1 .75.75v.008a.75.75 0 0 1-.75.75H6.75a.75.75 0 0 1-.75-.75V18Zm2.25 0a.75.75 0 0 1 .75-.75h3.75a.75.75 0 0 1 0 1.5H9a.75.75 0 0 1-.75-.75Z" clip-rule="evenodd"/></svg>'}} />Ihr Zugang</div>
            <div style={{padding:'14px',background:'var(--bg)',borderRadius:'var(--r)',marginBottom:12}}>
              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}>
                <div style={{width:40,height:40,borderRadius:10,background:team.color+'18',display:'flex',alignItems:'center',justifyContent:'center',fontSize:20}} dangerouslySetInnerHTML={{__html:team.icon}} />
                <div>
                  <div style={{fontWeight:600,fontSize:14}}>{team.name}</div>
                  <div style={{fontSize:11,color:'var(--muted)'}}>{team.role}</div>
                </div>
              </div>
              <div style={{fontSize:12,color:'var(--muted)'}}>Kein Passwort · Interner Bereich</div>
            </div>
            <div style={{fontSize:12,color:'var(--muted)',lineHeight:1.8}}>
              <div><span style={{display:'inline-flex',verticalAlign:'-3px',marginRight:5,fontSize:15}} dangerouslySetInnerHTML={{__html:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="1em" height="1em" style="display:block"><path d="M21.721 12.752a9.711 9.711 0 0 0-.945-5.003 12.754 12.754 0 0 1-4.339 2.708 18.991 18.991 0 0 1-.214 4.772 17.165 17.165 0 0 0 5.498-2.477ZM14.634 15.55a17.324 17.324 0 0 0 .332-4.647c-.952.227-1.945.347-2.966.347-1.021 0-2.014-.12-2.966-.347a17.515 17.515 0 0 0 .332 4.647 17.385 17.385 0 0 0 5.268 0ZM9.772 17.119a18.963 18.963 0 0 0 4.456 0A17.182 17.182 0 0 1 12 21.724a17.18 17.18 0 0 1-2.228-4.605ZM7.777 15.23a18.87 18.87 0 0 1-.214-4.774 12.753 12.753 0 0 1-4.34-2.708 9.711 9.711 0 0 0-.944 5.004 17.165 17.165 0 0 0 5.498 2.477ZM21.356 14.752a9.765 9.765 0 0 1-7.478 6.817 18.64 18.64 0 0 0 1.988-4.718 18.627 18.627 0 0 0 5.49-2.098ZM2.644 14.752c1.682.971 3.53 1.688 5.49 2.099a18.64 18.64 0 0 0 1.988 4.718 9.765 9.765 0 0 1-7.478-6.816ZM13.878 2.43a9.755 9.755 0 0 1 6.116 3.986 11.267 11.267 0 0 1-3.746 2.504 18.63 18.63 0 0 0-2.37-6.49ZM12 2.276a17.152 17.152 0 0 1 2.805 7.121c-.897.23-1.837.353-2.805.353-.968 0-1.908-.122-2.805-.353A17.151 17.151 0 0 1 12 2.276ZM10.122 2.43a18.629 18.629 0 0 0-2.37 6.49 11.266 11.266 0 0 1-3.746-2.504 9.754 9.754 0 0 1 6.116-3.985Z"/></svg>'}} />Lead Research → <strong>246</strong> Unternehmen</div>
              <div><span style={{display:'inline-flex',verticalAlign:'-3px',marginRight:5,fontSize:15}} dangerouslySetInnerHTML={{__html:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="1em" height="1em" style="display:block"><path d="M4.5 6.375a4.125 4.125 0 1 1 8.25 0 4.125 4.125 0 0 1-8.25 0ZM14.25 8.625a3.375 3.375 0 1 1 6.75 0 3.375 3.375 0 0 1-6.75 0ZM1.5 19.125a7.125 7.125 0 0 1 14.25 0v.003l-.001.119a.75.75 0 0 1-.363.63 13.067 13.067 0 0 1-6.761 1.873c-2.472 0-4.786-.684-6.76-1.873a.75.75 0 0 1-.364-.63l-.001-.122ZM17.25 19.128l-.001.144a2.25 2.25 0 0 1-.233.96 10.088 10.088 0 0 0 5.06-1.01.75.75 0 0 0 .42-.643 4.875 4.875 0 0 0-6.957-4.611 8.586 8.586 0 0 1 1.71 5.157v.003Z"/></svg>'}} />HR System → <strong>{active + training}</strong> Mitarbeiter</div>
              <div><span style={{display:'inline-flex',verticalAlign:'-3px',marginRight:5,fontSize:15}} dangerouslySetInnerHTML={{__html:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="1em" height="1em" style="display:block"><path fill-rule="evenodd" d="M3 2.25a.75.75 0 0 0 0 1.5v16.5h-.75a.75.75 0 0 0 0 1.5H15v-18a.75.75 0 0 0 0-1.5H3ZM6.75 19.5v-2.25a.75.75 0 0 1 .75-.75h3a.75.75 0 0 1 .75.75v2.25a.75.75 0 0 1-.75.75h-3a.75.75 0 0 1-.75-.75ZM6 6.75A.75.75 0 0 1 6.75 6h.75a.75.75 0 0 1 0 1.5h-.75A.75.75 0 0 1 6 6.75ZM6.75 9a.75.75 0 0 0 0 1.5h.75a.75.75 0 0 0 0-1.5h-.75ZM6 12.75a.75.75 0 0 1 .75-.75h.75a.75.75 0 0 1 0 1.5h-.75a.75.75 0 0 1-.75-.75ZM10.5 6a.75.75 0 0 0 0 1.5h.75a.75.75 0 0 0 0-1.5h-.75Zm-.75 3.75A.75.75 0 0 1 10.5 9h.75a.75.75 0 0 1 0 1.5h-.75a.75.75 0 0 1-.75-.75ZM10.5 12a.75.75 0 0 0 0 1.5h.75a.75.75 0 0 0 0-1.5h-.75ZM16.5 6.75v15h5.25a.75.75 0 0 0 0-1.5H21v-12a.75.75 0 0 0 0-1.5h-4.5Zm1.5 4.5a.75.75 0 0 1 .75-.75h.008a.75.75 0 0 1 .75.75v.008a.75.75 0 0 1-.75.75h-.008a.75.75 0 0 1-.75-.75v-.008Zm.75 2.25a.75.75 0 0 0-.75.75v.008c0 .414.336.75.75.75h.008a.75.75 0 0 0 .75-.75v-.008a.75.75 0 0 0-.75-.75h-.008ZM18 17.25a.75.75 0 0 1 .75-.75h.008a.75.75 0 0 1 .75.75v.008a.75.75 0 0 1-.75.75h-.008a.75.75 0 0 1-.75-.75v-.008Z" clip-rule="evenodd"/></svg>'}} />Kundenportale → <strong>2</strong> Kunden</div>
              <div><span style={{display:'inline-flex',verticalAlign:'-3px',marginRight:5,fontSize:15}} dangerouslySetInnerHTML={{__html:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="1em" height="1em" style="display:block"><path d="M12.75 12.75a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0ZM7.5 15.75a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5ZM8.25 17.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0ZM9.75 15.75a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5ZM10.5 17.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0ZM12 15.75a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5ZM12.75 17.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0ZM14.25 15.75a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5ZM15 17.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0ZM16.5 15.75a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5ZM15 12.75a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0ZM16.5 13.5a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Z"/> <path fill-rule="evenodd" d="M6.75 2.25A.75.75 0 0 1 7.5 3v1.5h9V3A.75.75 0 0 1 18 3v1.5h.75a3 3 0 0 1 3 3v11.25a3 3 0 0 1-3 3H5.25a3 3 0 0 1-3-3V7.5a3 3 0 0 1 3-3H6V3a.75.75 0 0 1 .75-.75Zm13.5 9a1.5 1.5 0 0 0-1.5-1.5H5.25a1.5 1.5 0 0 0-1.5 1.5v7.5a1.5 1.5 0 0 0 1.5 1.5h13.5a1.5 1.5 0 0 0 1.5-1.5v-7.5Z" clip-rule="evenodd"/></svg>'}} />Letzte Aktualisierung → <strong>Heute</strong></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [team, setTeam] = useState(()=>{
    try{return JSON.parse(sessionStorage.getItem('jsr_team')||'null');}
    catch{return null;}
  });

  useEffect(()=>{
    if(team) sessionStorage.setItem('jsr_team',JSON.stringify(team));
    else sessionStorage.removeItem('jsr_team');
  },[team]);

  if(!team) return <LoginPage onLogin={setTeam}/>;
  return <Dashboard team={team} onLogout={()=>setTeam(null)}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
