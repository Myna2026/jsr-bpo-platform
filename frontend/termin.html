<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/assets/tive360-mark.svg">
<title>TIVE 360°: Termin wählen</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{ --ink:#14201f; --muted:#6b7a78; --line:#e7eae9; --teal:#0F5661; --teal-d:#0B454E; --bg:#F4F6F5; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
h1,h2{font-family:'Inter',system-ui,sans-serif;font-weight:800;letter-spacing:-.02em}
.top{display:flex;align-items:center;gap:11px;justify-content:center;padding:26px 20px 4px}
.mark{width:30px;height:30px;background:linear-gradient(135deg,var(--teal),var(--teal-d));border-radius:8px;display:flex;align-items:center;justify-content:center}
.mark img{width:19px;height:19px;filter:brightness(0) invert(1)}
.brand{font-size:13px;font-weight:700;color:var(--ink)}
.brand span{display:block;font-size:9.5px;font-weight:600;color:var(--muted);letter-spacing:.09em}
.wrap{max-width:600px;margin:0 auto;padding:18px 18px 130px}
.hero-card{text-align:center;padding:28px 22px 24px}
.eyebrow{font-size:11px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.1em}
.hero{font-size:29px;font-weight:800;letter-spacing:-.02em;color:var(--ink);line-height:1.15;margin-top:10px}
.lede{color:var(--muted);font-size:14.5px;margin-top:12px;max-width:420px;margin-left:auto;margin-right:auto}
.sec{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 20px;margin-top:16px;box-shadow:0 1px 2px rgba(20,32,31,.04)}
.step{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.step-n{width:24px;height:24px;border-radius:50%;background:var(--teal);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step-t{font-size:15px;font-weight:600;color:var(--ink)}
.forms{display:flex;flex-direction:column;gap:11px}
.form-opt{display:flex;align-items:center;gap:15px;width:100%;border:2px solid var(--line);border-radius:15px;padding:16px 18px;cursor:pointer;background:#fff;transition:.15s;text-align:left}
.form-opt:hover{border-color:#c7d2d0}
.form-opt.sel{border-color:var(--teal);background:#E6EEED}
.form-opt .ic{font-size:26px;flex-shrink:0;width:30px;text-align:center}
.form-opt .txt{display:flex;flex-direction:column;min-width:0}
.form-opt .lbl{font-size:16px;font-weight:700;color:var(--ink)}
.form-opt.sel .lbl{color:var(--teal)}
.form-opt .desc{font-size:13px;color:var(--muted);margin-top:1px}
.days{display:flex;flex-direction:column;gap:8px}
.day{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--line);border-radius:13px;padding:13px 16px;cursor:pointer;transition:.15s;background:#fff}
.day:hover{border-color:#c7d2d0}
.day.sel{border-color:var(--teal);background:#E6EEED}
.day-l{font-size:15px;font-weight:600;color:var(--ink)}
.day-l .dow{color:var(--muted);font-weight:500;margin-right:7px}
.day-c{font-size:12.5px;color:var(--muted)}
.day.sel .day-c{color:var(--teal);font-weight:600}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:9px;margin-top:4px}
.time{border:1.5px solid var(--line);border-radius:11px;padding:11px 0;text-align:center;font-size:14.5px;font-weight:600;color:#3a4a48;background:#fff;cursor:pointer;transition:.12s}
.time:hover{border-color:var(--teal)}
.time.sel{border-color:var(--teal);background:var(--teal);color:#fff}
.hint{color:var(--muted);font-size:13.5px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom));z-index:20}
.bar-in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:14px}
.bar-sum{flex:1;min-width:0;font-size:13px;color:var(--muted)}
.bar-sum b{color:var(--ink);font-weight:600}
.cta{border:none;border-radius:13px;padding:14px 22px;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(180deg,#12b3b3,var(--teal));cursor:pointer;box-shadow:0 4px 14px rgba(15,86,97,.26);white-space:nowrap}
.cta:disabled{opacity:.45;cursor:default;box-shadow:none}
.err{background:#fef3f2;border:1px solid #f4c7c3;color:#b42318;border-radius:11px;padding:11px 13px;font-size:13.5px;margin-top:14px}
.center{text-align:center}
.big{font-size:46px;line-height:1;margin-bottom:14px}
.foot{text-align:center;padding:26px 0 12px;color:#9aa6a4;font-size:11.5px}
</style>
</head>
<body>
<div class="top">
  <div class="mark"><img src="assets/tive360-mark.svg" alt="TIVE 360°"/></div>
  <div class="brand">TIVE 360°<span>TERMINVEREINBARUNG</span></div>
</div>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React;
const SB_URL='https://msdiyjxckmpvuomnhvjp.supabase.co';
const SB_KEY='sb_publishable_exKYOG6Znhj_JlO0v6erQQ_q0HWWiyl';
const sb=window.supabase.createClient(SB_URL,SB_KEY);

const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const WDL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MO=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const FORMS={phone:{ic:'📞',l:'Telefon',d:'Wir rufen dich zum Termin an.'},teams:{ic:'💻',l:'Video (Teams)',d:'Per Videoanruf, den Link bekommst du vorab.'},office:{ic:'🏢',l:'Im Büro',d:'Persönlich bei uns vor Ort.'}};
function dParts(d){ const p=d.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function dayFull(d){ const dt=dParts(d),p=d.split('-').map(Number); return WDL[dt.getDay()]+', '+p[2]+'. '+MO[p[1]-1]; }
function dayShort(d){ const dt=dParts(d),p=d.split('-').map(Number); return {dow:WD[dt.getDay()], rest:p[2]+'. '+MO[p[1]-1]}; }

function Screen({emoji,title,text}){
  return <div className="wrap"><div className="sec center" style={{padding:'40px 24px'}}>
    <div className="big">{emoji}</div>
    <h1 className="hero" style={{fontSize:27}}>{title}</h1>
    <p className="hint" style={{marginTop:12,maxWidth:400,marginLeft:'auto',marginRight:'auto'}}>{text}</p>
  </div></div>;
}

function App(){
  const token=new URLSearchParams(location.search).get('t')||'';
  const [data,setData]=useState(null);
  const [form,setForm]=useState(null);
  const [day,setDay]=useState(null);
  const [slot,setSlot]=useState(null);
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState('');
  const [done,setDone]=useState(null);

  async function load(){ setErr('');
    try{ const {data:d,error}=await sb.rpc('get_interview_slots',{p_token:token});
      if(error){ setData({status:'error'}); return; }
      setData(d||{status:'error'});
      if(d&&d.forms&&d.forms.length===1) setForm(d.forms[0]);
      // Schnitt 2: Öffnungszeitpunkt festhalten (fire-and-forget), nur wenn noch nicht gebucht.
      if(d&&d.status!=='booked'){ try{ sb.rpc('mark_interview_opened',{p_token:token}); }catch(e){} }
    }catch(e){ setData({status:'error'}); }
  }
  useEffect(()=>{ if(!token){ setData({status:'notfound'}); return; } load(); },[]);

  async function confirm(){ if(!form||!slot||busy) return; setBusy(true); setErr('');
    try{ const {data:r,error}=await sb.rpc('confirm_interview_slot',{p_token:token,p_slot:slot,p_form:form});
      if(error){ setErr('Es hat leider nicht geklappt. Bitte versuche es noch einmal.'); setBusy(false); return; }
      if(r&&r.status==='confirmed'){ setDone({slot:r.slot,form:r.form}); }
      else if(r&&r.status==='taken'){ setErr('Diese Zeit wurde gerade vergeben. Bitte wähle eine andere.'); setSlot(null); await load(); }
      else{ await load(); }
    }catch(e){ setErr('Die Verbindung wurde unterbrochen. Bitte versuche es noch einmal.'); }
    setBusy(false);
  }

  if(data===null) return <div className="wrap"><div className="sec center hint" style={{padding:'40px'}}>Einen Moment…</div></div>;
  if(done) return <Screen emoji="✅" title="Dein Termin steht"
    text={'Wir freuen uns auf das Gespräch am '+dayFull(done.slot.slice(0,10))+' um '+done.slot.slice(11,16)+' Uhr ('+(FORMS[done.form]?FORMS[done.form].l:done.form)+'). Falls du doch nicht kannst, melde dich bitte kurz bei uns.'}/>;

  const st=data.status;
  if(st==='booked') return <Screen emoji="📅" title="Dein Termin ist schon vereinbart"
    text={'Wir sehen uns am '+dayFull(data.booked_slot.slice(0,10))+' um '+data.booked_slot.slice(11,16)+' Uhr ('+(FORMS[data.booked_form]?FORMS[data.booked_form].l:data.booked_form)+').'}/>;
  if(st==='expired'||st==='notfound'||st==='error') return <Screen emoji="⌛" title="Dieser Link ist nicht mehr gültig"
    text="Bitte melde dich bei deiner Ansprechperson bei TIVE 360°, dann bekommst du einen neuen Link."/>;

  // offen
  const slots=data.slots||[];
  const byDay={}; slots.forEach(s=>{ const d=s.slice(0,10); (byDay[d]=byDay[d]||[]).push(s); });
  const days=Object.keys(byDay).sort();
  const name=(data.applicant_name||'').split(' ')[0]||'';
  const forms=data.forms||[];
  const times=day?byDay[day]||[]:[];

  return <div className="wrap">
    <div className="sec hero-card">
      <div className="eyebrow">Vorstellungsgespräch</div>
      <h1 className="hero">Willkommen{name?', '+name:''}</h1>
      <p className="lede">Wir würden dich gern kennenlernen. Such dir einen Termin aus, der dir passt, das Gespräch dauert etwa 30 Minuten.</p>
    </div>

    {days.length===0 ? <div className="sec"><p className="hint">Aktuell sind keine freien Zeiten verfügbar. Bitte melde dich bei deiner Ansprechperson.</p></div> : <React.Fragment>

    <div className="sec">
      <div className="step"><div className="step-n">1</div><div className="step-t">An welchem Tag passt es dir?</div></div>
      <div className="days">
        {days.map(d=>{ const ds=dayShort(d); const n=byDay[d].length; return (
          <div key={d} className={"day"+(day===d?" sel":"")} onClick={()=>{ setDay(d); setSlot(null); }}>
            <div className="day-l"><span className="dow">{ds.dow}</span>{ds.rest}</div>
            <div className="day-c">{n} {n===1?'Zeit':'Zeiten'} frei</div>
          </div>); })}
      </div>
    </div>

    {day && <div className="sec">
      <div className="step"><div className="step-n">2</div><div className="step-t">Um welche Uhrzeit?</div></div>
      <div className="times">
        {times.map(s=><div key={s} className={"time"+(slot===s?" sel":"")} onClick={()=>setSlot(s)}>{s.slice(11,16)}</div>)}
      </div>
    </div>}

    {slot && forms.length>0 && <div className="sec">
      <div className="step"><div className="step-n">3</div><div className="step-t">Wie möchtest du das Gespräch führen?</div></div>
      <div className="forms">
        {forms.map(f=>{ const F=FORMS[f]||{ic:'•',l:f,d:''}; return <div key={f} className={"form-opt"+(form===f?" sel":"")} onClick={()=>setForm(f)}>
          <span className="ic">{F.ic}</span>
          <span className="txt"><span className="lbl">{F.l}</span>{F.d?<span className="desc">{F.d}</span>:null}</span>
        </div>; })}
      </div>
    </div>}

    {err && <div className="err">{err}</div>}
    </React.Fragment>}

    <div className="foot">TIVE 360° · Deine Angaben behandeln wir vertraulich.</div>

    {days.length>0 && <div className="bar"><div className="bar-in">
      <div className="bar-sum">{slot&&form
        ? <React.Fragment><b>{dayShort(slot.slice(0,10)).dow}, {slot.slice(11,16)} Uhr</b> · {FORMS[form]?FORMS[form].l:form}</React.Fragment>
        : 'Form, Tag und Uhrzeit wählen'}</div>
      <button className="cta" disabled={!form||!slot||busy} onClick={confirm}>{busy?'Moment…':'Termin bestätigen'}</button>
    </div></div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
