<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/assets/tive360-mark.svg">
<title>TIVE 360°: Termin wählen</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#F5F6F8;color:#111827;-webkit-font-smoothing:antialiased}
h1,h2{font-family:'Instrument Serif',serif;font-weight:400;letter-spacing:-0.01em}
.topbar{background:#fff;height:56px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid #E4E7EB;box-shadow:0 1px 3px rgba(15,86,97,.06)}
.jsr{width:34px;height:34px;background:linear-gradient(135deg,#0F5661,#0B454E);border-radius:9px;display:flex;align-items:center;justify-content:center}
.wrap{max-width:640px;margin:0 auto;padding:28px 18px 60px}
.card{background:#fff;border-radius:16px;padding:24px 22px;border:1px solid #e5e7eb;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:18px}
.eyebrow{font-size:11px;font-weight:700;color:#0F5661;text-transform:uppercase;letter-spacing:.08em}
.hero{font-size:30px;color:#111827;line-height:1.15;margin-top:6px}
.muted{color:#6b7280;font-size:13px}
.lbl{font-size:11px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.07em;margin-bottom:9px}
.forms{display:flex;gap:10px;flex-wrap:wrap}
.form-opt{flex:1 1 auto;min-width:130px;border:1.5px solid #e5e7eb;border-radius:12px;padding:13px 14px;cursor:pointer;text-align:center;font-weight:600;font-size:14px;color:#374151;background:#fff;transition:.15s}
.form-opt.sel{border-color:#0F5661;background:#E4EEF0;color:#0F5661}
.day{margin-top:16px}
.day-h{font-size:13px;font-weight:700;color:#374151;margin-bottom:8px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.slot{border:1.5px solid #e5e7eb;border-radius:10px;padding:9px 0;text-align:center;font-size:14px;font-weight:600;color:#374151;background:#fff;cursor:pointer;transition:.12s}
.slot:hover{border-color:#0F5661}
.slot.sel{border-color:#0F5661;background:#0F5661;color:#fff}
.cta{width:100%;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(180deg,#12b3b3,#0F5661);cursor:pointer;box-shadow:0 4px 14px rgba(15,86,97,.28)}
.cta:disabled{opacity:.4;cursor:default;box-shadow:none}
.note{font-size:12px;color:#6b7280;margin-top:12px;text-align:center}
.big{font-size:44px;line-height:1;margin-bottom:12px}
.center{text-align:center;padding:20px 0}
.err{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px}
.footer{text-align:center;padding:24px 0;color:#9ca3af;font-size:11px}
</style>
</head>
<body>
<div class="topbar">
  <div class="jsr"><img src="assets/tive360-mark.svg" alt="TIVE 360°" style="width:22px;height:22px;filter:brightness(0) invert(1)"/></div>
  <div><div style="color:#1F2937;font-size:14px;font-weight:700">TIVE 360°</div><div style="color:#6B7280;font-size:10px;letter-spacing:.04em">TERMINVEREINBARUNG</div></div>
</div>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React;
const SB_URL='https://msdiyjxckmpvuomnhvjp.supabase.co';
const SB_KEY='sb_publishable_exKYOG6Znhj_JlO0v6erQQ_q0HWWiyl';
const sb=window.supabase.createClient(SB_URL,SB_KEY);

const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const MO=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const FORM_LABEL={phone:'📞 Telefon',teams:'💻 Teams',office:'🏢 Im Büro'};
function fmtDay(d){ const p=d.split('-').map(Number); const dt=new Date(p[0],p[1]-1,p[2]); return WD[dt.getDay()]+', '+p[2]+'. '+MO[p[1]-1]; }

function App(){
  const token=new URLSearchParams(location.search).get('t')||'';
  const [data,setData]=useState(null);        // null=lädt
  const [form,setForm]=useState(null);
  const [slot,setSlot]=useState(null);
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState('');
  const [done,setDone]=useState(null);         // {slot,form}

  async function load(){ setErr('');
    try{ const {data:d,error}=await sb.rpc('get_interview_slots',{p_token:token});
      if(error){ setData({status:'error'}); return; } setData(d||{status:'error'});
      if(d&&d.forms&&d.forms.length===1) setForm(d.forms[0]);
    }catch(e){ setData({status:'error'}); }
  }
  useEffect(()=>{ if(!token){ setData({status:'notfound'}); return; } load(); },[]);

  async function confirm(){ if(!form||!slot||busy) return; setBusy(true); setErr('');
    try{ const {data:r,error}=await sb.rpc('confirm_interview_slot',{p_token:token,p_slot:slot,p_form:form});
      if(error){ setErr('Es ist etwas schiefgelaufen. Bitte erneut versuchen.'); setBusy(false); return; }
      if(r&&r.status==='confirmed'){ setDone({slot:r.slot,form:r.form}); }
      else if(r&&r.status==='taken'){ setErr('Dieser Termin wurde gerade vergeben. Bitte wähle einen anderen.'); setSlot(null); await load(); }
      else if(r&&(r.status==='expired'||r.status==='already_booked')){ await load(); }
      else{ setErr('Der Termin konnte nicht bestätigt werden. Bitte wähle einen anderen.'); await load(); }
    }catch(e){ setErr('Verbindung unterbrochen. Bitte erneut versuchen.'); }
    setBusy(false);
  }

  if(data===null) return <div className="wrap"><div className="card center muted">Lädt…</div></div>;

  if(done) return <div className="wrap"><div className="card center">
    <div className="big">✅</div>
    <h1 className="hero" style={{fontSize:26}}>Termin bestätigt</h1>
    <p className="muted" style={{marginTop:10}}>Wir sehen uns am <b style={{color:'#111827'}}>{fmtDay(done.slot.slice(0,10))}</b> um <b style={{color:'#111827'}}>{done.slot.slice(11,16)} Uhr</b>.</p>
    <p className="muted" style={{marginTop:4}}>Form: {FORM_LABEL[done.form]||done.form}</p>
    <p className="note">Du bekommst keine weitere Bestätigung, der Termin steht. Bei Verhinderung bitte kurz melden.</p>
  </div></div>;

  const st=data.status;
  if(st==='booked') return <div className="wrap"><div className="card center">
    <div className="big">📅</div>
    <h1 className="hero" style={{fontSize:24}}>Termin steht schon</h1>
    <p className="muted" style={{marginTop:10}}>Dein Termin: <b style={{color:'#111827'}}>{fmtDay(data.booked_slot.slice(0,10))}, {data.booked_slot.slice(11,16)} Uhr</b> ({FORM_LABEL[data.booked_form]||data.booked_form}).</p>
  </div></div>;

  if(st==='expired'||st==='notfound'||st==='error') return <div className="wrap"><div className="card center">
    <div className="big">⌛</div>
    <h1 className="hero" style={{fontSize:24}}>Link nicht mehr gültig</h1>
    <p className="muted" style={{marginTop:10}}>Dieser Termin-Link ist abgelaufen oder ungültig. Bitte melde dich bei deiner Ansprechperson für einen neuen Link.</p>
  </div></div>;

  // st==='open'
  const slots=data.slots||[];
  const byDay={}; slots.forEach(s=>{ const d=s.slice(0,10); (byDay[d]=byDay[d]||[]).push(s); });
  const days=Object.keys(byDay).sort();
  const name=(data.applicant_name||'').split(' ')[0]||'';

  return <div className="wrap">
    <div className="card">
      <div className="eyebrow">Vorstellungsgespräch</div>
      <h1 className="hero">Hallo{name?' '+name:''}, wähle deinen Termin</h1>
      <p className="muted" style={{marginTop:8}}>Such dir einen freien 30-Minuten-Block in den nächsten Tagen aus.</p>
    </div>

    {data.forms&&data.forms.length>0&&<div className="card">
      <div className="lbl">Wie soll das Gespräch stattfinden?</div>
      <div className="forms">
        {data.forms.map(f=><div key={f} className={"form-opt"+(form===f?" sel":"")} onClick={()=>setForm(f)}>{FORM_LABEL[f]||f}</div>)}
      </div>
    </div>}

    <div className="card">
      <div className="lbl">Freie Zeiten</div>
      {days.length===0 && <p className="muted">Gerade sind keine freien Zeiten verfügbar. Bitte melde dich bei deiner Ansprechperson.</p>}
      {days.map(d=><div key={d} className="day">
        <div className="day-h">{fmtDay(d)}</div>
        <div className="slots">
          {byDay[d].map(s=><div key={s} className={"slot"+(slot===s?" sel":"")} onClick={()=>setSlot(s)}>{s.slice(11,16)}</div>)}
        </div>
      </div>)}
      {err&&<div className="err">{err}</div>}
      <button className="cta" style={{marginTop:18}} disabled={!form||!slot||busy} onClick={confirm}>
        {busy?'Wird bestätigt…':slot&&form?('Termin am '+fmtDay(slot.slice(0,10))+', '+slot.slice(11,16)+' Uhr bestätigen'):'Form und Zeit wählen'}
      </button>
      <div className="note">Der Link ist begrenzt gültig. Nach der Bestätigung ist dein Termin fix.</div>
    </div>
    <div className="footer">TIVE 360° · Vertraulich</div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
