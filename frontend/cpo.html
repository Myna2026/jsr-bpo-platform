<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Vorgänge erfassen · TIVE 360°</title>
<style>
  :root{ --acc:#0f766e; --acc-d:#115e59; --ink:#0f172a; --muted:#64748b; --dim:#94a3b8; --line:#e2e8f0; --bg:#f1f5f9; --card:#fff;
         --green:#15803d; --green-bg:#f0fdf4; --amber:#b45309; --amber-bg:#fffbeb; --red:#b91c1c; --red-bg:#fef2f2; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
  .wrap{max-width:620px;margin:0 auto;padding:12px 12px 40px}
  .top{display:flex;align-items:center;gap:9px;margin:4px 0 10px}
  .logo{width:32px;height:32px;border-radius:9px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
  .brand{font-weight:800;font-size:14px;line-height:1.2} .brand small{display:block;font-weight:600;color:var(--muted);font-size:11px}
  h1{font-size:21px;margin:0 0 4px} .sub{color:var(--muted);font-size:13px;margin:0 0 14px;line-height:1.5}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  label.f{display:block;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 5px}
  input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:11px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:12px;padding:13px 18px;font-size:15px;font-weight:800;cursor:pointer;background:var(--acc);color:#fff;font-family:inherit}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
  .btn.sm{padding:8px 12px;font-size:13px;border-radius:9px}
  .btn.full{width:100%}
  .err{color:var(--red);font-size:13px;font-weight:600;margin-top:8px;min-height:18px}
  .ok{background:var(--green-bg);border:1px solid #bbf7d0;color:var(--green);border-radius:11px;padding:9px 12px;font-size:13.5px;font-weight:700}

  /* ── Schrittfolge: eine Frage je Bildschirm, Antippen springt weiter ── */
  .shead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .shead .st{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .shead .bk{margin-left:auto;background:none;border:none;color:var(--muted);font:700 12.5px inherit;cursor:pointer;padding:4px}
  .q{font-size:19px;font-weight:800;margin:0 0 11px}
  .opts{display:flex;flex-direction:column;gap:6px}
  .opt{width:100%;display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:#fff;border-radius:12px;
       padding:12px 14px;font:700 15.5px inherit;color:var(--ink);text-align:left;cursor:pointer}
  .opt.on{border-color:var(--acc);background:#ecfeff;color:var(--acc-d)}
  .opt .ch{margin-left:auto;color:var(--acc);font-weight:800}
  .opt2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .crumb{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
  .cb{font-size:11px;font-weight:700;background:#f1f5f9;color:#475569;border-radius:999px;padding:3px 9px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cb b{font-weight:800;color:var(--ink)}
  .daterow{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:9px;flex-wrap:wrap}
  .daterow b{color:var(--ink);font-size:13.5px}
  .daterow button{background:none;border:none;color:var(--acc);font:800 12.5px inherit;cursor:pointer;padding:2px}

  /* ── Übertragen ── */
  .tsv{width:100%;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.5;color:#0f172a;
       background:#f8fafc;border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;white-space:pre;overflow-x:auto;resize:none;display:block}
  .tr{width:100%;margin-top:8px;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
  .tr-h{display:flex;align-items:center;gap:8px;padding:8px 11px;background:#f8fafc;border-bottom:1.5px solid var(--line)}
  .tr-h b{font-size:12.5px} .tr-h .p{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--muted)}
  .cell{display:flex;align-items:center;gap:10px;width:100%;border:none;border-top:1px solid var(--line);background:#fff;
        padding:12px 11px;font:15px inherit;text-align:left;cursor:pointer;color:var(--ink)}
  .cell:first-of-type{border-top:none}
  .cell .k{flex:0 0 74px;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .cell .v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
  .cell .s{flex:0 0 auto;font-size:13px;font-weight:800;color:var(--dim)}
  .cell.next{background:#ecfeff;box-shadow:inset 3px 0 0 var(--acc)} .cell.next .s{color:var(--acc)}
  .cell.done{background:var(--green-bg)} .cell.done .v{color:var(--green)} .cell.done .s{color:var(--green)}
  .tr-f{padding:8px 11px;font-size:11.5px;color:var(--muted);line-height:1.5;border-top:1px solid var(--line);background:#f8fafc}
  .tr-f button{background:none;border:none;color:var(--acc);font:800 11.5px inherit;cursor:pointer;padding:0}

  .e{border-top:1px solid var(--line);padding:9px 0;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
  .e:first-child{border-top:none}
  .e .cs{font-weight:800;font-size:14.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .e .mt{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5}
  .tag{display:inline-block;font-size:10.5px;font-weight:800;border-radius:7px;padding:1px 7px;background:#eef2f7;color:#475569}
  .tag.cl{background:var(--green-bg);color:var(--green)} .tag.st{background:var(--red-bg);color:var(--red)}
  .grow{flex:1 1 200px;min-width:0}
  .hd{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:8px}
  .hd h2{font-size:15px;margin:0}
  .sheet{font-weight:800;color:var(--acc)}
  .foot{color:var(--dim);font-size:11.5px;text-align:center;margin-top:14px;line-height:1.6}
  details>summary{cursor:pointer;font-size:13px;font-weight:800;color:var(--muted);padding:6px 0;list-style:none}
  details>summary::-webkit-details-marker{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="logo">T</div><div class="brand">TIVE 360°<small id="bSub">Vorgänge erfassen</small></div></div>

  <!-- PIN -->
  <div id="sPin">
    <h1 id="pTitle">Vorgänge erfassen</h1>
    <p class="sub" id="pSub">Bitte deine persönliche PIN eingeben. Du siehst danach nur deine eigenen Einträge.</p>
    <div class="card">
      <div style="margin-bottom:12px"><label class="f" for="pin">Deine PIN</label>
        <input id="pin" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="····"></div>
      <button class="btn full" id="pinGo">Weiter</button>
      <div class="err" id="pinErr"></div>
    </div>
  </div>

  <!-- Erfassung -->
  <div id="sMain" hidden>
    <div class="daterow">
      <span>Tag</span><b id="dLabel"></b>
      <button type="button" id="dChange">ändern</button>
      <input type="date" id="fDate" style="display:none;width:auto;flex:1 1 150px">
      <span style="margin-left:auto;font-size:12px">Blatt <span class="sheet" id="sheetName"></span></span>
    </div>

    <div class="card" id="stepCard">
      <div class="shead"><span class="st" id="stNo"></span><button type="button" class="bk" id="stBack" hidden>← zurück</button></div>
      <div class="crumb" id="crumb"></div>
      <div id="stepBox"></div>
      <div class="err" id="addErr"></div>
    </div>

    <details id="listWrap">
      <summary><span id="listCount"></span></summary>
      <div class="card" style="margin-top:6px">
        <div class="hd"><h2>Heute erfasst</h2>
          <span style="margin-left:auto"><button class="btn ghost sm" id="copyAll">Ganzen Tag kopieren</button></span></div>
        <div id="dayBox" hidden><textarea class="tsv" id="dayTsv" readonly spellcheck="false" rows="2"></textarea></div>
        <div id="list"></div>
      </div>
    </details>

    <div class="foot">Deine Einträge, sonst nichts. Ein Vorgang lässt sich stornieren, er bleibt dann als storniert sichtbar.<br>
      <a href="#" id="logout" style="color:var(--muted)">Abmelden</a></div>
  </div>
</div>

<script>
var SB_URL='https://msdiyjxckmpvuomnhvjp.supabase.co', SB_KEY='sb_publishable_exKYOG6Znhj_JlO0v6erQQ_q0HWWiyl';
var FN=SB_URL+'/functions/v1/cpo-track';
var TOKEN=(function(){ try{ return new URLSearchParams(location.search).get('t')||''; }catch(e){ return ''; } })();
var SES=null, ME='', OPT={status:[],action:[],close_action:'Angebot angenommen'}, TAR=[], ENTRIES=[];
var F={}, STEP=0, SAVED=null, STEPS=[], CELLSTEP={}, PICKS=[];
var OUT_TXT={upgrade:'Upgrade',downgrade:'Downgrade, aber gehalten',gleich:'Gleiche Tarifklasse'};
function $(id){ return document.getElementById(id); }
function show(id){ ['sPin','sMain'].forEach(function(s){ $(s).hidden = (s!==id); }); }
function err(id,msg){ $(id).textContent=msg||''; }
function api(body){ return fetch(FN,{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},body:JSON.stringify(body)})
  .then(function(r){ return r.json().then(function(j){ if(!r.ok||j.error){ var e=new Error(j.error||('Fehler '+r.status)); e.expired=!!j.expired; throw e; } return j; }); }); }
function today(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function de(ds){ var p=String(ds||'').slice(0,10).split('-'); return p.length===3?(p[2]+'.'+p[1]+'.'+p[0]):ds; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

// ── Start ────────────────────────────────────────────────────────────────────
if(!TOKEN){ $('pTitle').textContent='Kein gültiger Link'; $('pSub').textContent='Dieser Link ist unvollständig. Bitte den Link aus der Nachricht öffnen.'; $('pin').disabled=true; $('pinGo').disabled=true; }
else {
  api({action:'get',token:TOKEN}).then(function(r){
    OPT=r.options||OPT; TAR=r.tariffs||[]; $('bSub').textContent=r.label||r.project||'Vorgänge erfassen';
    try{ var s=sessionStorage.getItem('cpo_ses_'+TOKEN); if(s){ SES=s; loadList(true); } }catch(e){}
  }).catch(function(e){ $('pTitle').textContent='Dieser Link funktioniert nicht'; $('pSub').textContent=e.message; $('pin').disabled=true; $('pinGo').disabled=true; });
}
$('pinGo').addEventListener('click',login);
$('pin').addEventListener('keydown',function(e){ if(e.key==='Enter') login(); });
function login(){
  var pin=$('pin').value.trim(); if(!pin){ err('pinErr','Bitte deine PIN eingeben.'); return; }
  err('pinErr',''); $('pinGo').disabled=true;
  api({action:'login',token:TOKEN,pin:pin}).then(function(r){
    SES=r.session; ME=r.name||''; OPT=r.options||OPT; TAR=r.tariffs||TAR;
    try{ sessionStorage.setItem('cpo_ses_'+TOKEN,SES); }catch(e){}
    $('pin').value=''; loadList(true);
  }).catch(function(e){ err('pinErr',e.message); }).finally(function(){ $('pinGo').disabled=false; });
}
$('logout').addEventListener('click',function(e){ e.preventDefault(); try{ sessionStorage.removeItem('cpo_ses_'+TOKEN); }catch(x){} SES=null; show('sPin'); });

// Datum bleibt über alle Vorgänge stehen, Skill ist immer Retention und wird nie gefragt.
function setDate(ds){ F.work_date=ds; $('dLabel').textContent=de(ds); $('fDate').value=ds; render(); render2(); }
$('dChange').addEventListener('click',function(){ var i=$('fDate'); i.style.display=(i.style.display==='none'?'block':'none'); if(i.style.display!=='none') i.focus(); });
$('fDate').addEventListener('change',function(){ if($('fDate').value){ setDate($('fDate').value); $('fDate').style.display='none'; } });

// ── Schrittfolge ─────────────────────────────────────────────────────────────
// Eine Frage je Bildschirm, Auswahl springt sofort weiter. „Abgeschlossen" wird NICHT gefragt: es ist genau dann
// ja, wenn die Maßnahme „Angebot angenommen" ist. Alles andere ist Dokumentation.
function isClose(){ return F.action===OPT.close_action; }
function buildSteps(){
  STEPS=['case','status','action'];
  if(isClose()) STEPS=STEPS.concat(['tfrom','tto','level']);
  STEPS.push('check');
}
function crumbs(){
  var c=[];
  if(F.case_no) c.push(['Case',F.case_no]);
  if(F.status) c.push(['Status',F.status]);
  if(F.action) c.push(['Was',F.action]);
  if(F.tariff_from) c.push(['Von',F.tariff_from]);
  if(F.tariff_to) c.push(['Auf',F.tariff_to]);
  if(F.discount_level) c.push(['Stufe',String(F.discount_level)]);
  $('crumb').innerHTML=c.map(function(x){ return '<span class="cb">'+esc(x[0])+' <b>'+esc(x[1])+'</b></span>'; }).join('');
}
function optList(items, cur, two){
  return '<div class="'+(two?'opt2':'opts')+'">'+items.map(function(it,i){
    var v=(typeof it==='object')?it.v:it, l=(typeof it==='object')?it.l:it;
    return '<button type="button" class="opt'+(cur===v?' on':'')+'" data-pick="'+i+'">'+esc(l)+(cur===v?'<span class="ch">✓</span>':'')+'</button>';
  }).join('')+'</div>';
}
function bindPicks(fn){
  Array.prototype.forEach.call($('stepBox').querySelectorAll('[data-pick]'),function(b){
    b.addEventListener('click',function(){ var it=PICKS[Number(b.getAttribute('data-pick'))]; fn((typeof it==='object')?it.v:it); });
  });
}
function render(){
  if(SAVED){ renderSaved(); return; }
  buildSteps(); if(STEP>=STEPS.length) STEP=STEPS.length-1;
  var k=STEPS[STEP]; crumbs();
  $('stNo').textContent='Schritt '+(STEP+1)+' von '+STEPS.length;
  $('stBack').hidden=(STEP===0);
  var box=$('stepBox'); PICKS=[];
  if(k==='case'){
    box.innerHTML='<div class="q">Casenummer</div>'
      + '<input id="iCase" autocapitalize="characters" autocomplete="off" placeholder="CS5006433" value="'+esc(F.case_no||'')+'">'
      + '<div style="font-size:12px;color:var(--muted);margin-top:6px">CS oder IMS, dann die Ziffern.</div>'
      + '<button class="btn full" id="bNext" style="margin-top:12px">Weiter</button>';
    var inp=$('iCase'); setTimeout(function(){ try{ inp.focus(); }catch(e){} },40);
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter') caseNext(); });
    $('bNext').addEventListener('click',caseNext);
    return;
  }
  if(k==='status'){ PICKS=OPT.status; box.innerHTML='<div class="q">Status</div>'+optList(PICKS,F.status); bindPicks(function(v){ F.status=v; next(); }); return; }
  if(k==='action'){ PICKS=OPT.action; box.innerHTML='<div class="q">Was wurde gemacht?</div>'+optList(PICKS,F.action);
    bindPicks(function(v){ F.action=v; if(!isClose()){ F.tariff_from=null; F.tariff_to=null; F.discount_level=null; } next(); }); return; }
  if(k==='tfrom'){ PICKS=TAR.map(function(t){ return t.name; });
    box.innerHTML='<div class="q">Tarif vorher</div>'+optList(PICKS,F.tariff_from,true); bindPicks(function(v){ F.tariff_from=v; next(); }); return; }
  if(k==='tto'){ PICKS=TAR.map(function(t){ return t.name; });
    box.innerHTML='<div class="q">Tarif neu</div>'+optList(PICKS,F.tariff_to,true); bindPicks(function(v){ F.tariff_to=v; next(); }); return; }
  if(k==='level'){ PICKS=[{v:1,l:'Stufe 1'},{v:2,l:'Stufe 2'}];
    box.innerHTML='<div class="q">Rabattstufe</div>'+optList(PICKS,F.discount_level,true)
      + (outcomeNow()?'<div class="ok" style="margin-top:10px">'+esc(F.tariff_from+' → '+F.tariff_to)+': '+OUT_TXT[outcomeNow()]+'</div>':'');
    bindPicks(function(v){ F.discount_level=v; next(); }); return; }
  var o=outcomeNow();
  box.innerHTML='<div class="q">Passt das?</div>'
    + '<textarea class="tsv" readonly spellcheck="false" rows="1">'+esc(sheetLineOf(F))+'</textarea>'
    + (isClose()?'<div class="ok" style="margin-top:8px">'+esc(F.tariff_from+' → '+F.tariff_to)+' · '+(o?OUT_TXT[o]:'')+' · Stufe '+F.discount_level+'</div>':'')
    + '<div style="margin-top:10px"><label class="f" for="iNote">Notiz (optional, bleibt bei uns)</label>'
    + '<input id="iNote" autocomplete="off" value="'+esc(F.note||'')+'"></div>'
    + '<button class="btn full" id="bSave" style="margin-top:12px">Speichern</button>';
  $('bSave').addEventListener('click',save);
}
function caseNext(){
  var v=($('iCase').value||'').trim().toUpperCase();
  if(!/^(CS|IMS)[0-9]{4,12}$/.test(v)){ err('addErr','Die Casenummer muss mit CS oder IMS beginnen, dann Ziffern (z. B. CS5006433).'); return; }
  err('addErr',''); F.case_no=v; next();
}
function next(){ err('addErr',''); buildSteps(); STEP=Math.min(STEP+1, STEPS.length-1); render(); }
$('stBack').addEventListener('click',function(){ err('addErr',''); if(STEP>0){ STEP--; render(); } });
function rankOf(nm){ for(var i=0;i<TAR.length;i++){ if(TAR[i].name===nm) return TAR[i].rank; } return null; }
function outcomeNow(){ var a=rankOf(F.tariff_from), b=rankOf(F.tariff_to); if(a==null||b==null) return null; return b>a?'upgrade':(b<a?'downgrade':'gleich'); }

// ── Speichern, danach sofort der nächste Vorgang ────────────────────────────
function save(){
  var n=$('iNote'); if(n) F.note=n.value.trim();
  var e={ work_date:F.work_date, case_no:F.case_no, status:F.status, closed:isClose(), action:F.action, note:F.note||'' };
  if(isClose()){ e.tariff_from=F.tariff_from; e.tariff_to=F.tariff_to; e.discount_level=F.discount_level; }
  $('bSave').disabled=true;
  api({action:'add',session:SES,entry:e}).then(function(r){
    SAVED=r.entry; CELLSTEP[SAVED.id]=0; loadList(false);
  }).catch(function(x){ if(x.expired){ show('sPin'); err('pinErr',x.message); } else { err('addErr',x.message); $('bSave').disabled=false; } });
}
function renderSaved(){
  $('stNo').textContent='Gespeichert'; $('stBack').hidden=true; $('crumb').innerHTML='';
  $('stepBox').innerHTML='<div class="q">'+esc(SAVED.case_no)+' ist gespeichert</div>'
    + '<textarea class="tsv" readonly spellcheck="false" rows="1" id="savedTsv">'+esc(sheetRow(SAVED))+'</textarea>'
    + transferBlock(SAVED)
    + '<button class="btn full" id="bNextCase" style="margin-top:12px">Nächster Vorgang</button>';
  var t=$('savedTsv'); t.addEventListener('focus',function(){ t.select(); }); t.addEventListener('click',function(){ t.select(); });
  bindCells($('stepBox'));
  $('bNextCase').addEventListener('click',function(){ var d=F.work_date; F={work_date:d}; SAVED=null; STEP=0; render(); });
}

// ── Übertragen Feld für Feld (der sichere Weg auf dem Telefon) ──────────────
var SHEET_COL=['A Datum','B Case','C Skill','D Status','E abgeschl.','F was'];
function sheetCells(e){ return [ de(e.work_date), e.case_no, 'Retention', e.status, (e.closed?'ja':'nein'), e.action ]; }
function sheetRow(e){ return sheetCells(e).join('\t'); }
function sheetLineOf(f){ return [ de(f.work_date), f.case_no||'—', 'Retention', f.status||'—', (isClose()?'ja':'nein'), f.action||'—' ].join('\t'); }
function transferBlock(e){
  var cells=sheetCells(e), at=CELLSTEP[e.id]||0;
  var html='<div class="tr"><div class="tr-h"><b>Feld für Feld übertragen</b><span class="p">'+Math.min(at,6)+' von 6</span></div>';
  cells.forEach(function(c,i){
    var cls='cell'+(i<at?' done':(i===at?' next':''));
    html+='<button type="button" class="'+cls+'" data-cell="'+e.id+'|'+i+'">'
      + '<span class="k">'+SHEET_COL[i]+'</span><span class="v">'+esc(c)+'</span>'
      + '<span class="s">'+(i<at?'kopiert ✓':(i===at?'antippen':''))+'</span></button>';
  });
  html+='<div class="tr-f">Antippen kopiert das Feld. In der Tabelle einfügen, eine Zelle nach rechts, zurück hierher, nächstes Feld.'
    + (at>0?' · <button type="button" data-reset="'+e.id+'">von vorn</button>':'')+'</div></div>';
  return html;
}
function bindCells(root){
  Array.prototype.forEach.call(root.querySelectorAll('[data-cell]'),function(c){ c.addEventListener('click',function(){
    var pr=c.getAttribute('data-cell').split('|'); var e=(SAVED&&SAVED.id===pr[0])?SAVED:byId(pr[0]); var i=Number(pr[1]); if(!e) return;
    copyPlain(sheetCells(e)[i], function(){});
    CELLSTEP[e.id]=Math.max(CELLSTEP[e.id]||0, i+1);
    if(SAVED&&SAVED.id===e.id) renderSaved(); else render2();
  }); });
  Array.prototype.forEach.call(root.querySelectorAll('[data-reset]'),function(b){ b.addEventListener('click',function(){
    var id=b.getAttribute('data-reset'); CELLSTEP[id]=0; if(SAVED&&SAVED.id===id) renderSaved(); else render2(); }); });
}
function sheetHtml(rows){ return '<table><tbody>'+rows.map(function(e){
  return '<tr>'+sheetCells(e).map(function(c){ return '<td>'+esc(c)+'</td>'; }).join('')+'</tr>'; }).join('')+'</tbody></table>'; }
function copyRows(list,btn){
  var rows=(list||[]).filter(Boolean).filter(function(e){ return !e.cancelled_at; });
  if(!rows.length) return;
  var text=rows.map(sheetRow).join('\n'), html=sheetHtml(rows);
  var done=function(){ if(!btn) return; var t=btn.textContent; btn.textContent='kopiert ✓'; setTimeout(function(){ btn.textContent=t; },1600); };
  try{
    if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
      var item=new ClipboardItem({ 'text/plain': new Blob([text],{type:'text/plain'}), 'text/html': new Blob([html],{type:'text/html'}) });
      navigator.clipboard.write([item]).then(done, function(){ copyPlain(text,done); }); return;
    }
  }catch(e){}
  copyPlain(text,done);
}
function copyPlain(text,done){
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done,function(){ fallback(text,done); }); }
  else fallback(text,done);
}
function fallback(text,done){
  var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ alert(text); } ta.remove();
}

// ── Liste des Tages, eingeklappt, damit die Maske oben bleibt ───────────────
function loadList(first){
  api({action:'list',session:SES}).then(function(r){
    ME=r.name||ME; ENTRIES=r.entries||[];
    $('sheetName').textContent=ME||'—';
    if(!F.work_date) F.work_date=today();
    $('dLabel').textContent=de(F.work_date); $('fDate').value=F.work_date;
    show('sMain'); render(); render2();
  }).catch(function(x){ if(x.expired||first){ show('sPin'); if(x.expired) err('pinErr',x.message); } });
}
function byId(id){ return ENTRIES.filter(function(e){ return e.id===id; })[0]; }
function render2(){
  var d=F.work_date||today();
  var day=ENTRIES.filter(function(e){ return e.work_date===d; });
  var open=day.filter(function(e){ return !e.cancelled_at; });
  $('listCount').textContent = day.length ? ('Heute erfasst: '+day.length+' ▾') : 'Heute noch nichts erfasst';
  $('copyAll').disabled=!open.length;
  $('dayBox').hidden=!open.length;
  if(open.length){ var ta=$('dayTsv'); ta.value=open.map(sheetRow).join('\n'); ta.rows=Math.min(8,Math.max(2,open.length)); }
  $('list').innerHTML = day.length ? day.map(function(e){
    var st=e.cancelled_at;
    return '<div class="e"'+(st?' style="opacity:.55"':'')+'>'
      + '<div class="grow"><div class="cs">'+esc(e.case_no)+' '
      + (e.is_close?'<span class="tag cl">Abschluss</span> ':'')+(st?'<span class="tag st">storniert</span>':'')+'</div>'
      + '<div class="mt">'+esc(e.status)+' · '+esc(e.action)
      + (e.tariff_from?(' · '+esc(e.tariff_from)+' → '+esc(e.tariff_to)):'')+(e.note?(' · '+esc(e.note)):'')+'</div></div>'
      + '<div style="display:flex;gap:6px">'
      + (st?'':'<button class="btn ghost sm" data-copy="'+e.id+'">Kopieren</button>')
      + (st?'':'<button class="btn ghost sm" data-cancel="'+e.id+'" style="color:var(--red)">Storno</button>')
      + '</div>'
      + (st?'':transferBlock(e))
      + '</div>';
  }).join('') : '';
  bindCells($('list'));
  Array.prototype.forEach.call($('list').querySelectorAll('[data-copy]'),function(b){ b.addEventListener('click',function(){ copyRows([byId(b.getAttribute('data-copy'))],b); }); });
  Array.prototype.forEach.call($('list').querySelectorAll('[data-cancel]'),function(b){ b.addEventListener('click',function(){ cancel(b.getAttribute('data-cancel')); }); });
}
$('dayTsv').addEventListener('focus',function(){ $('dayTsv').select(); });
$('dayTsv').addEventListener('click',function(){ $('dayTsv').select(); });
$('copyAll').addEventListener('click',function(){
  var d=F.work_date||today();
  copyRows(ENTRIES.filter(function(e){ return e.work_date===d; }), $('copyAll'));
});
function cancel(id){
  var e=byId(id); if(!e) return;
  var reason=prompt('Warum wird '+e.case_no+' storniert? (z. B. Vertrag gekündigt)','');
  if(reason===null) return;
  api({action:'cancel',session:SES,id:id,reason:reason}).then(function(){ loadList(false); })
    .catch(function(x){ if(x.expired){ show('sPin'); err('pinErr',x.message); } else alert(x.message); });
}
</script>
