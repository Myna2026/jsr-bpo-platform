<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Bewerber-Erfassung vor Ort · TIVE 360°</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root{ --teal:#0d9488; --teal-d:#0f766e; --ink:#0f172a; --muted:#64748b; --line:#dbe3ea; --bg:#eef2f6; --card:#fff; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;font-size:18px}
  .wrap{max-width:820px;margin:0 auto;padding:22px 20px 80px}
  .top{display:flex;align-items:center;gap:12px;margin:8px 0 20px}
  .logo{width:42px;height:42px;border-radius:11px;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px}
  .brand{font-weight:800;font-size:18px}
  h1{font-size:30px;margin:0 0 6px;line-height:1.15}
  .sub{color:var(--muted);font-size:17px;margin:0 0 22px;line-height:1.5}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .card h2{font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:var(--teal-d);margin:0 0 16px;font-weight:800}
  label.f{display:block;margin-bottom:16px}
  label.f span{display:block;font-size:15px;font-weight:700;color:var(--muted);margin-bottom:7px}
  input,select,textarea{width:100%;padding:15px 16px;border:1.5px solid var(--line);border-radius:12px;font-size:19px;background:#fff;color:var(--ink);font-family:inherit}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(13,148,136,.14)}
  textarea{min-height:96px;resize:vertical}
  .row{display:flex;gap:14px}.row>*{flex:1;min-width:0}
  .row3{display:flex;gap:14px;flex-wrap:wrap}.row3>*{flex:1 1 180px;min-width:0}
  .chk{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:600;padding:9px 0}
  .chk input{width:26px;height:26px;flex:0 0 auto}
  .btn{display:block;width:100%;padding:19px;border:none;border-radius:14px;background:var(--teal);color:#fff;font-size:20px;font-weight:800;cursor:pointer}
  .btn:disabled{opacity:.5}
  .btn2{background:#fff;color:var(--teal-d);border:2px solid var(--teal)}
  .hint{font-size:15px;color:var(--muted);line-height:1.5;margin-top:6px}
  .err{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:12px;padding:14px 16px;font-size:16px;margin-bottom:16px}
  /* Startbildschirm */
  .start{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .code-in{font-size:46px;font-weight:800;letter-spacing:.32em;text-align:center;width:300px;max-width:90vw;padding:18px 10px;margin:8px 0 6px}
  .ws{border:1px dashed var(--line);border-radius:14px;padding:16px;margin-bottom:14px;position:relative}
  .ws .del{position:absolute;top:10px;right:10px;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:9px;padding:6px 11px;font-size:14px;font-weight:700;cursor:pointer}
  .addbtn{background:#f0fdfa;color:var(--teal-d);border:1.5px dashed var(--teal);border-radius:12px;padding:13px;width:100%;font-size:16px;font-weight:700;cursor:pointer}
  /* Unterschrift */
  .sigwrap{border:2px solid var(--line);border-radius:14px;background:#fff;touch-action:none;position:relative}
  .sigwrap canvas{display:block;width:100%;height:210px;border-radius:12px}
  .sig-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#cbd5e1;font-size:17px;pointer-events:none}
  .state{text-align:center;padding:70px 22px;color:var(--muted)}
  .state .big{font-size:64px;margin-bottom:14px}
  .state h1{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="logo">T</div><div class="brand">TIVE 360°</div><div style="margin-left:auto;font-size:14px;color:var(--muted)" id="stationTag"></div></div>
  <div id="app"><div class="state"><div class="big">⏳</div>Lädt…</div></div>
</div>
<script>
const SB_URL='https://msdiyjxckmpvuomnhvjp.supabase.co';
const SB_KEY='sb_publishable_exKYOG6Znhj_JlO0v6erQQ_q0HWWiyl';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const app=document.getElementById('app');
const STATION=new URLSearchParams(location.search).get('s')||'';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let CURRENT=null;   // geladenes Bewerberprofil

function stateBox(icon,title,text,btn){ app.innerHTML='<div class="state"><div class="big">'+icon+'</div><h1>'+esc(title)+'</h1><p class="sub" style="margin-top:10px">'+esc(text)+'</p>'
  +(btn?'<button class="btn" style="max-width:360px;margin:18px auto 0" onclick="startScreen()">'+esc(btn)+'</button>':'')+'</div>'; }

const LEVELS=['A1','A2','B1','B2','C1','C2','Muttersprache'];
const EDU=['Schulabschluss','Berufsausbildung','Bachelor','Master','Andere'];
function opts(list,val){ return '<option value="">– bitte wählen –</option>'+list.map(x=>'<option'+(String(val)===x?' selected':'')+'>'+x+'</option>').join(''); }
function field(label,id,type,val,ph){ return '<label class="f"><span>'+label+'</span><input id="f_'+id+'" type="'+type+'" value="'+esc(val)+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+'/></label>'; }
function area(label,id,val,ph){ return '<label class="f"><span>'+label+'</span><textarea id="f_'+id+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+'>'+esc(val)+'</textarea></label>'; }
function sel(label,id,list,val){ return '<label class="f"><span>'+label+'</span><select id="f_'+id+'">'+opts(list,val)+'</select></label>'; }
const gv=id=>{ const e=document.getElementById('f_'+id); return e?e.value.trim():undefined; };

// ── Startbildschirm: Manager gibt die Bewerbernummer ein ──
function startScreen(){
  CURRENT=null;
  app.innerHTML='<div class="start">'
    +'<h1>Bewerber vor Ort</h1>'
    +'<p class="sub">Bitte die <b>Bewerbernummer</b> eingeben. Sie steht am Profil.</p>'
    +'<div id="startErr"></div>'
    +'<input class="code-in" id="codeIn" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="000000"/>'
    +'<button class="btn" style="max-width:360px;margin-top:14px" id="loadBtn" onclick="loadCode()">Profil laden</button>'
    +'</div>';
  const inp=document.getElementById('codeIn');
  inp.addEventListener('input',()=>{ inp.value=inp.value.replace(/\D/g,'').slice(0,6); });
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') loadCode(); });
  inp.focus();
}
function startErr(m){ const e=document.getElementById('startErr'); if(e) e.innerHTML='<div class="err" style="max-width:360px;margin:0 auto 12px">'+esc(m)+'</div>'; }

async function loadCode(){
  const code=(document.getElementById('codeIn').value||'').replace(/\D/g,'');
  if(code.length!==6){ return startErr('Bitte eine 6-stellige Nummer eingeben.'); }
  const btn=document.getElementById('loadBtn'); btn.disabled=true; btn.textContent='Lädt …';
  let res; try{ res=await sb.rpc('vorort_lookup',{p_station:STATION,p_code:code}); }catch(e){ res={error:e}; }
  btn.disabled=false; btn.textContent='Profil laden';
  const d=res&&res.data;
  if(res.error||!d){ return startErr('Verbindungsfehler. Bitte erneut versuchen.'); }
  if(!d.ok){
    if(d.code==='station') return stateBox('🔒','Tablet nicht freigeschaltet','Dieser Link hat kein gültiges Stations-Token. Bitte an die IT wenden.');
    if(d.code==='locked')  return startErr('Zu viele Fehlversuche. Bitte ein paar Minuten warten.');
    return startErr('Kein Profil zu dieser Nummer. Bitte Nummer prüfen.');
  }
  CURRENT=d.cv; renderForm(d.cv);
}

// ── Berufsstationen (dynamische Liste) ──
function wsRow(w){ w=w||{}; return '<div class="ws">'
  +'<button type="button" class="del" onclick="this.parentNode.remove()">Entfernen</button>'
  +'<label class="f"><span>Unternehmen</span><input class="ws-company" type="text" value="'+esc(w.company)+'"/></label>'
  +'<div class="row"><label class="f"><span>Von</span><input class="ws-from" type="month" value="'+esc(w.from)+'"/></label>'
  +'<label class="f"><span>Bis</span><input class="ws-to" type="month" value="'+esc(w.to)+'"/></label></div>'
  +'<label class="f" style="margin-bottom:0"><span>Aufgaben</span><textarea class="ws-tasks">'+esc(w.tasks)+'</textarea></label>'
  +'</div>'; }
function addWs(){ const box=document.getElementById('wsList'); box.insertAdjacentHTML('beforeend', wsRow()); }
function collectWs(){ const out=[]; document.querySelectorAll('#wsList .ws').forEach(el=>{
  const company=(el.querySelector('.ws-company').value||'').trim();
  const from=(el.querySelector('.ws-from').value||'').trim();
  const to=(el.querySelector('.ws-to').value||'').trim();
  const tasks=(el.querySelector('.ws-tasks').value||'').trim();
  if(company||from||to||tasks) out.push({company,from,to,tasks}); }); return out; }

// ── Unterschrift (Fingerzeichnung) ──
let sigCtx=null, sigDrawn=false;
function initSig(){
  const cv=document.getElementById('sigCanvas'); if(!cv) return;
  const ratio=window.devicePixelRatio||1; const r=cv.getBoundingClientRect();
  cv.width=Math.round(r.width*ratio); cv.height=Math.round(r.height*ratio);
  sigCtx=cv.getContext('2d'); sigCtx.scale(ratio,ratio); sigCtx.lineWidth=2.6; sigCtx.lineCap='round'; sigCtx.lineJoin='round'; sigCtx.strokeStyle='#0f172a';
  let drawing=false, lx=0, ly=0;
  const pos=e=>{ const b=cv.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-b.left, y:t.clientY-b.top}; };
  const down=e=>{ e.preventDefault(); drawing=true; const p=pos(e); lx=p.x; ly=p.y; };
  const move=e=>{ if(!drawing) return; e.preventDefault(); const p=pos(e); sigCtx.beginPath(); sigCtx.moveTo(lx,ly); sigCtx.lineTo(p.x,p.y); sigCtx.stroke(); lx=p.x; ly=p.y;
    if(!sigDrawn){ sigDrawn=true; const ph=document.getElementById('sigPh'); if(ph) ph.style.display='none'; } };
  const up=()=>{ drawing=false; };
  cv.addEventListener('mousedown',down); cv.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  cv.addEventListener('touchstart',down,{passive:false}); cv.addEventListener('touchmove',move,{passive:false}); cv.addEventListener('touchend',up);
}
function clearSig(){ if(!sigCtx) return; const cv=document.getElementById('sigCanvas'); sigCtx.clearRect(0,0,cv.width,cv.height); sigDrawn=false; const ph=document.getElementById('sigPh'); if(ph) ph.style.display='flex'; }
function todayStr(){ const d=new Date(); return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear(); }
const SIG_STATEMENT='Hiermit bestätige ich, dass die Angaben korrekt und vollständig sind.';

function renderForm(cv){
  const c=cv||{}; const first=c.first_name||''; const ex=c.extra||{};
  const cards=[];
  // Kontakt (inkl. Name/Telefon korrigierbar) + Adresse
  cards.push('<div class="card"><h2>Person und Kontakt</h2>'
    +'<div class="row">'+field('Vorname','first_name','text',c.first_name)+field('Nachname','last_name','text',c.last_name)+'</div>'
    +'<div class="row">'+field('E-Mail','email','email',c.email)+field('Telefon','phone','tel',c.phone)+'</div>'
    +field('Straße und Hausnummer','street','text',c.street)
    +'<div class="row3">'+field('PLZ','postal_code','text',c.postal_code)+field('Ort','city','text',c.city)+field('Land','country','text',c.country)+'</div>'
    +field('Geburtsdatum','birthday','date',c.birthday)
    +'</div>');
  // Sprache
  cards.push('<div class="card"><h2>Sprache</h2>'
    +sel('Deutsch – Sprechen','language_level',LEVELS,c.language_level)
    +sel('Deutsch – Schreiben (Selbsteinschätzung)','writing_level',LEVELS,c.writing_level)
    +field('Weitere Sprachen','languages_str','text',c.languages_str,'z. B. Englisch B2, Albanisch Muttersprache')+'</div>');
  // Ausbildung
  cards.push('<div class="card"><h2>Ausbildung</h2>'
    +field('Ausbildung / Beruf','education','text',c.education,'z. B. BWL, IT, Kaufmann/-frau')
    +sel('Abschluss','education_level',EDU,c.education_level)+'</div>');
  // Erfahrung + Berufsstationen
  const ws=Array.isArray(ex.work_stations)&&ex.work_stations.length?ex.work_stations:[{}];
  cards.push('<div class="card"><h2>Erfahrung</h2>'
    +field('Berufserfahrung (Jahre)','experience_years','number',c.experience_years,'z. B. 2')
    +'<div style="font-size:15px;font-weight:700;color:var(--muted);margin:6px 0 10px">Berufsstationen</div>'
    +'<div id="wsList">'+ws.map(wsRow).join('')+'</div>'
    +'<button type="button" class="addbtn" onclick="addWs()">+ Weitere Station</button>'
    +'<label class="f" style="margin-top:16px"><span>Zusätzliche Notizen zur Erfahrung (optional)</span><textarea id="f_work_history">'+esc(c.work_history)+'</textarea></label>'
    +'</div>');
  // Verfügbarkeit
  cards.push('<div class="card"><h2>Verfügbarkeit</h2>'
    +'<div class="row">'+field('Frühester Start','available_from','date',c.available_from)+sel('Arbeitsmodell','homeoffice_pref',['Vor Ort','Homeoffice','Hybrid'],c.homeoffice_pref)+'</div>'
    +sel('Stunden pro Tag','work_hours',['4','5','6','7','8'],ex.work_hours)
    +'<label class="chk"><input type="checkbox" id="f_weekend"'+(ex.weekend?' checked':'')+'/> Kann am <b>Samstag</b> arbeiten</label>'
    +'<label class="chk"><input type="checkbox" id="f_sunday"'+(ex.sunday?' checked':'')+'/> Kann am <b>Sonntag / Feiertag</b> arbeiten</label>'+'</div>');
  // Schriftprobe
  cards.push('<div class="card"><h2>Schriftprobe</h2>'
    +area('Ein paar Sätze','writing_sample',ex.writing_sample,'Warum passt der Kundenservice? 3–4 Sätze auf Deutsch.')+'</div>');
  // Unterschrift (nur Tablet)
  cards.push('<div class="card"><h2>Bestätigung und Unterschrift</h2>'
    +'<p style="font-size:17px;line-height:1.5;margin:0 0 14px">'+esc(SIG_STATEMENT)+'</p>'
    +'<div class="sigwrap"><canvas id="sigCanvas"></canvas><div class="sig-ph" id="sigPh">Hier mit dem Finger unterschreiben</div></div>'
    +'<div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px">'
      +'<span class="hint" style="margin:0">Datum: <b>'+todayStr()+'</b></span>'
      +'<button type="button" class="btn2" style="width:auto;padding:9px 16px;font-size:15px" onclick="clearSig()">Löschen</button></div>'
    +'</div>');

  app.innerHTML='<h1>'+esc((first+' '+(c.last_name||'')).trim()||'Bewerber')+'</h1>'
    +'<p class="sub">Nr. '+esc(c.public_code)+' · Bitte alle Angaben prüfen, korrigieren und ergänzen. Danach unten unterschreiben und absenden.</p>'
    +'<div id="formErr"></div>'
    +cards.join('')
    +'<button class="btn" id="submitBtn" onclick="submitForm()">Absenden</button>'
    +'<button class="btn btn2" style="margin-top:12px" onclick="startScreen()">Abbrechen</button>'
    +'<p class="hint" style="text-align:center;margin-top:16px">Alle Angaben werden erst beim Absenden übertragen.</p>';
  window.scrollTo(0,0);
  initSig();
}

async function submitForm(){
  if(!CURRENT){ return; }
  const formErr=m=>{ document.getElementById('formErr').innerHTML='<div class="err">'+esc(m)+'</div>'; window.scrollTo(0,0); };
  if(!sigDrawn){ return formErr('Bitte unterschreiben, bevor du absendest.'); }
  const btn=document.getElementById('submitBtn'); btn.disabled=true; btn.textContent='Sende …';
  let sigImg=''; try{ sigImg=document.getElementById('sigCanvas').toDataURL('image/png'); }catch(e){}
  const data={
    first_name:gv('first_name'), last_name:gv('last_name'), email:gv('email'), phone:gv('phone'),
    street:gv('street'), postal_code:gv('postal_code'), city:gv('city'), country:gv('country'),
    birthday:gv('birthday'), language_level:gv('language_level'), writing_level:gv('writing_level'),
    languages_str:gv('languages_str'), education:gv('education'), education_level:gv('education_level'),
    experience_years:gv('experience_years'), work_history:gv('work_history'),
    available_from:gv('available_from'), homeoffice_pref:gv('homeoffice_pref'),
    extra:{
      work_hours:gv('work_hours'),
      weekend:(document.getElementById('f_weekend')||{}).checked,
      sunday:(document.getElementById('f_sunday')||{}).checked,
      writing_sample:gv('writing_sample'),
      work_stations:collectWs(),
      vorort_signature:{ statement:SIG_STATEMENT, signed_at:new Date().toISOString(), date:todayStr(), image:sigImg }
    }
  };
  let res; try{ res=await sb.rpc('vorort_submit',{p_station:STATION,p_code:CURRENT.public_code,p_data:data}); }catch(e){ res={error:e}; }
  const d=res&&res.data;
  if(res.error||!d||!d.ok){ btn.disabled=false; btn.textContent='Absenden'; return formErr((d&&d.code==='station')?'Stations-Token ungültig.':'Speichern fehlgeschlagen. Bitte erneut versuchen.'); }
  stateBox('✅','Gespeichert','Die Angaben wurden übernommen. Danke!','Nächster Bewerber');
}

(function init(){
  if(!STATION){ return stateBox('🔒','Kein Stations-Token','Dieser Tablet-Link ist unvollständig. Bitte an die IT wenden.'); }
  document.getElementById('stationTag').textContent='Empfangs-Tablet';
  startScreen();
})();
</script>
</body>
</html>
