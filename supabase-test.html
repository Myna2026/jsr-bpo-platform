<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIVE 360° — Supabase Verbindungstest</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,-apple-system,sans-serif;background:#0B454E;color:#E4EEF0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.card{background:#0F5661;border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:32px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.35);}
h1{font-size:20px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:8px;}
.sub{font-size:13px;color:#5EA3AF;margin-bottom:22px;}
.status{padding:16px 18px;border-radius:12px;font-size:14px;font-weight:600;line-height:1.5;display:flex;gap:10px;align-items:flex-start;}
.status.pending{background:rgba(94,163,175,.15);color:#5EA3AF;}
.status.ok{background:rgba(34,197,94,.16);color:#4ade80;}
.status.err{background:rgba(239,68,68,.16);color:#f87171;}
.dot{font-size:18px;line-height:1.3;}
pre{margin-top:16px;background:rgba(0,0,0,.28);border-radius:10px;padding:14px;font-size:12px;color:#9fc7cf;overflow:auto;white-space:pre-wrap;word-break:break-word;font-family:'JetBrains Mono',ui-monospace,monospace;}
.meta{margin-top:16px;font-size:11px;color:#5EA3AF;line-height:1.6;}
.meta code{color:#8fd0dc;}
</style>
</head>
<body>
<div class="card">
  <h1>▚ TIVE 360° — Supabase</h1>
  <div class="sub">Verbindungstest (Publishable Key / EU-Frankfurt)</div>
  <div id="status" class="status pending"><span class="dot">◌</span><span id="msg">Verbinde mit Supabase…</span></div>
  <pre id="detail" style="display:none"></pre>
  <div class="meta">
    Getestet wird eine anonyme REST-Query.<br>
    <code>PGRST205 / relation does not exist</code> = <b>verbunden</b> (Tabelle folgt im Schema-Schritt).<br>
    <code>Invalid API key / 401</code> = Key-Problem (dann anderer Key nötig).
  </div>
</div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://msdiyjxckmpvuomnhvjp.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_exKYOG6Znhj_JlO0v6erQQ_q0HWWiyl';

const statusEl = document.getElementById('status');
const msgEl = document.getElementById('msg');
const detailEl = document.getElementById('detail');

function show(kind, dot, text, detail){
  statusEl.className = 'status ' + kind;
  statusEl.querySelector('.dot').textContent = dot;
  msgEl.textContent = text;
  if(detail){ detailEl.style.display='block'; detailEl.textContent = detail; }
}

try {
  const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  // Query auf noch nicht existierende Tabelle: beweist erreichbare DB + gültigen Key.
  const { data, error } = await supabase.from('roles_definitions').select('*').limit(1);

  if (!error) {
    show('ok', '✓', 'Connected to Supabase — Tabelle roles_definitions existiert bereits.',
         JSON.stringify(data, null, 2));
  } else {
    const m = (error.message || '').toLowerCase();
    const invalidKey = m.includes('invalid api key') || m.includes('jwt') || error.status === 401;
    if (invalidKey) {
      show('err', '✕', 'Key-Problem — Supabase lehnt den Key ab (Variante 2).',
           JSON.stringify(error, null, 2));
    } else {
      // z. B. PGRST205 / 42P01 = verbunden, Tabelle fehlt noch → erwartet
      show('ok', '✓', 'Connected to Supabase — Verbindung steht (Tabelle folgt im Schema-Schritt).',
           JSON.stringify(error, null, 2));
    }
  }
} catch (e) {
  show('err', '✕', 'Network/Client-Fehler — keine Verbindung.',
       (e && e.message) ? e.message : String(e));
}
</script>
</body>
</html>
